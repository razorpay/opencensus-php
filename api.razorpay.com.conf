<VirtualHost *:80>
	ServerName api.razorpay.com
	ServerAdmin root@razorpay.com
	DocumentRoot /home/abhshkdz/projects/razorpay/api/public
	<Directory /home/abhshkdz/projects/razorpay/api/public>
		#Do not show indexes
		#Do not follow symlinks
		Options -Indexes -MultiViews
		AllowOverride None
		Require local
		<IfModule mod_rewrite.c>
			RewriteEngine on
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{REQUEST_FILENAME} !-d
			RewriteCond $1 !^(index\.php)
			RewriteRule ^(.*)$ index.php/$1 [L]
		</IfModule>
	</Directory>
	ErrorLog /var/log/apache2/api.error.log

	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel warn
	CustomLog /var/log/apache2/api.access.log combined
</VirtualHost>
