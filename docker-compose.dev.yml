version: '2'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    links:
      - db_live
      - db_test
    ports:
      - "8090:80"
    depends_on:
      - db_live
      - db_test
    environment:
      DB_LIVE_HOST: db_live
      DB_LIVE_DATABASE: api
      DB_LIVE_USERNAME: api
      DB_LIVE_PASSWORD: 123
      SLAVE_DB_LIVE_HOST: db_live
      SLAVE_DB_LIVE_DATABASE: api
      SLAVE_DB_LIVE_USERNAME: api
      SLAVE_DB_LIVE_PASSWORD: 123
      DB_TEST_HOST: db_test
      DB_TEST_DATABASE: api-test
      DB_TEST_USERNAME: api-test
      DB_TEST_PASSWORD: 123
      SLAVE_DB_TEST_HOST: db_test
      SLAVE_DB_TEST_DATABASE: api-test
      SLAVE_DB_TEST_USERNAME: api-test
      SLAVE_DB_TEST_PASSWORD: 123
  db_live:
    image: mysql:5.6
    ports:
      - 13306:3306
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: api
      MYSQL_USER: api
      MYSQL_PASSWORD: 123

  db_test:
    image: mysql:5.6
    ports:
      - 13307:3306
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: api-test
      MYSQL_USER: api-test
      MYSQL_PASSWORD: 123
