log_format dashboard '$http_x_forwarded_for - $remote_user [$time_local] '
            '"$request" $status $body_bytes_sent "$http_referer" $upstream_http_x_http_status $upstream_http_x_request_id '
            '"$http_user_agent"' ;

server {
    listen      80;
    server_name tnc.razorpay.com tnc.func.razorpay.in;

    root "/app/public";

    index index.html index.htm index.php;

    charset utf-8;

    access_log /dev/stdout dashboard;
    error_log  stderr error;

    location / {
	    return 404;
    }

    location ~ "^/tnc/([0-9a-zA-Z]{14})$" {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php7.0-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Allows the actual hostname to pass in SERVER_NAME
        fastcgi_param SERVER_NAME $host;

        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80 default_server;

    root "/app/public";

    index index.html index.htm index.php;

    charset utf-8;

    gzip on;
    gzip_comp_level 2;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    location /commit.txt {
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    access_log /dev/stdout dashboard;
    error_log  stderr error;

    sendfile off;

    client_max_body_size 100m;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php7.0-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Allows the actual hostname to pass in SERVER_NAME
        fastcgi_param SERVER_NAME $host;

        fastcgi_intercept_errors off;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
