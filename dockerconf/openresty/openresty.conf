user nginx;
pid /run/openresty.pid;
worker_processes auto;

events {
    worker_connections 2048;
}

# These environment variables(with defaults) are made available to lua module.
env RESTY_REDIS_TIMEOUT_MS;
env RESTY_REDIS_HOST;
env RESTY_REDIS_PORT;
env RESTY_REDIS_PASSWORD;
env RESTY_REDIS_MAX_IDLE_MS;
env RESTY_REDIS_POOL_SIZE;

http {
    include mime.types;
    default_type application/octet-stream;

    resolver local=on;
    # proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_connect_timeout 600s;
    proxy_read_timeout 600s;

    keepalive_requests 100;
    keepalive_timeout 5s;
    # client_body_timeout 60s;
    # send_timeout 60s;
    # port_in_redirect off;

    sendfile on;
    tcp_nodelay on;
    tcp_nopush on;

    # Turn this value off after a few days of monitoring.
    lua_socket_log_errors on;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    include ../sites/*;
}
