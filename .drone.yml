  build:
    image: plugins/docker
    group: A
    repo: razorpay/api
    secrets: [docker_username, docker_password, git_token]
    build_args_from_env: [git_token]
    build_args:
     - GIT_COMMIT_HASH=${DRONE_COMMIT_SHA}
    tags: ${DRONE_COMMIT_SHA}
    when:
      status: [success]
      event:
        exclude: [deployment, pull_request]
        include: [push]
  rebuild-cache:
      image: razorpay/containers:drone-s3-cache
      endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
      path: "/rzp/api/${DRONE_BUILD_CREATED:0:5}/"
      secrets:
        - aws_region
        - aws_access_key_id
        - aws_secret_access_key
      rebuild: true
      mount:
        - .composer/cache
      when:
        event: push
  build-notify:
    image: plugins/slack
    secrets: [slack_webhook]
    channel: tech_builds
    username: drone
    icon_url: https://avatars2.githubusercontent.com/u/2181346?s=200&v=4
    template: >
      {{#success build.status}}
        Build succeeded.
      {{else}}
        Build failed.
      {{/success}}
        Build No:{{build.number}}
        Branch: {{build.branch}}
        Commit: {{build.commit}}
        Author: {{build.author}}
        Started at: {{build.started}}
        Time taken: {{since build.started}}
        Link: {{build.link}}
    when:
      event:
        include: [push]
  build-notify-master:
      image: plugins/slack
      secrets: [slack_webhook]
      channel: tech_backend
      username: drone
      icon_url: https://avatars2.githubusercontent.com/u/2181346?s=200&v=4
      template: >
          Master Build failed.
          Build No:{{build.number}}
          Branch: {{build.branch}}
          Commit: {{build.commit}}
          Author: {{build.author}}
          Started at: {{build.started}}
          Time taken: {{since build.started}}
          Link: {{build.link}}
      when:
        branch: master
        status: [failure]
