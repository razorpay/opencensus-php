pipeline:
  test:
    image: razorpay/containers:php7
    secrets: [docker_username, docker_password, git_token, rzp_api]
    environment:
      - DB_LIVE_HOST=livedb
      - DB_TEST_HOST=testdb
      - DB_AUTH_HOST=livedb
      - REDIS_HOST=redis
      - ES_HOST=elasticsearch
      - ES_AUDIT_HOST=elasticsearch
    commands:
      - cp ./environment/.env.drone ./environment/.env.testing
      - touch /etc/php7/conf.d/assertion.ini
      - echo "zend.assertions=1" >> /etc/php7/conf.d/assertion.ini
      - echo "assert.exception=On" >> /etc/php7/conf.d/assertion.ini
      - cp scripts/nanotime.* /usr/lib/php7/modules
      - touch /etc/php7/conf.d/nanotime.ini
      - echo -n "extension=nanotime.so" >> /etc/php7/conf.d/nanotime.ini
      - php -m
      - composer config -g github-oauth.github.com $GIT_TOKEN
      - composer install --no-interaction
      - php -d memory_limit=1024M vendor/phpunit/phpunit/phpunit --debug --verbose
  build:
    image: plugins/docker
    repo: razorpay/api
    build_args:
     - GIT_COMMIT_HASH=$DRONE_COMMIT_SHA
    secrets: [docker_username, docker_password, git_token]
    build_args_from_env: [git_token]
    tags: ${DRONE_REPO_BRANCH}-${DRONE_COMMIT_SHA}
    when:
      status: [success]
  build-notify:
    image: plugins/slack
    secrets: [slack_webhook]
    channel: dev-test-2
    username: drone
    icon_url: https://avatars2.githubusercontent.com/u/2181346?s=200&v=4
    template: >
      {{#success build.status}}
        Build succeeded.
      {{else}}
        Build failed.
      {{/success}}
        Build No:{{build.number}}
        Branch: {{build.branch}}
        Commit: {{build.commit}}
        Author: {{build.author}}
        Started at: {{build.started}}
        Time taken: {{since build.started}}
        Link: {{build.link}}
services:
  livedb:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
  testdb:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
  redis:
    image: redis
  elasticsearch:
    image: elasticsearch:5.2-alpine
pipeline:
        deploy-qa:
          image: razorpay/drone-kubernetes
          pull: true
          secrets:
            - docker_username
            - docker_password
            - kubernetes_server_qa
            - kubernetes_server_cert_qa
            - kubernetes_client_cert
            - kubernetes_client_key
          kubernetes_user: drone
          kubernetes_server: $KUBERNETES_SERVER_QA
          kubernetes_cert: $KUBERNETES_SERVER_CERT_QA
          kubernetes_client_cert: $KUBERNETES_CLIENT_CERT
          kubernetes_client_key: $KUBERNETES_CLIENT_KEY
          deployment: api
          repo: razorpay/api
          container: razorpay/api
          namespace: func
          tag:
            - ${DRONE_COMMIT_SHA}
          when:
            branch: [ drone ]
