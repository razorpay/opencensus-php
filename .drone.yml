pipeline:
  # TODO: This file can be generated without
  # running this, since it is a simple templated
  # JSON file
  generate-composer-auth-file:
    image: razorpay/pithos:rzp-php7.1
    secrets: [GIT_TOKEN]
    commands:
      - composer config -g "github-oauth.github.com" "$GIT_TOKEN"
      - cp /root/.composer/auth.json /drone/src/github.com/razorpay/dashboard/composer-auth.json
      - sha1sum /drone/src/github.com/razorpay/dashboard/composer-auth.json
    when:
      event: push

  npm-ci:
    group: ci
    # TODO: Get the source for this image and push it
    # to razorpay
    image: node:12.19.0
    pull: false
    environment:
      VERSION: ${DRONE_COMMIT_SHA}
    secrets: [npm_razorpay_token]
    commands:
      - npm config set unsafe-perm true
      - npm config set cache npm_cache
      # Root directory
      - npm ci

  build-js-signup:
    group: build-and-test
    # TODO: Get the source for this image and push it
    # to razorpay
    image: node:12.19.0
    pull: false
    environment:
      VERSION: ${DRONE_COMMIT_SHA}
    secrets: [npm_razorpay_token]
    commands:
      # Web directory
      - node signup.js
    when:
      event: push

  build-js-merchant:
    group: build-and-test
    # TODO: Get the source for this image and push it
    # to razorpay
    image: node:12.19.0
    pull: false
    environment:
      VERSION: ${DRONE_COMMIT_SHA}
    secrets: [npm_razorpay_token]
    commands:
      # Web directory
      - cd web && STAGE=production npm run build:merchant
    when:
      event: push

  build-js-merchantLA:
    group: build-and-test
    # TODO: Get the source for this image and push it
    # to razorpay
