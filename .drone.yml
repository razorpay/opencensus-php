pipeline:
  restore_cache:
    image: razorpay/containers:drone-s3-cache
    restore: true
    mount:
      - docker_cache
      - npm_cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: /rzp/dashboard/
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
    when:
      event: push, deploy
  # TODO: This file can be generated without
  # running this, since it is a simple templated
  # JSON file
  generate-composer-auth-file:
    image: razorpay/pithos:rzp-php7.1
    secrets: [docker_username, docker_password, git_token]
    commands:
      - composer config -g "github-oauth.github.com" "$GIT_TOKEN"
      - cp /root/.composer/auth.json /drone/src/github.com/razorpay/dashboard/composer-auth.json
      - sha1sum /drone/src/github.com/razorpay/dashboard/composer-auth.json
  verify-composer-auth-file:
    image: alpine:3.7
    commands:
      - sha1sum composer-auth.json
      - stat composer-auth.json
      - ls -la composer-auth.json
  build-js:
    group: build
    image: pronav/dash
    pull: false
    environment:
      CHROME_BIN: /usr/bin/chromium
    commands:
      - npm config set cache npm_cache
      - npm install
      - npm install --global gulp
      - npm link gulp
      - cd web
      - npm link gulp
      - npm install
      - cd ..
      - npm run build
      - npm test
  build:
    group: build
    image: plugins/docker
    repo: razorpay/dashboard
    secrets: [docker_username, docker_password, git_token]
    build_args_from_env: [git_token]
    environment:
    # Makes sure that the docker volume cache survives this run
      PLUGIN_STORAGE_PATH: /drone/src/github.com/razorpay/dashboard/docker_cache
    build_args:
     - GIT_COMMIT_HASH=${DRONE_COMMIT_SHA}
    tags: ${DRONE_COMMIT_SHA}
    compress: true
    # Ensures that docker prune is called at the end of the build
    docker:
      purge: false
    when:
      status: [success]
      event: push
  cleanup:
    image: alpine:3.7
    environment:
    # Makes sure that the docker volume cache survives this run
      PLUGIN_STORAGE_PATH: /drone/src/github.com/razorpay/dashboard/docker_cache
    commands:
      - rm /drone/src/github.com/razorpay/dashboard/composer-auth.json
      - du -d2 $PLUGIN_STORAGE_PATH
  # This step is used to do a limited prune
  # so that the cache is not filled with extra layers
  docker-cleanup:
    image: docker:17.12.0-ce-dind
    environment:
    # Makes sure that the docker volume cache survives this run
      PLUGIN_STORAGE_PATH: /drone/src/github.com/razorpay/dashboard/docker_cache
    commands:
      - /usr/local/bin/dockerd --data-root $PLUGIN_STORAGE_PATH
      - docker version
      - docker info
      - docker images
      - docker history "razorpay/dashboard:${DRONE_COMMIT_SHA}"
    # Disable this for now
    when:
        event: never
  rebuild-cache:
    image: razorpay/containers:drone-s3-cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: '/rzp/dashboard/'
    secrets:
      - aws_region
      - aws_access_key_id
      - aws_secret_access_key
    rebuild: true
    mount:
      - docker_cache
      - npm_cache
    when:
      event: push
  # This is a trick step to use the artifacts from the above step
  # Since we have pushed this image above, we can use the same
  # without pulling it
  deploy-s3-beta:
    image: "razorpay/dashboard:${DRONE_COMMIT_SHA}"
    pull: false
    environment:
        - AWS_CDN_BUCKET=betacdn
        - AWS_CLOUDFRONT_DISTRIBUTION_ID=E3RC1ED30HJGHJ
        - CDN_DASHBOARD_URL=https://betacdn.razorpay.com/dashboard
    secrets: [AWS_KEY, AWS_SECRET]
    commands:
        # Requirements for running s3sync.js
        - npm install multi-glob aws-sdk
        # Show what all will get synced
        - ls -laR public/dist/
        - ls -laR public/js/generated/
        - ls -laR public/css/generated/
        - ./s3sync.js
    when:
      environment: never
      event:
        exclude: [push]
        include: [deployment]
  deploy-s3-prod:
    image: "razorpay/dashboard:${DRONE_COMMIT_SHA}"
    pull: false
    environment:
        - AWS_CDN_BUCKET=checkout-live
        - AWS_CLOUDFRONT_DISTRIBUTION_ID=E34MFQ6HI02NUZ
        - CDN_DASHBOARD_URL=https://cdn.razorpay.com/dashboard
    secrets: [AWS_KEY, AWS_SECRET]
    commands:
        - cd /app/
        # Have to re-install npm
        - apk add nodejs-current nodejs-npm
        # Requirements for running s3sync.js
        - npm install multi-glob aws-sdk
        # Show what all will get synced
        - ls -laR public/dist/
        - ls -laR public/js/generated/
        - ls -laR public/css/generated/
        - ./s3sync.js
    when:
      # Disable this step
      environment: never
      event:
        exclude: [push]
        include: [deployment]
  deploy-beta:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_stage
      - server_cert_stage
      - client_cert_stage
      - client_key_stage
    user: drone
    cluster: stage
    auth_mode: client-cert
    deployment: dashboard
    repo: razorpay/dashboard
    namespace: beta
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: beta
      event:
        exclude: [push]
        include: [deployment]
  deploy-prod:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_prod
      - server_cert_prod
      - client_cert_prod
      - client_key_prod
    user: drone
    cluster: prod
    auth_mode: client-cert
    deployment: dashboard
    repo: razorpay/dashboard
    namespace: dashboard
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: prod
      event:
        exclude: [push]
        include: [deployment]
  deploy-qa-func:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_qa
      - server_cert_qa
      - client_cert_qa
      - client_key_qa
    user: drone
    cluster: qa
    auth_mode: client-cert
    deployment: dashboard
    repo: razorpay/dashboard
    namespace: func
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: qa-func
      event:
        exclude: [push]
        include: [deployment]
  build-notify:
    image: plugins/slack
    secrets: [slack_webhook]
    channel: tech_builds
    username: drone
    icon_url: https://avatars2.githubusercontent.com/u/2181346?s=200&v=4
    template: >
      {{#success build.status}}
        Build succeeded.
      {{else}}
        Build failed.
      {{/success}}
        Build No:{{build.number}}
        Branch: {{build.branch}}
        Commit: {{build.commit}}
        Author: {{build.author}}
        Started at: {{build.started}}
        Time taken: {{since build.started}}
        Link: {{build.link}}
    when:
      event:
        exclude: [deployment]
        include: [push, tag]
  build-falcon-notify:
    image: plugins/webhook
    urls:
      - https://falcon.razorpay.com/update
    secrets:
      - plugin_headers
    when:
      status: [ success, failure ]
