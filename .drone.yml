pipeline:
  restore_cache:
    image: razorpay/containers:drone-s3-cache
    restore: true
    mount:
      - .composer/cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: "/rzp/api/${DRONE_BUILD_CREATED:0:5}/"
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
    when:
      event: push
  test_default:
    group: A
    image: razorpay/pithos:rzp-php7.1
    pull: true
    secrets: [docker_username, docker_password, git_token, rzp_api]
    environment:
      - DB_LIVE_HOST=livedb
      - DB_TEST_HOST=testdb
      - DB_AUTH_HOST=authdb
      - REDIS_HOST=redis
      - ES_HOST=elasticsearch
      - ES_AUDIT_HOST=elasticsearch
    commands:
      - cp ./environment/.env.drone ./environment/.env.testing
      - touch /etc/php7/conf.d/assertion.ini
      - echo "zend.assertions=1" >> /etc/php7/conf.d/assertion.ini
      - echo "assert.exception=On" >> /etc/php7/conf.d/assertion.ini
      - php -m
      - export COMPOSER_CACHE_DIR=".composer/cache"
      - mkdir -p $COMPOSER_CACHE_DIR
      - chmod 777 -R storage
      - composer config --global github-oauth.github.com $GIT_TOKEN
      - composer install --no-interaction --optimize-autoloader
      - mkdir -p /opt/razorpay/certs/first_data
      - php -d memory_limit=2048M vendor/phpunit/phpunit/phpunit --debug --testsuite "Application Test Suite" --verbose --printer="Codedungeon\\PHPUnitPrettyResultPrinter\\Printer"
    when:
      event:
        exclude: [deployment, tag, pull_request]
        include: [push]
  test_payments:
    group: A
    image: razorpay/pithos:rzp-php7.1
    pull: true
    secrets: [docker_username, docker_password, git_token, rzp_api]
    environment:
      - DB_LIVE_HOST=livedb2
      - DB_TEST_HOST=testdb2
      - DB_AUTH_HOST=authdb
      - REDIS_HOST=redis2
      - ES_HOST=elasticsearch2
      - ES_AUDIT_HOST=elasticsearch2
    commands:
      - cp ./environment/.env.drone ./environment/.env.testing
      - touch /etc/php7/conf.d/assertion.ini
      - echo "zend.assertions=1" >> /etc/php7/conf.d/assertion.ini
      - echo "assert.exception=On" >> /etc/php7/conf.d/assertion.ini
      - php -m
      - export COMPOSER_CACHE_DIR=".composer/cache"
      - mkdir -p $COMPOSER_CACHE_DIR
      - chmod 777 -R storage
      - composer config --global github-oauth.github.com $GIT_TOKEN
      - composer install --no-interaction --optimize-autoloader
      - mkdir -p /opt/razorpay/certs/first_data
      - php -d memory_limit=2048M vendor/phpunit/phpunit/phpunit --debug --testsuite "Payment Test Suite" --verbose --printer="Codedungeon\\PHPUnitPrettyResultPrinter\\Printer"
    when:
      event:
        exclude: [deployment, tag, pull_request]
        include: [push]
  build:
    image: plugins/docker
    group: A
    repo: razorpay/api
    secrets: [docker_username, docker_password, git_token]
    build_args_from_env: [git_token]
    build_args:
     - GIT_COMMIT_HASH=${DRONE_COMMIT_SHA}
    tags: ${DRONE_COMMIT_SHA}
    when:
      status: [success]
      event:
        exclude: [deployment, pull_request]
        include: [push]
  rebuild-cache:
      image: razorpay/containers:drone-s3-cache
      endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
      path: "/rzp/api/${DRONE_BUILD_CREATED:0:5}/"
      secrets:
        - aws_region
        - aws_access_key_id
        - aws_secret_access_key
      rebuild: true
      mount:
        - .composer/cache
      when:
        event: push
  build-notify:
    image: plugins/slack
    secrets: [slack_webhook]
    channel: dev-test-2
    username: drone
    icon_url: https://avatars2.githubusercontent.com/u/2181346?s=200&v=4
    template: >
      {{#success build.status}}
        Build succeeded.
      {{else}}
        Build failed.
      {{/success}}
        Build No:{{build.number}}
        Branch: {{build.branch}}
        Commit: {{build.commit}}
        Author: {{build.author}}
        Started at: {{build.started}}
        Time taken: {{since build.started}}
        Link: {{build.link}}
    when:
      event:
        include: [push]
services:
  livedb:
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=api
      - MYSQL_ROOT_PASSWORD=root
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  testdb:
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=api_test
      - MYSQL_ROOT_PASSWORD=root
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  livedb2:
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=api
      - MYSQL_ROOT_PASSWORD=root
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  testdb2:
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=api_test
      - MYSQL_ROOT_PASSWORD=root
    when:
