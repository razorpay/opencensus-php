  build-js-newAuth:
    group: build-and-test
    # TODO: Get the source for this image and push it
    # to razorpay
    image: node:12.19.0
    pull: false
    environment:
      VERSION: ${DRONE_COMMIT_SHA}
    secrets: [npm_razorpay_token]
    commands:
      # Web directory
      - cd web && STAGE=production npm run build:newAuth
    when:
      event: push

  test-js:
    group: build-and-test
    image: node:12.19.0
    pull: false
    secrets: [npm_razorpay_token]
    commands:
      - npm run test
      - npm run test:jest
    when:
      event: push

  validate-js:
    group: build-and-test
    image: node:12.19.0
    pull: false
    secrets: [npm_razorpay_token]
    commands:
      - npx eslint web/v2 --ext .js,.jsx,.ts,.tsx
      - npx stylelint web/v2/**/*.{js,jsx,ts,tsx}
      - cd web && npx tsc
    when:
      event: push
  # Uploaded to a build artifact
  # This is not a deployment

  upload-javascript-to-s3:
    image: razorpay/containers:drone-s3-cache
    endpoint: https://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: '/rzp/dashboard/javascript/${DRONE_COMMIT_SHA}.tar'
    secrets:
      - aws_region
      - aws_access_key_id
      - aws_secret_access_key
    rebuild: true
    # Only upload the public directory
    mount:
      - public
    when:
      event: push
  build-docker:
    group: build
    image: plugins/docker
    repo: razorpay/dashboard
    secrets: [docker_username, docker_password]
    environment:
      # Makes sure that the docker volume cache survives this run
      PLUGIN_STORAGE_PATH: /drone/src/github.com/razorpay/dashboard/docker_cache
    build_args:
      - GIT_COMMIT_HASH=${DRONE_COMMIT_SHA}
    tags: ${DRONE_COMMIT_SHA}
    compress: true
    # Ensures that docker prune is called at the end of the build
    docker:
      purge: false
    when:
      status: [success]
      event: push
  get-javascript-artifacts-from-cache:
    image: razorpay/containers:drone-s3-cache
    restore: true
    mount:
      - public
    endpoint: https://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: '/rzp/dashboard/javascript/${DRONE_COMMIT_SHA}.tar'
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
    when:
      event: deployment
  upload-sentry-sourcemaps:
    image: node:12.19.0
    secrets: [sentry_auth_token]
    commands:
      - curl -sL https://sentry.io/get-cli/ | bash
      - 'sentry-cli releases files ${DRONE_COMMIT_SHA} upload-sourcemaps ./public/dist --log-level=info || :' # Added null command to ignore failures
    when:
      event: deployment
      environment: prod
  deploy-s3-beta:
    image: node:9-alpine
    environment:
      - AWS_CDN_BUCKET=rzp-1018-nonprod-betacdn
      - AWS_CLOUDFRONT_DISTRIBUTION_ID=E3RC1ED30HJGHJ
      - CDN_DASHBOARD_URL=https://betacdn.np.razorpay.in/dashboard
      - CDN_BASE_URL=https://betacdn.np.razorpay.in/
    secrets:
      - source: STAGE_S3_AWS_KEY
        target: AWS_KEY
      - source: STAGE_S3_AWS_SECRET
        target: AWS_SECRET
      - source: NPM_RAZORPAY_TOKEN
        target: NPM_RAZORPAY_TOKEN
    commands:
      # Requirements for running s3sync.js
      - npm install multi-glob aws-sdk
      # Show what all will get synced
      - ls -laR public/dist/
      - ls -laR public/js/generated/
      - ls -laR public/css/generated/
      - ./s3sync.js
    when:
      event: deployment
      environment: beta
  deploy-s3-omega:
