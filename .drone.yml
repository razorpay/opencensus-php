      - MYSQL_ROOT_PASSWORD=root
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  redis:
    image: redis
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  redis2:
    image: redis
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  elasticsearch:
    image: elasticsearch:5.2-alpine
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  elasticsearch2:
    image: elasticsearch:5.2-alpine
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
pipeline:
  deploy-qa-func:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_qa
      - server_cert_qa
      - client_cert_qa
      - client_key_qa
    user: drone
    cluster: qa
    auth_mode: client-cert
    deployment:
      - api-web
      - api-sqs-batch
      - api-sqs-emails
      - api-sqs-es-sync
      - api-sqs-gen-live
      - api-sqs-gen-test
      - api-sqs-invoice-email
      - api-sqs-invoice-reports
      - api-sqs-main
      - api-sqs-subscription-charge
      - api-sqs-webhooks-failure
      - api-sqs-webhooks-live
      - api-sqs-webhooks-test
    repo: razorpay/api
    namespace: func
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: qa-func
      event:
        exclude: [push]
        include: [deployment]
  deploy-stage-echo:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_stage
      - server_cert_stage
      - client_cert_stage
      - client_key_stage
    user: drone
    cluster: stage
    auth_mode: client-cert
    kind: daemonset
    daemonset:
      - api-web
    repo: razorpay/api
    namespace: echo
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: stage-echo
      event:
        exclude: [push]
        include: [deployment]
  deploy-prod-api:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_klusterapi
      - client_key_klusterapi
      - server_cert_klusterapi
      - client_cert_klusterapi
    user: drone
    cluster: kluster-api
    auth_mode: client-cert
    kind: daemonset
    daemonset:
      - api-web
    repo: razorpay/api
    namespace: api
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: prod-api
      event:
        exclude: [push]
        include: [deployment]
