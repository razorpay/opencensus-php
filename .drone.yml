pipeline:
  # Run php 7.0 sanity tests till we are on PHP7.0 on old infrastructure
  validate_php_7_0_syntax:
    image: php:7.0-cli-alpine
    commands:
      - find -path ./vendor -prune -o -iname '*.php'|xargs -n1 php -l
    group: A
    when:
      event:
        exclude: [deployment, pull_request]
        include: [push]
  restore_cache:
    image: razorpay/containers:drone-s3-cache
    restore: true
    mount:
      - .composer/cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: "/rzp/api/${DRONE_BUILD_CREATED:0:5}/"
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
    when:
      event: push
  prepare_test:
    image: razorpay/pithos:rzp-php7.1
    pull: true
    secrets: [docker_username, docker_password, git_token, rzp_api]
    commands:
      - cp ./environment/.env.drone ./environment/.env.testing
      - touch /etc/php7/conf.d/assertion.ini
      - echo "zend.assertions=1" >> /etc/php7/conf.d/assertion.ini
      - echo "assert.exception=1" >> /etc/php7/conf.d/assertion.ini
      - php -m
      - export COMPOSER_CACHE_DIR=".composer/cache"
      - mkdir -p $COMPOSER_CACHE_DIR
      - chmod 777 -R storage
      - composer config --global github-oauth.github.com $GIT_TOKEN
      - composer global require hirak/prestissimo
      - composer install --no-interaction --optimize-autoloader
      - mkdir -p /opt/razorpay/certs/first_data
    when:
      event:
        exclude: [deployment, tag, pull_request]
        include: [push]
# This suite is supposed to use default ES index
  application_test_suite:
    group: A
    image: razorpay/pithos:rzp-php7.1
    pull: true
    secrets: [docker_username, docker_password, git_token, rzp_api]
    environment:
      - DB_LIVE_HOST=mysql
      - DB_TEST_HOST=mysql
      - DB_AUTH_HOST=mysql
      - DB_LIVE_DATABASE=api_live_application
      - DB_TEST_DATABASE=api_test_application
      - DB_AUTH_DATABASE=api_auth_applicaiton
      - REDIS_HOST=redis
      - REDIS_LABS_HOST=redis
      - ES_HOST=elasticsearch
      - ES_AUDIT_HOST=elasticsearch
    commands:
      - sleep 10
      - php -d memory_limit=2048M vendor/phpunit/phpunit/phpunit --testsuite "Application Test Suite" --printer="Codedungeon\\PHPUnitPrettyResultPrinter\\Printer"
    when:
