pipeline:
  restore-cache:
    image: razorpay/containers:drone-s3-cache
    restore: true
    mount:
      - docker_cache
      - npm_cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    # See the rebuild-cache step below for an explanation
    path: "/rzp/dashboard/${DRONE_BUILD_CREATED:0:5}.tar"
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
    when:
      event: [push, deployment]
  # TODO: This file can be generated without
  # running this, since it is a simple templated
  # JSON file
  generate-composer-auth-file:
    image: razorpay/pithos:rzp-php7.1
    secrets: [docker_username, docker_password, git_token]
    commands:
      - composer config -g "github-oauth.github.com" "$GIT_TOKEN"
      - cp /root/.composer/auth.json /drone/src/github.com/razorpay/dashboard/composer-auth.json
      - sha1sum /drone/src/github.com/razorpay/dashboard/composer-auth.json
    when:
        event: push
  build-js:
    group: build
    image: node:9-alpine
    pull: false
    environment:
      CHROME_BIN: /usr/bin/chromium
    commands:
      # Fix for https://github.com/npm/uid-number/issues/3
      - npm config set unsafe-perm true
      - npm config set cache npm_cache
      - npm install --global gulp
      # Root directory
      - npm install
      - npm link gulp
      - node signup.js
      # Web directory
      - cd web && npm link gulp && npm install && npm run build
    when:
        event: push
  test-js:
    image: pronav/dash
    pull: false
    environment:
      CHROME_BIN: /usr/bin/chromium
    commands:
      - npm test
    when:
      event: push
  # Uploaded to a build artifact
  # This is not a deployment
  upload-javascript-to-s3:
    image: razorpay/containers:drone-s3-cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: "/rzp/dashboard/javascript/${DRONE_COMMIT_SHA}.tar"
    secrets:
      - aws_region
      - aws_access_key_id
      - aws_secret_access_key
    rebuild: true
    # Only upload the public directory
    mount:
      - public
    when:
      event: push
  build-docker:
    group: build
    image: plugins/docker
    repo: razorpay/dashboard
    secrets: [docker_username, docker_password, git_token]
    build_args_from_env: [git_token]
    environment:
    # Makes sure that the docker volume cache survives this run
      PLUGIN_STORAGE_PATH: /drone/src/github.com/razorpay/dashboard/docker_cache
    build_args:
     - GIT_COMMIT_HASH=${DRONE_COMMIT_SHA}
    tags: ${DRONE_COMMIT_SHA}
    compress: true
    # Ensures that docker prune is called at the end of the build
    docker:
      purge: false
    when:
      status: [success]
      event: push
  rebuild-cache:
    image: razorpay/containers:drone-s3-cache
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    # This uses the first 5 characters of the Unix Epoch timestamp
    # which roughly changes every day so that the cache size does not
    # get huge over time (one build every day gets affected and downloads
    # the whole cache though)
    path: "/rzp/dashboard/${DRONE_BUILD_CREATED:0:5}.tar"
    secrets:
      - aws_region
      - aws_access_key_id
      - aws_secret_access_key
    rebuild: true
    mount:
      - docker_cache
      - npm_cache
    when:
      event: [push, deployment]
  get-javascript-artifacts-from-cache:
    image: razorpay/containers:drone-s3-cache
    restore: true
    mount:
      - public
    endpoint: http://rzp-drone-cache.s3-ap-south-1.amazonaws.com
    path: "/rzp/dashboard/javascript/${DRONE_COMMIT_SHA}.tar"
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_region
    when:
      event: deployment
  deploy-s3-beta:
    image: node:9-alpine
    environment:
        - AWS_CDN_BUCKET=betacdn
        - AWS_CLOUDFRONT_DISTRIBUTION_ID=E3RC1ED30HJGHJ
        - CDN_DASHBOARD_URL=https://betacdn.razorpay.com/dashboard
    secrets: [AWS_KEY, AWS_SECRET]
    commands:
        # Requirements for running s3sync.js
        - npm install multi-glob aws-sdk
        # Show what all will get synced
        - ls -laR public/dist/
        - ls -laR public/js/generated/
        - ls -laR public/css/generated/
        - ./s3sync.js
    when:
      event: deployment
      environment: beta
  deploy-s3-prod:
    image: node:9-alpine
    environment:
        - AWS_CDN_BUCKET=checkout-live
        - AWS_CLOUDFRONT_DISTRIBUTION_ID=E34MFQ6HI02NUZ
        - CDN_DASHBOARD_URL=https://cdn.razorpay.com/dashboard
    secrets: [AWS_KEY, AWS_SECRET]
    commands:
        - cd /app/
        # Have to re-install npm
        - apk add nodejs-current nodejs-npm
        # Requirements for running s3sync.js
        - npm install multi-glob aws-sdk
        # Show what all will get synced
        - ls -laR public/dist/
        - ls -laR public/js/generated/
        - ls -laR public/css/generated/
        - ./s3sync.js
    when:
      # Disable this step while in testing
      environment: never
      event: deployment
  deploy-beta:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_stage
      - server_cert_stage
      - client_cert_stage
      - client_key_stage
    user: drone
    cluster: stage
    auth_mode: client-cert
    deployment: dashboard
    repo: razorpay/dashboard
    namespace: beta
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: beta
      event:
        exclude: [push]
        include: [deployment]
  deploy-prod:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_prod
      - server_cert_prod
      - client_cert_prod
      - client_key_prod
    user: drone
    cluster: prod
    auth_mode: client-cert
    deployment: dashboard
    repo: razorpay/dashboard
    namespace: dashboard
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: prod
      event:
        exclude: [push]
        include: [deployment]
  deploy-qa-func:
    image: razorpay/drone-kubernetes
    pull: true
    secrets:
      - docker_username
      - docker_password
      - server_url_qa
      - server_cert_qa
      - client_cert_qa
      - client_key_qa
    user: drone
    cluster: qa
    auth_mode: client-cert
    deployment: dashboard
    repo: razorpay/dashboard
    namespace: func
    tag:
      - ${DRONE_COMMIT_SHA}
    when:
      environment: qa-func
      event:
        exclude: [push]
        include: [deployment]
  build-notify:
    image: plugins/slack
    secrets: [slack_webhook]
    channel: tech_builds
    username: drone
    icon_url: https://avatars2.githubusercontent.com/u/2181346?s=200&v=4
    template: >
      {{#success build.status}}
        Build succeeded.
      {{else}}
        Build failed.
      {{/success}}
        Build No:{{build.number}}
        Branch: {{build.branch}}
        Commit: {{build.commit}}
        Author: {{build.author}}
        Started at: {{build.started}}
        Time taken: {{since build.started}}
        Link: {{build.link}}
    when:
      event: [push, tag]
  build-falcon-notify:
    image: plugins/webhook
    urls:
      - https://falcon.razorpay.com/update
    secrets:
      - plugin_headers
    when:
      status: [ success, failure ]
