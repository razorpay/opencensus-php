<div ng-controller="UserCtrl">
  <!-- navbar -->
  <div data-ng-include=" 'tpl/blocks/header.html' " class="app-header navbar">
  </div>
  <!-- / navbar -->

  <!-- menu -->
  <div data-ng-include=" 'tpl/blocks/aside.html' " class="app-aside hidden-xs {{app.settings.asideColor}}">
  </div>
  <!-- / menu -->

  <!-- content -->
  <div class="app-content">
    <div loading-bar></div>
    <div ui-butterbar></div>
    <div class="app-content-body fade-in-up" ui-view></div>
  </div>
  <!-- /content -->

  <!-- footer -->
  <div class="app-footer wrapper b-t bg-light">
    <span class="pull-right">{{app.version}} <a href ui-scroll="app" class="m-l-sm text-muted"><i class="fa fa-long-arrow-up"></i></a></span>
    &copy; {{app.today | date:'yyyy'}} Copyright {{app.name}}
  </div>
  <!-- / footer -->
  </div>
</div>

<script type="text/ng-template" id="warning-dialog.html">
  <div ng-idle-countdown="countdown" ng-init="countdown=15">
  <div class="modal-header">
   <h3>You'll be logged out in <span class="label label-danger">{{countdown}}</span> <span ng-pluralize="" count="countdown" when="{'one': 'second', 'other': 'seconds' }"></span>.</h3>
  </div>
  <div class="modal-body">
  <p>Your session has been idle for very long, perform some action to avoid auto logout.</p>
  <progressbar max="15" value="countdown" animate="true" class="progress-striped active" type="danger"></progressbar>
  </div>
  </div>
</script>
<script type="text/ng-template" id="activationModalContent.html">
  <div class="modal-header">
    <h3 class="modal-title">Activation Required</h3>
  </div>
  <div class="modal-body">
    <div>
      You can only use Razorpay in test mode until your account is activated. <br/>
      Please fill and submit the 
      <a ui-sref="app.activation" ng-click="ok()"><u>activation form</u></a>. 
    </div>
  </div>
  <div class="modal-footer">                  
      <button class="btn btn-primary" ng-click="ok()">OK</button>
  </div>
</script>
