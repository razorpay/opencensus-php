<div class="container w-xl w-auto-xs">
  <a href="#/" class="col-sm-12 text-center m-t m-b"><img class="img-responsive" src="img/logo_black.png" alt="."></a>
  <div class="m-b-lg">
    <div class="wrapper text-center">
      <strong>Input your email to reset your password</strong>
    </div>
    <form name="reset" ng-submit="submit()" ng-controller="ForgotPasswordCtrl">
      <div class="list-group list-group-sm">
        <div class="list-group-item">
          <input type="email" placeholder="Email" ng-model="data.email" class="form-control no-border" required>
        </div>
      </div>
      <button type="submit" ng-disabled="reset.$invalid" class="btn btn-lg btn-primary btn-block" busy="Please Wait...">Send</button>
    
      <div class="text-center m-t m-b">
        <spinner></spinner>
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
    </form>
  </div>
  <div class="text-center" ng-include="'tpl/blocks/page_footer.html'"></div>
</div>
