<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">
    Manage Team
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md" ng-controller="TeamManagementCtrl" ng-init="getTeamMembers()">
  <div class="panel panel-default panel-form invites-table col-md-8 col-md-offset-2 col-sm-12">
    <div class="panel-heading m-t m-b">
      Invite users to your Organization Team
      <small class="pull-right">
        <a href="https://docs.razorpay.com/v1/page/team-support" class="highlight" target="_blank">
          Team &amp Roles Documentation &nbsp;<i class="fa fa-external-link"></i>
        </a>
      </small>
    </div>
    <div class="text-center m-t m-b">
      <div class="text-center m-t" ng-show="alerts.getAlerts().length > 0">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="row">
        <div class="m-b col-sm-8">
          <input type="text" class="form-control" id="description" name="description" ng-model="team.email" placeholder="Email address of the user" tooltip-placement="right" tooltip="Email Address" required>
        </div>
        <div class="m-b col-sm-4">
          <select class="form-control" name="role" required
            tooltip-placement="right" tooltip="User Role"
            ng-model="team.role" ng-options="role as (role | roletoname) for role in roles track by role"
          >
          </select>
        </div>
      </div>
      <alert type="info">{{team.role | roletoname: true}}</alert>
      <button  class="btn btn-primary btn-rounded" ng-click="sendInvitation()">Send Invitation</button>
    </div>
    <div class="team-users" ng-show="users.length > 1">
      <div class="panel-heading m-t m-b">
        Team Members
      </div>
      <table class="table table-noborder">
        <tbody>
          <tr ng-repeat="user in users" ng-show="user.email !== merchant.email">
            <td>{{ user.email }}</td>
            <td>{{ user.name }}</td>
            <td>
              <select ng-model="user.pivot.role" ng-options="role as (role | roletoname) for role in roles track by role" class="form-control" required>
              </select>
            </td>
            <td>
              <div style="min-width: 140px;" class="btn-toolbar" ng-show="user.email !== merchant.email">
                <button class="btn btn-sm btn-success" tooltip="Updates the user's role" ng-click="updateTeamMember(user)">Update</button>
                <button class="btn btn-sm btn-danger" tooltip="Removes user from your team" ng-click="removeTeamMember(user)">
                  Remove
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pending-invitations" ng-show="invitations">
      <div class="panel-heading m-t m-b">
        Pending invitations
      </div>
      <table class="table table-noborder">
        <tbody>
          <tr ng-repeat="invite in invitations" ng-show="invite.email !== merchant.email">
            <td>{{ invite.email }}</td>
            <td>
              <select class="form-control" name="role" required
                tooltip-placement="right" tooltip="User Role"
                ng-model="invite.role" ng-options="role as (role | roletoname) for role in roles track by role"
              >
              </select>
            </td>
            <td style="min-width: 220px;">
              <div class="btn-toolbar">
                <button class="btn btn-sm btn-success" tooltip="Update role of the invited user" ng-click="updateInvitation(invite)">Update</button>
                <button class="btn btn-sm btn-danger" tooltip="Cancels invitation" ng-click="removeInvitation(invite)">Cancel</button>
                <button class="btn btn-sm btn-primary" tooltip="Resend invitation email" ng-click="resendInvitation(invite)">Resend</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
