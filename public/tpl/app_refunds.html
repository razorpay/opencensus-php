<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">Refunds</h1>
</div>
<div class="wrapper-md">
  <div class="panel panel-default" ng-controller="RefundsListCtrl">
    <div class="panel-heading">
      List of all refunds
    </div>
    <div class="text-center col-sm-offset-4 col-sm-4 m-t m-b">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
    </div>
    <div class="row wrapper">
      <div class="col-sm-9 m-b-xs">
      </div>
      <div class="col-sm-3">
        <div class="input-group">
          <input type="text" class="input-sm form-control" placeholder="Search Refund Id" ng-model="refunds.id">
          <span class="input-group-btn">
            <button class="btn btn-sm btn-default" type="button" ng-click="search()">Go!</button>
            <button class="btn btn-sm btn-default" type="button" ng-click="regenerate()">Clear</button>
          </span>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped b-t b-light">
        <thead>
          <tr>
            <th>Refund Id</th>
            <th>Transaction Id</th>
            <th>Currency</th>
            <th>Amount</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="row in refunds.data">
            <td><a ui-sref="app.refunds.detail({id:row.id})">{{row.id}}</a></td>
            <td><a ui-sref="app.transactions.detail({id:row.transaction_id})">{{row.transaction_id}}</a></td>
            <td>{{row.currency}}
            <td>{{row.amount/100 | currency:""}}</td>
            <td>{{row.created_at*1000 | fromNow}}</td>          
          </tr>
          <tr ng-show="refunds.count === 0">
            <td colspan="5" class="text-center">
            No Refunds
            </td>
          </tr>

        </tbody>
      </table>
    </div>
    <footer class="panel-footer">
      <div class="row">
        <div class="col-sm-4 hidden-xs">
        </div>
        <div class="col-sm-4 text-center">
          <small class="text-muted inline m-t-sm m-b-sm">Showing {{refunds.countStart}}-{{refunds.countEnd}}</small>
        </div>
        <div class="col-sm-4 text-right text-center-xs">                
          <ul class="pagination pagination-sm m-t-none m-b-none">
            <li ng-click="allowPrev && prev()"><a href ><i class="fa fa-chevron-left" ></i></a></li>
            <li ng-click="allowNext && next()"><a href ><i class="fa fa-chevron-right"></i></a></li>
          </ul>
        </div>
      </div>
    </footer>
  </div>
</div>
