    <div class="container w-xxl w-auto-xs">
      <a href="#/" class="col-sm-12 text-center m-t m-b"><img class="img-responsive" src="img/logo_black.png" alt="."></a>
      <div class="m-b-lg">
        <div class="wrapper text-center">
          <strong>Sign up to start using our service now</strong>
        </div>
        <form name="signup" class="form-validation" ng-submit="submit(signup.$valid)" ng-controller="RegisterCtrl" novalidate>
          <div class="list-group list-group-sm">
            <div class="list-group-item">
              <input placeholder="Bussiness/Individual Name" ng-model="data.name" class="form-control no-border" required>
            </div>
            <div class="list-group-item">
              <input type="email" placeholder="Email" ng-model="data.email" class="form-control no-border" required>
            </div>
            <div class="list-group-item">
               <input type="password" placeholder="Password" name="password" ng-model="data.password" class="form-control no-border" required>
            </div>
            <div class="list-group-item">
              <input type="password" placeholder="Password Confirmation" name="password_confirmation" ng-model="data.password_confirmation" class="form-control no-border" required ui-validate=" '$value==data.password' " ui-validate-watch=" 'data.password' ">
            </div>
            <span ng-show='signup.password_confirmation.$error.validator'>Passwords do not match!</span>
          </div>
          <div class="checkbox m-b-md m-t-none">
            <label class="i-checks">
              <input type="checkbox" ng-model="agree"><i></i> Agree the <a href>terms and policy</a>
            </label>
          </div>
          <button type="submit" class="btn btn-lg btn-primary btn-block">Sign up</button>
          <div class="text-center m-t m-b">
            <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
          </div>

          <div class="line line-dashed"></div>
          <p class="text-center"><small>Already have an account?</small></p>
          <a ui-sref="access.signin" class="btn btn-lg btn-default btn-block">Sign in</a>
        </form>
      </div>
      <div class="text-center" ng-include="'tpl/blocks/page_footer.html'"></div>
    </div>
