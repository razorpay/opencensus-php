<div id="invoices-page" ng-controller="InvoicesCtrl">
  <div class="invoicesNav">
    <h1 class="font-thin h3">
      {{title}} ({{mode + " Mode"| titlecase }})
    </h1>

    <ul class="nav nav-pills nav-justified">
      <li>
        <a ui-sref="app.invoices.list"
          ng-class="{active: ('app.invoices.list' | includedByState) || ('app.invoices.details' | includedByState) || ('app.invoices.new' | includedByState) || ('app.invoices.edit' | includedByState)}">
          Invoices
        </a>
      </li>
      <li><a ui-sref="app.invoices.customers" ui-sref-active="active">Customers</a></li>
      <li><a ui-sref="app.invoices.items" ui-sref-active="active">Items</a></li>
    </ul>

    <div></div>
  </div>

  <ui-view></ui-view>
</div>
