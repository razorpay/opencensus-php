<div class="container w-xxl w-auto-xs">
  <a href class="navbar-brand block m-t"><img src="img/logo.png" alt="."> {{app.name}}</a>
  <div class="m-b-lg">
    <div class="wrapper text-center">
      <strong>Sign in</strong>
    </div>
    <form name="signin" ng-submit="submit()" ng-controller="SigninCtrl">
      <div class="list-group list-group-sm">
        <div class="list-group-item">
          <input type="email" ng-model="data.email" placeholder="Email" class="form-control no-border">
        </div>
        <div class="list-group-item">
           <input type="password" ng-model="data.password" placeholder="Password" class="form-control no-border">
        </div>
      </div>
      <button type="submit" class="btn btn-lg btn-primary btn-block">Log in</button>
      
      <div class="text-center m-t m-b">
      <alert ng-repeat="alert in alerts" type="{{alert.type}}" close="closeAlert($index)">{{alert.msg}}</alert>
      </div>

      <div class="text-center m-t m-b"><a ui-sref="access.forgotpwd">Forgot password?</a></div>
      <div class="line line-dashed"></div>
      <p class="text-center"><small>Do not have an account?</small></p>
      <a ui-sref="access.signup" class="btn btn-lg btn-default btn-block">Create an account</a>
    </form>
  </div>
  <div class="text-center" ng-include="'tpl/blocks/page_footer.html'"></div>
</div>
