<div class="container w-xxl w-auto-xs">
  <a href="#/" class="col-sm-12 text-center m-t m-b"><img class="img-responsive" src="img/logo_black.png" alt="."></a>
  <div class="m-b-lg">
    <div class="wrapper text-center">
      <strong>Sign in</strong>
    </div>
    <form name="signin" ng-submit="submit(signin.$valid)" class="form-validation" ng-controller="SigninCtrl" novalidate>
      <div class="list-group list-group-sm">
        <div class="list-group-item">
          <input type="email" ng-model="data.email" name="email" placeholder="Email" class="form-control no-border" required>
        </div>
        <div class="list-group-item">
           <input type="password" ng-model="data.password" name="password" placeholder="Password" class="form-control no-border" required>
        </div>
      </div>
      <button type="submit" name="submit" class="btn btn-lg btn-primary btn-block">Log in</button>
      

      <div class="text-center m-t m-b">
        <spinner></spinner>
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>

      <div ng-if="notactivated" class="m-t">
        <div class="alert alert-danger">
          <p>Email Id not confirmed. Please check your inbox for confirmation mail. <br/>
          <a ng-click="resend(signin.$valid)" class="btn btn-sm btn-success">Click here to resend it.</a></p>
        </div>
      </div>

      <div class="text-center m-t m-b"><a ui-sref="access.forgotpwd">Forgot password?</a></div>
      <div class="line line-dashed"></div>
      <p class="text-center"><small>Do not have an account?</small></p>
      <a ui-sref="access.signup" class="btn btn-lg btn-default btn-block">Create an account</a>
    </form>
  </div>
  <div class="text-center" ng-include="'tpl/blocks/page_footer.html'"></div>
</div>
