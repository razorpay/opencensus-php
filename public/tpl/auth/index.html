<div class="auth-container" id="auth-container" ng-controller="AuthCtrl">
  <div class="auth-inner">
    <div class="auth-header">
      <div class="rzp-logo">
        <img class="logo" src="img/logo_full.png" alt='Razorpay' height="">
        <button ng-if="!right" class="btn pull-right btn-layout-change" ng-click="goToSigninLayout()">Login</button>
        <button ng-if="right" class="btn pull-right btn-layout-change" ng-click="goToSignupLayout()">Sign Up</button>
      </div>

    </div>
    <div class="auth-body">
      <div class="auth-messaging">
        Hi this is Punit Soni
      </div>
      <div class="auth-main-container" ng-class="{'right-align': right}">
        <div class="overflow-container">
          <div class="translate-container">
            <div class="auth-signup-container" ng-include="'tpl/auth/signup.html'">
              
            </div>
            <div class="auth-signin-container" ng-include="'tpl/auth/signin.html'">
              
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
