<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">
    Download Report ({{mode + " Mode"| titlecase }})
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md" ng-controller="GenerateReportCtrl">
  <div class="panel panel-default col-sm-6 col-sm-offset-3" >
    <div class="panel-heading m-t m-b">
      Download Report - {{mode | titlecase}} Mode
    </div>
    <div class="text-center m-t m-b">
      <label for="month" class="control-label">Report for month</label>
        <div class="m-b">
            <select name="month" ng-model="month" class="form-control" required>
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
        </div>
      <button  class="btn btn-primary btn-rounded" ng-click="generateReport()">Download Report</button>
    </div>
  </div>
</div>
