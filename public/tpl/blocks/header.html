      <!-- navbar header -->
      <div class="navbar-header {{app.settings.navbarHeaderColor}}">
        <button class="pull-right visible-xs dk" ui-toggle-class="show" data-target=".navbar-collapse">
          <i class="icon icon-settings"></i>
        </button>
        <button class="pull-right visible-xs" ui-toggle-class="show" data-target=".app-aside" ui-scroll="app">
          <i class="icon fa fa-bars"></i>
        </button>
        <!-- brand -->
        <a href="#/" class="navbar-brand text-lt">
          <img ng-show="app.settings.asideFolded" src="img/logo.png" alt="">
          <img ng-hide="app.settings.asideFolded" src="{{logo_full}}" alt="">
        </a>
        <!-- / brand -->
      </div>
      <!-- / navbar header -->

      <!-- navbar collapse -->
      <div class="collapse navbar-collapse box-shadow {{app.settings.navbarCollapseColor}}">
        <!-- buttons -->
        <div class="nav navbar-nav m-l-sm hidden-xs">
          <a href class="btn no-shadow navbar-btn" ng-click="app.settings.asideFolded = !app.settings.asideFolded">
            <i class="fa {{app.settings.asideFolded ? 'fa-indent' : 'fa-dedent'}} fa-fw"></i>
          </a>
        </div>
        <!-- / buttons -->

        <!-- nabar right -->

        <ul class="nav navbar-nav navbar-right">
          <li id="merchant-id" ng-controller="UserCtrl" ng-show="user.current" tooltip="Merchant ID" tooltip-placement="bottom">
            <a>{{user.id}}</a>
          </li>

          <li class="dropdown" ng-controller="modeCtrl" ng-show="user.current">
            <a href class="dropdown-toggle" data-toggle="dropdown">
              {{mode() | titlecase}} Mode<b class="caret"></b>
            </a>
            <ul class="dropdown-menu animated fadeInRight w">
              <li ng-repeat="mode in modes()">
                <a ng-click="selectMode(mode)" class="dropdown-toggle" href>{{mode | titlecase}}</a>
              </li>
            </ul>
          </li>
          <li class="dropdown" ng-controller="switchMerchantCtrl" id="switch-merchant-button" ng-show="merchants.length > 1">
            <select class="select2 role-select2" style="width: 100%" role-select="Select a Role" theme="false" style="width: 180px">
              <option value=""></option>
              <option ng-repeat="merchant in merchants" value="{{merchant.id}}">
                {{merchant.name | titlecase}}
              </option>
            </select>
            <b class="caret"></b>
          </li>
          <li>
            <a target="_blank" href="https://docs.razorpay.com">
              <span>Documentation</span>
            </a>
          </li>

          <li class="dropdown">
            <a href class="dropdown-toggle clear user-dropdown" data-toggle="dropdown">
              <span class="hidden-sm">{{user.name || user.user.name}}</span> <b class="caret"></b>
            </a>
            <!-- dropdown -->
            <ul class="dropdown-menu animated fadeInRight w">
              <li ng-show="user.current">
                <a ui-sref="app.activation">
                  <span class="badge bg-danger pull-right" ng-hide="user.activated">{{user.activation_progress}}%</span>
                  <span>Activation</span>
                </a>
              </li>
              <li>
                <a ui-sref="app.profile">Profile</a>
              </li>
              <li class="divider"></li>
              <li>
                <a href ng-click="logout()">
                  <span>Logout</span>
                </a>
              </li>
            </ul>
            <!-- / dropdown -->

            <li class="hidden-xs">
              <a ui-fullscreen></a>
            </li>
          </li>
        </ul>
        <!-- / navbar right -->
      </div>
      <!-- / navbar collapse -->
