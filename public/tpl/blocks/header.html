      <!-- navbar header -->
      <div class="navbar-header {{app.settings.navbarHeaderColor}}">
        <button class="pull-right visible-xs dk" ui-toggle-class="show" data-target=".navbar-collapse">
          <i class="glyphicon glyphicon-cog"></i>
        </button>
        <button class="pull-right visible-xs" ui-toggle-class="show" data-target=".app-aside" ui-scroll="app">
          <i class="glyphicon glyphicon-align-justify"></i>
        </button>
        <!-- brand -->
        <a href="#/" class="navbar-brand text-lt">
          <img src="img/logo.png" alt=".">
          <span class="hidden-folded m-l-xs">{{app.name}}</span>
        </a>
        <!-- / brand -->
      </div>
      <!-- / navbar header -->

      <!-- navbar collapse -->
      <div class="collapse navbar-collapse box-shadow {{app.settings.navbarCollapseColor}}">
        <!-- buttons -->
        <div class="nav navbar-nav m-l-sm hidden-xs">
          <a href class="btn no-shadow navbar-btn" ng-click="app.settings.asideFolded = !app.settings.asideFolded">
            <i class="fa {{app.settings.asideFolded ? 'fa-indent' : 'fa-dedent'}} fa-fw"></i>
          </a>
        </div>
        <!-- / buttons -->

        <!-- nabar right -->
        
        <ul class="nav navbar-nav navbar-right">
        <!-- Language selector -->
          <li class="dropdown hidden-sm">
            <a href class="dropdown-toggle" data-toggle="dropdown">
              {{selectLang}} <b class="caret"></b>
            </a>
            <ul class="dropdown-menu animated fadeInRight w">
              <li ng-repeat="(langKey, label) in langs">
                <a ng-click="setLang(langKey)" href="#">{{label}}</a>
              </li>
            </ul>
          </li> 
          <li class="dropdown hidden-sm" ng-controller="modeCtrl">
            <a href class="dropdown-toggle" data-toggle="dropdown">
              {{mode() | titlecase}} <b class="caret"></b>
            </a>
            <ul class="dropdown-menu animated fadeInRight w">
              <li ng-repeat="mode in modes()">
                <a ng-click="selectMode(mode)" href="#">{{mode | titlecase}}</a>
              </li>
            </ul>
          </li>         
          <li>
            <a target="_blank" href="https://docs.razorpay.com">
              <span translate="header.navbar.DOCUMENTATION">Documentation</span>
            </a>
          </li>

          <li class="dropdown" ng-controller="UserCtrl">
            <a href class="dropdown-toggle clear" data-toggle="dropdown">
              <span class="hidden-sm hidden-md">{{user.name}}</span> <b class="caret"></b>
            </a>
            <!-- dropdown -->
            <ul class="dropdown-menu animated fadeInRight w">
              <li>
                <a ui-sref="app.activation">
                  <span class="badge bg-danger pull-right" ng-hide="user.activated">{{user.activation_progress}}%</span>
                  <span>Activation</span>
                </a>
              </li>
              <li>
                <a ui-sref="app.profile">Profile</a>
              </li>
              <li class="divider"></li>
              <li>
                <a href ng-click="logout()">
                  <span>Logout</span>
                </a>
              </li>
            </ul>
            <!-- / dropdown -->
            
            <li class="hidden-xs">
              <a ui-fullscreen></a>
            </li>
          </li>
        </ul>
        <!-- / navbar right -->

      </div>
      <!-- / navbar collapse -->
