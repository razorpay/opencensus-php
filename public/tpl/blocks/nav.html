<div ng-init="merchant = !!user.current">
  <ul class="nav" id="sidebar-features">
    <li ng-show="merchant" class="hidden-folded padder m-t m-b-sm text-muted text-xs">
      <span>Features</span>
    </li>
    <li ng-show="merchant" not-my-role="sellerapp support" ui-sref="app.dashboard" ui-sref-active="active">
      <a id="dashboardNav" ui-sref="app.dashboard" ui-sref-active="active">
        <i class="fa fa-area-chart text-info"></i>
        <span>Dashboard</span>
      </a>
    </li>
    <li ng-show="merchant" not-my-role="sellerapp" ui-sref="app.payments.list" ui-sref-active="active">
      <a id="paymentsNav" ui-sref="app.payments.list" ui-sref-active="active">
        <i class="fa fa-inr text-primary-lter"></i>
        <span>Payments</span>
      </a>
    </li>
    <li
      ng-show="merchant"
      not-my-role="sellerapp"
      ui-sref="app.orders.list"
      ng-class="{active: ('app.orders.list' | includedByState) || ('app.orders.detail' | includedByState)}"
    >
      <a id="ordersNav"
        ui-sref="app.orders.list"
        ng-class="{active: ('app.orders.list' | includedByState) || ('app.orders.detail' | includedByState)}"
      >
        <i class="fa fa-archive text-success-lter"></i>
        <span>Orders</span>
      </a>
    </li>
    <li ng-show="merchant" not-my-role="sellerapp" ui-sref="app.refunds.list" ui-sref-active="active">
      <a id="refundsNav" ui-sref="app.refunds.list" ui-sref-active="active">
        <i class="fa fa-mail-reply icon text-warning-lter"></i>
        <span>Refunds</span>
      </a>
    </li>
    <li ng-show="merchant"
      ui-sref="app.invoices.list"
      ng-class="{active: ('app.invoices.list' | includedByState) || ('app.invoices.details' | includedByState) || ('app.invoices.new' | includedByState) || ('app.invoices.edit' | includedByState)}"
    >
      <a
        id="invoicesNav"
        ui-sref="app.invoices.list"
        ng-class="{active: ('app.invoices.list' | includedByState) || ('app.invoices.details' | includedByState) || ('app.invoices.new' | includedByState) || ('app.invoices.edit' | includedByState)}"
      >
        <i class="fa fa-money text-primary-lter"></i>
        <span>Invoices</span>
        <b class="badge bg-success dk pull-right ng-binding">new</b>
      </a>
    </li>

    <li ng-show="merchant"
      not-my-role="sellerapp support"
      ui-sref="app.settlements.list"
      ng-class="{active: ('app.settlements.list' | includedByState) || ('app.settlements.detail' | includedByState)}"
    >
      <a id="settlementsNav"
        ui-sref="app.settlements.list"
        ng-class="{active: ('app.settlements.list' | includedByState) || ('app.settlements.detail' | includedByState)}"
      >
        <i class="fa  fa-check-square-o icon text-success"></i>
        <span>Settlements</span>
      </a>
    </li>

    <!--
    <li>
      <a id="transactionsNav" ui-sref="app.transactions.list">
        <i class="fa fa-exchange icon text-info-lter"></i>
        <span>Transaction</span>
      </a>
    </li> -->
    <li ng-show="merchant" not-my-role="sellerapp" ui-sref="app.addfunds" ui-sref-active="active">
      <a id="addFundsNav" ui-sref="app.addfunds" ui-sref-active="active">
        <i class="icon icon-wallet text-info-lter"></i>
        <span>Add Funds</span>
      </a>
    </li>
    <li ng-show="merchant" not-my-role="sellerapp support" ui-sref="app.generatereport" ui-sref-active="active">
      <a id="generateReportNav" ui-sref="app.generatereport" ui-sref-active="active">
        <i class="fa fa-file-excel-o icon text-danger-lter"></i>
        <!-- <b class="badge bg-success dk pull-right ng-binding">beta</b> -->
        <span>Reports</span>
      </a>
    </li>
    <li ng-show="merchant" my-role="owner" ui-sref="app.teammanagement" ui-sref-active="active">
      <a id="manageTeamNav" ui-sref="app.teammanagement" ui-sref-active="active">
        <i class="fa fa-users icon text-info-lter"></i>
        <b class="badge bg-success dk pull-right ng-binding">beta</b>
        <span>Team</span>
        </a>
    </li>

    <li ng-show="merchant" not-my-role="sellerapp support" ui-sref="app.credits" ui-sref-active="active">
      <a id="manageCredits" ui-sref="app.credits" ui-sref-active="active">
        <i class="fa fa-credit-card icon text-warning-lter"></i>
        <span>Credits</span>
        </a>
    </li>

    <li ng-show="merchant && user.tags.indexOf('Referral') != -1" not-my-role="sellerapp support" ui-sref="app.referrals" ui-sref-active="active">
      <a id="referredNav" ui-sref="app.referrals" ui-sref-active="active">
        <i class="fa fa-gift icon text-danger-lter"></i>
        <b class="badge bg-success dk pull-right ng-binding">beta</b>
        <span>Referrals</span>
      </a>
    </li>

    <li ng-show="merchant && user.tags && user.tags.indexOf('Marketplace') != -1">
      <a id="accountsNav" ui-sref="app.accounts">
        <i class="fa fa-shopping-cart icon text-info-lter"></i>
        <b class="badge bg-success dk pull-right ng-binding">beta</b>
        <span>Accounts</span>
      </a>
    </li>
<!--
    <li ng-show="merchant">
      <a id="plansNav" ui-sref="app.plans">
        <i class="fa fa-inr text-primary-lter"></i>
        <span>Plans</span>
      </a>
    </li>

    <li ng-show="merchant">
      <a id="subscriptionsNav" ui-sref="app.subscriptions">
        <i class="fa fa-inr text-primary-lter"></i>
        <span>Subscriptions</span>
      </a>
    </li>
 -->
    <li class="line dk"></li>
  </ul>

  <ul class="nav" id="sidebar-settings">
    <li class="hidden-folded padder m-t m-b-sm text-muted text-xs">
      <span>Settings</span>
    </li>
    <li ng-show="merchant" my-role="owner admin" ui-sref="app.keys" ui-sref-active="active">
      <a id="keysNav" ui-sref="app.keys" ui-sref-active="active">
        <i class="icon-key icon text-success-lter"></i>
        <span>Api Keys</span>
      </a>
    </li>
    <li ng-show="merchant" my-role="owner manager admin" ui-sref="app.activation" ui-sref-active="active">
      <a id="activationNav" ui-sref="app.activation" ui-sref-active="active">
        <i class="icon-question icon text-success-lter"></i>
        <b class="badge bg-success dk pull-right">{{user.activation_progress}}%</b>
        <span>Activation</span>
      </a>
    </li>
    <li ng-show="merchant" my-role="owner manager admin" ui-sref="app.webhooks" ui-sref-active="active">
      <a id="webhookNav" ui-sref="app.webhooks" ui-sref-active="active">
        <i class="icon-share icon text-success-lter"></i>
        <span>Webhook</span>
      </a>
    </li>
    <li ui-sref="app.profile" ui-sref-active="active">
      <a id="profileNav" ui-sref="app.profile" ui-sref-active="active">
        <i class="icon-user icon text-warning-lter"></i>
        <span>Profile</span>
      </a>
    </li>
    <li ng-show="merchant" my-role="owner manager admin" ui-sref="app.config" ui-sref-active="active">
      <a ui-sref="app.config" ui-sref-active="active">
        <i class="icon-settings icon text-warning-lter"></i>
        <span>Configuration</span>
      </a>
    </li>

    <li class="line dk"></li>
  </ul>
</div>
