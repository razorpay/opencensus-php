<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">
    Users
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md">
  <div class="panel panel-default new-user" ng-controller="OrgsAddUsersCtrl">
    <div class="panel-heading">
      {{ user.id ? 'Edit ' + user.id : 'Add a new User' }}
    </div>
    <div class="text-center m-t">
      <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
    </div>
    <div class="panel-body b-b b-light" ng-if="fields">
      <form class="form-horizontal form-validation">
        <!--Name-->
        <div class="form-group" ng-if="fields.indexOf('name') !== -1">
          <label class="col-lg-2 control-label">Full Name</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="name" ng-model="user.name" />
          </div>
        </div>
        <div class="form-group" ng-show="!user.id" ng-if="fields.indexOf('username') !== -1">
          <label class="col-lg-2 control-label">Username</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="username" ng-model="user.username" />
            <span class="help-block">Required to login to user panel.</span>
          </div>
        </div>
        <!--Email-->
        <div class="form-group" ng-show="!user.id" ng-if="fields.indexOf('email') !== -1">
          <label class="col-lg-2 control-label">Email</label>
          <div class="col-lg-10" >
            <input type="email" class="form-control m-b" name="email" ng-model="user.email" />
          </div>
        </div>
        <!--Password-->
        <div class="form-group" ng-show="!user.id" ng-if="fields.indexOf('password') !== -1">
          <label class="col-lg-2 control-label">Password</label>
          <div class="col-lg-10" >
            <input type="password" class="form-control m-b" name="password" ng-model="user.password" />
          </div>
        </div>
        <div class="form-group" ng-show="!user.id" ng-if="fields.indexOf('password_confirmation') !== -1">
          <label class="col-lg-2 control-label">Re enter Password</label>
          <div class="col-lg-10" >
            <input type="password" class="form-control m-b" name="password_confirmation" ng-model="user.password_confirmation" />
          </div>
        </div>
        <!--Employee Code-->
        <div class="form-group" ng-if="fields.indexOf('employee_code') !== -1">
          <label class="col-lg-2 control-label">Employee Code</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="employee_code" ng-model="user.employee_code" />
          </div>
        </div>
        <div class="form-group" ng-if="fields.indexOf('department_code') !== -1">
          <label class="col-lg-2 control-label">Department Code</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="department_code" ng-model="user.department_code" />
          </div>
        </div>
        <div class="form-group" ng-if="fields.indexOf('branch_code') !== -1">
          <label class="col-lg-2 control-label">Branch Code</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="branch_code" ng-model="user.branch_code" />
          </div>
        </div>
        <div class="form-group" ng-if="fields.indexOf('location_code') !== -1">
          <label class="col-lg-2 control-label">Location Code</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="location_code" ng-model="user.location_code" />
          </div>
        </div>
        <div class="form-group" ng-if="fields.indexOf('supervisor_code') !== -1">
          <label class="col-lg-2 control-label">Supervisor Code</label>
          <div class="col-lg-10" >
            <input type="text" class="form-control m-b" name="supervisor_code" ng-model="user.supervisor_code" />
          </div>
        </div>
        <!--Allow Merchant Flag-->
        <div class="form-group" ng-if="fields.indexOf('allow_all_merchants') !== -1">
          <label class="col-lg-2 control-label">Allow all Merchants</label>
          <div class="col-lg-10">
            <div class="checkbox">
              <label>
                <input type="checkbox" name="allow_all_merchants" ng-model="user.allow_all_merchants" />
              </label>
            </div>
          </div>
        </div>
        <!--Disabled Flag-->
        <div class="form-group" ng-if="fields.indexOf('disabled') !== -1" ng-show="user.id">
          <label class="col-lg-2 control-label">Disabled</label>
          <div class="col-lg-10">
            <div class="checkbox">
              <label>
                <input type="checkbox" name="disabled" ng-model="user.disabled" />
              </label>
            </div>
          </div>
        </div>
        <!--Role-->
        <div class="form-group" ng-if="fields.indexOf('roles') !== -1">
          <label class="col-lg-2 control-label">Role</label>
          <div class="col-lg-10">
            <div class="pills-container-users">
              <span class="pills-label assignee-label" ng-repeat="(index, roleId) in selected_roles track by $index">
                {{roleNames[roleId]}}
                <i class="delete-btn fa fa-times m-l" ng-click="removeRole(roleId)" />
              </span>
            </div>

            <!-- Role Selection -->
            <select class="select2 role-select2" multiple="multiple" style="width: 100%" ng-model="roleSelect" role-select="Select a Role">
              <option  ng-repeat="role in roles | filter:filterRoles" value="{{role.id}}">{{role.name}}</option>
            </select>

          </div>
        </div>
        <!--Groups-->
        <div class="form-group" ng-if="fields.indexOf('groups') !== -1">
          <div class="col-lg-2 text-right">Groups</div>
          <div class="col-lg-10 scrollable-table">
            <table ui-jq="footable" data-page-size="100000000" class="table table-striped b-t b-light">
              <thead>
                <tr>
                  <th data-sort-ignore="true">
                    <input type="checkbox" id="select_all" ng-checked='select_all' ng-click='toggleSelAll()'>
                  </th>
                  <th>Group</th>
                  <th>Group description</th>
                </tr>
              </thead>
              <tbody>
                <tr ng-repeat="(key, row) in groups">
                  <td>
                    <input type="checkbox" name='groups[]'
                           ng-model='selected_groups[row.id]' value="{{row.id}}"
                           ng-checked="selected_groups[row.id]"
                           ng-change="updateIfGroupsChanged(row.id)">
                  </td>
                  <td>{{row.name}}</td>
                  <td>{{row.description}}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!--Action Btn-->
        <div class="panel-footer">
          <div class="center col-lg-2">
            <button class="btn btn-primary panel-ok col-lg-12" async-btn-click="save(user)">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
