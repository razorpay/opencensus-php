<div class="workflow-new-page" ng-controller="WorkflowNewCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h3 class="m-n font-thin">
      {{editLayout ? "Edit" : "Create"}} workflow
      <spinner class="inline"></spinner>
    </h3>
  </div>
  <div class="wrapper-md">
    <div class="row panel-container">
      <div class="text-center m-t">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="col-xs-4">
        <!-- Name workflow -->
        <div class="action-desc-panel panel panel-default">
          <div class="panel-heading">
            Name your workflow
          </div>
          <div class="wrapper clearfix">
            <input type="text" ng-model="workflowName" placeholder="Atleast 4 characters" class="form-control name-input wrapper-xs" ng-readonly="!isEditable">
          </div>
        </div>
        <!-- Actions List -->
        <div class="action-desc-panel panel panel-default">
          <div class="panel-heading">
            Actions List
          </div>
          <div class="wrapper clearfix">
            <!-- Select Permissions-->
            <div class="workflow-select2-container m-b" ng-show="isEditable">
              <select class="select2 workflow-select2 " multiple="multiple" style="width: 100%" ng-model="workflowSelect">
                <option></option>
                <option ng-repeat="(key, perm) in permissions" value="{{key}}">{{perm.name}}</option>
              </select>
            </div>
            <!-- Permissions List-->
            <div class="list-group">
              <div
                class="list-group-item perm-row"
                ng-repeat="(key, id) in permissionsSelected track by key"
              >
                <div class="description pull-left col-xs-12 row truncate">
                  {{permissions[id].name}}
                </div>
                <i class="delete-btn pull-right fa fa-times" ng-click="deselectPermission(id)" ng-if="isEditable"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xs-8">
        <div ng-repeat="(stepIndex, step) in levels" class="action-desc-panel panel panel-default">
          <div class="panel-heading">
            Step {{stepIndex + 1}}
            <i class="delete-btn pull-right fa fa-times" ng-click="removeStep(stepIndex)" ng-if="isEditable"></i>
          </div>
          <div class="wrapper clearfix">

            <!-- Operation Type -->
            <span class="m-b" >Operation Type:</span>
            <div class="optype-container">
              <span ng-if="!isEditable" class="solid-label">{{step.op_type}}</span>
              <select class="form-control" style="width: 60px;" ng-model="step.op_type" ng-if="isEditable">
                <option value="and">AND</option>
                <option value="or">OR</option>
              </select>
            </div>

            <!-- Roles-->
            <div class="m-b">Add a checker to approve the action. Select a role.</div>
            <div class="assignee-list m-b">
              <!-- Role Pills-->
              <div class="" ng-repeat="(roleIndex, role) in step.steps">
                <span class="assignee-row" >
                  <span class="pills-label assignee-label">{{roleNames[role.role_id]}} <i class="delete-btn fa fa-times m-l" ng-click="removeRoleFromStep(roleIndex, stepIndex)" ng-if="isEditable"></i></span>
                  <span class="help-label m-l">Minimum approvals</span>
                  <input ng-disabled="!isEditable" ng-model="role.reviewer_count" type="text" ng-pattern="/^[0-9]{1,2}$/" class="form-control m-l reviewer-count"/>
                  <div ng-if="isEditable" class="reviewer-count-inc-btn" ng-click="incReviewerCount(roleIndex, stepIndex)">
                    <i class="fa fa-angle-up "></i>
                  </div>
                  <div ng-if="isEditable" class="reviewer-count-dec-btn" ng-click="decReviewerCount(roleIndex, stepIndex)">
                    <i class="fa fa-angle-down "></i>
                  </div>
                </span>
              </div>
            </div>

            <!-- Role Selection -->
            <div ng-if="isEditable" class="col-xs-6 row">
              <select class="select2 role-select2 " multiple="multiple" style="width: 100%" ng-model="roleSelect">
                <option></option>
                <option  ng-repeat="(key, role) in roles | filter:filterItems(stepIndex)" data-step-index={{stepIndex}} data-role-id={{role.id}} value="{{key}}">{{role.name}}</option>
              </select>
            </div>
          </div>
        </div>
        <button ng-disabled="!isEditable" type="button" class="btn btn-default" ng-click="addStep()">
          +  Add a Step
        </button>
        <button type="button" ng-if="!editLayout && isEditable" class="btn btn-info m-l save-btn" ng-click="createWorkflow()">
          Save Changes
        </button>
        <button type="button" ng-if="editLayout && isEditable" class="btn btn-info m-l save-btn" ng-click="editWorkflow()">
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
