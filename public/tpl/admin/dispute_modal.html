<!--Create dispute form-->
<script type="text/ng-template" id="disputeModalContent.html">
  <div class="modal-header">
    <h3 class="modal-title">{{editMode ? 'Edit Dispute' : 'Create Dispute'}}</h3>
  </div>
  <div class="modal-body">
    <form class="form-horizontal" name="createDisputeForm">

      <!--Gate Dispute Id-->
      <div class="form-group">
        <label class="col-lg-3 control-label">
          Gateway Dispute Id<span ng-if="!editMode" style="color:red">*</span>:
        </label>
        <div class="col-lg-9">
          <input
            type="text" class="form-control m-b"
            ng-model="dispute.gateway_dispute_id"
            ng-required="!editMode"
            ng-disabled="editMode"/>
        </div>
      </div>

      <!--Gateway Dispute Status-->
      <div class="form-group">
        <label class="col-lg-3 control-label">Gateway Dispute Status:</label>
        <div class="col-lg-9">
          <input
            type="text" class="form-control m-b"
            ng-model="dispute.gateway_dispute_status"
            ng-required="!editMode"/>
        </div>
      </div>

      <!--Phase-->
      <div class="form-group">
        <label class="col-lg-3 control-label">
          Phase
          <span ng-if="!editMode" style="color:red">*</span>
          :
        </label>
        <div class="col-lg-9" >
          <select class="form-control m-b" ng-model="dispute.phase"
                  required="!editMode"
                  ng-disabled="editMode">
            <option></option>
            <option value="chargeback">Chargeback</option>
            <option value="pre_arbitration">Pre Arbitration</option>
            <option value="arbitration">Arbitration</option>
            <option value="retrieval">Retrieval</option>
            <option value="fraud">Fraud</option>
          </select>
        </div>
      </div>

      <!--Raised on Date-->
      <div class="form-group">
        <label class="col-lg-3 control-label" style="display:table-cell; vertical-align: middle" >
          Raised on
          <span ng-if="!editMode" style="color:red">*</span>
          :
        </label>
        <div class="col-lg-9" style="display:table;">
          <!--Date picker-->
          <div style="display: table-cell; vertical-align: middle">
            <div class="input-group input-date col-lg-3" name="raised_on"
                 ng-style="editMode && {'pointer-events': 'none'}"
                 ng-click="date.open($event, 1)">

              <input type="text" class="form-control" datepicker-popup="dd MMM yyyy"
                     ng-model="dispute.raised_on"
                     is-open="date.opened.1"
                     datepicker-options="dateRaised.dateOptions"
                     close-text="Close"
                     ng-disabled="editMode"
                     ng-required="!editMode" />
              <div class="input-group-addon"><i class="icon icon-calendar"></i></div>
            </div>
          </div>
        </div>
      </div>

      <!--Expires on Date-->
      <div class="form-group">
        <label class="col-lg-3 control-label" style="display:table-cell; vertical-align: middle" >
          Expires on
          <span ng-if="!editMode" style="color:red">*</span>
          :
        </label>
        <div class="col-lg-9" style="display:table;">
          <!--Date picker-->
          <div style="display: table-cell; vertical-align: middle">
            <div class="input-group input-date col-lg-3" name="expires_on"
                 ng-click="date.open($event, 0)">

              <input type="text" class="form-control" datepicker-popup="dd MMM yyyy"
                     ng-model="dispute.expires_on"
                     is-open="date.opened.0"
                     datepicker-options="date.dateOptions"
                     close-text="Close"
                     ng-required="!editMode"/>
              <div class="input-group-addon"><i class="icon icon-calendar"></i></div>
            </div>
          </div>
        </div>
      </div>

      <!--Status-->
      <div class="form-group" ng-if="editMode">
        <label class="col-lg-3 control-label">Status</label>
        <div class="col-lg-9" >
          <select class="form-control m-b" ng-model="dispute.status">
            <option></option>
            <option value="open">Open</option>
            <option value="under_review">Under Review</option>
            <option value="lost">Lost</option>
            <option value="won">Won</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>

      <!--Reason Id-->
      <div class="form-group" ng-show="reasonIds">
        <label class="col-lg-3 control-label">
          Reason Id
          <span ng-if="!editMode" style="color:red">*</span>
          :
        </label>
        <div class="col-lg-9">
          <!-- Role Selection -->
          <select class="select2 role-select2" style="width: 100%"
                  ng-class="editMode && 'disabled'"
                  ng-model="dispute.reason_id"
                  role-select="Select a Reason Id"
                  ng-disabled="editMode"
                  required="!editMode">
            <option></option>
            <option ng-repeat="reason in reasonIds" value="{{reason.id}}" ng-selected="{{reason.id == dispute.reason_id}}">
              ({{reason.network}} - {{reason.gateway_code}}) : {{reason.code}}
            </option>
          </select>
        </div>
      </div>


      <!--Amount-->
      <div class="form-group">
        <label class="col-lg-3 control-label">
          Amount
          <span ng-if="!editMode" style="color:red">*</span>
          :
        </label>
        <div class="col-lg-9">
          <div class="input-group">
            <span class="input-group-addon">{{currency}}</span>
            <input type="text" class="form-control m-b"
                   ng-model="dispute.amount"
                   ng-disabled="editMode"
                   ng-required="!editMode">
          </div>
        </div>
      </div>

      <!--Merchant Email-->
      <div class="form-group">
        <label class="col-lg-3 control-label">Merchant Email:</label>
        <div class="col-lg-9">
          <div class="input-group">
            <input type="text" class="form-control m-b"
                   ng-model="dispute.merchant_emails"
                   ng-disabled="editMode">
          </div>
        </div>
      </div>

      <!--Deduct on Onset-->
      <div class="form-group">
        <label class="col-lg-3 control-label">Deduct at Onset:</label>
        <div class="col-sm-8">
          <input type="checkbox" class="form-control m-b"
                 ng-model="dispute.deduct_at_onset"
                 ng-disabled="editMode"/>
        </div>
      </div>

      <!--Skip Merchant Email-->
      <div class="form-group">
        <label class="col-lg-3 control-label">Skip Merchant Email:</label>
        <div class="col-sm-8">
          <input type="checkbox" class="form-control m-b"
                 ng-model="dispute.skip_email"
                 ng-disabled="editMode"/>
        </div>
      </div>

      <!--Action Buttons-->
      <div class="modal-footer">
        <button class="btn btn-default" ng-click="cancel()">Cancel</button>
        <button class="btn btn-primary" ng-if="!editMode" ng-click="createDisputeForm.$valid && ok()">Submit</button>
        <button class="btn btn-primary" ng-if="editMode" ng-click="ok()">Update</button>
      </div>

    </form>
  </div>
</script>
