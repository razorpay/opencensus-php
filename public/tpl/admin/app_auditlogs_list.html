<div ng-controller="AuditlogsCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Audit Log
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel panel-default">
      <div class="panel-heading">
        Log Entries
      </div>

      <div class="table-responsive">
        <table ui-jq="footable" data-filter="#filter" class="table-responsive table table-striped b-t b-light">
          <thead>
            <tr>
              <th data-toggle="true">Admin</th>
              <th>Category</th>
              <th>Action</th>
              <th>Label</th>
              <th>Time</th>
              <th data-sort-ignore="true">&nbsp;</th>
          </thead>
          <tbody>
            <tr ng-repeat="row in audit_logs">
              <td>{{row.event.admin.email}}</td>
              <td>{{row.event.category}}</td>
              <td>{{row.event.action}}</td>
              <td>{{row.event.label}}</td>
              <td data-value="{{row.event.created_at}}">{{row.event.created_at * 1000 | date:'medium'}}</td>
              <td>
                <a href="javascript:void(0);" class="btn btn-default btn-xs" ng-click="showAuditLogDetail(row.id)">
                  Details
                </a>
              </td>
            </tr>
            <tr ng-show="audit_logs.length == 0">
              <td colspan="6">No Activity</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="text/ng-template" id="auditLogDetailContent.html">
  <div class="modal-header">
    <h3 class="modal-title">Entry Details</h3>
  </div>

  <div class="modal-body new-key-modal" style="overflow: auto;">
    <h4>Admin User Details</h4>

    <table class="table table-striped b-t b-light">
      <thead>
        <tr>
          <th ng-show="data.admin.username">Username</th>
          <th ng-show="data.admin.email">Email</th>
          <th ng-show="data.admin.employee_code">Employee Code</th>
          <th ng-show="data.admin.branch_code">Branch Code</th>
          <th ng-show="data.admin.department_code">Department Code</th>
          <th ng-show="data.admin.supervisor_code">Supervisor Code</th>
          <th ng-show="data.admin.location_code">Location Code</th>
          <th ng-show="data.admin.roles.length">Roles</th>
          <th ng-show="data.admin.groups.length">Groups</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td ng-show="data.admin.username">{{ data.admin.username }}</td>
          <td ng-show="data.admin.email">{{ data.admin.email }}</td>
          <td ng-show="data.admin.employee_code">{{ data.admin.employee_code }}</td>
          <td ng-show="data.admin.branch_code">{{ data.admin.branch_code }}</td>
          <td ng-show="data.admin.department_code">{{ data.admin.department_code }}</td>
          <td ng-show="data.admin.supervisor_code">{{ data.admin.supervisor_code }}</td>
          <td ng-show="data.admin.location_code">{{ data.admin.location_code }}</td>
          <th ng-show="data.admin.roles.length">{{ data.admin.roles.join(', ') }}</th>
          <th ng-show="data.admin.groups.length">{{ data.admin.groups.join(', ') }}</th>
        </tr>
      </tbody>
    </table>

    <h4>Event Details</h4>

    <table class="table table-striped b-t b-light">
      <thead>
        <tr>
          <th ng-show="data.category">Category</th>
          <th ng-show="data.action">Action</th>
          <th ng-show="data.label">Label</th>
          <th ng-show="data.description">Description</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td ng-show="data.category">{{ data.category }}</td>
          <td ng-show="data.action">{{ data.action }}</td>
          <td ng-show="data.label">{{ data.label }}</td>
          <td ng-show="data.description">{{ data.description }}</td>
        </tr>
      </tbody>
    </table>

    <h4>Extra Details</h4>

    <table class="table table-striped b-t b-light">
      <thead>
        <tr>
          <th ng-repeat="(key, value) in data.extra">
            {{ key }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td ng-repeat="(key, value) in data.extra">
            {{ value }}
          </td>
        </tr>
      </tbody>
    </table>

    <h4>Other Details</h4>

    <table class="table table-striped b-t b-light">
      <thead>
        <tr>
          <th ng-show="data.user_agent">User Agent</th>
          <th ng-show="data.ip_address">IP Address</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td ng-show="data.user_agent">{{ data.user_agent }}</td>
          <td ng-show="data.ip_address">{{ data.ip_address }}</td>
        </tr>
      </tbody>
    </table>

  </div>

  <div class="modal-footer">
    <button class="btn btn-default" ng-click="cancel()">Close</button>
  </div>
</script>
