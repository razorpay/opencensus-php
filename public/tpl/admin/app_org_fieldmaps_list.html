<div ng-controller="OrgsFieldMapsListCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Field Maps - Total {{count}}
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel panel-default">
      <div class="panel-heading">
        List of all Field Maps
      </div>
      <div class="text-center m-t">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="row wrapper">
        <div class="col-md-6 m-b-xs">
          <label for='filter' class='m-r'>Search</label>
          <input id="filter" type="text"
            class="form-control input-sm w-sm inline m-r">
        </div>
        <div class="col-md-6">
          <a class='btn btn-default pull-right'
            ui-sref='app.orgs.fieldmaps.new'>
            Add a Field Map
          </a>
        </div>
      </div>
      <div>
        <table ui-jq="footable" data-filter="#filter" data-page="false" class="table-responsive table table-striped b-t b-light">
          <thead>
            <tr>
              <th>Id</th>
              <th>Org Id</th>
              <th>Entity Name</th>
              <th>Fields</th>
              <th>Actions</th>
          </thead>
          <tbody>
            <tr ng-repeat="row in orgFieldMaps">
              <td>{{row.id}}</a></td>
              <td>{{row.org_id}}</td>
              <td>{{row.entity_name}}</td>
              <td>{{row.fields.join(', ')}}</td>
              <td>
                <div class="btn-group">
                  <a class="btn btn-default btn-xs" ui-sref="app.orgs.fieldmaps.edit({ fieldMapId: row.id })">
                    <i class="fa fa-pencil-square"></i>
                    edit
                  </a>
                  <button class="btn btn-default btn-xs" ng-confirm-click="Are you sure you want to delete this Field Map?" ng-click="deleteFieldMap(row.id)">
                    <i class="fa fa-trash text-danger"></i>
                    delete
                  </button>
                </div>
              </td>
            </tr>
            <tr ng-show="orgFieldMaps.length == 0">
              <td colspan="6">No Field Maps</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
