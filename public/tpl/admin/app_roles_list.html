<div ng-controller="RolesCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Roles - Total {{count}}
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel panel-default">
      <div class="panel-heading">
        List of all Roles
      </div>
      <div class="row wrapper">
        <div class="col-md-6 m-b-xs">
          <label for='filter' class='m-r'>Search</label>
          <input id="filter" type="text"
            class="form-control input-sm w-sm inline m-r">
        </div>
         <div class="col-md-6">
            <a id='addRoleButton' class='btn btn-default pull-right' ui-sref='app.roles.add'>
              Add a Role
            </a>
          </div>
      </div>
      <div>
        <table ui-jq="footable" data-filter="#filter" data-page="false" class="merchants-table table-responsive table table-striped b-t b-light">
          <thead>
            <tr>
              <th>Role Id</th>
              <th>Name</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="row in roles" class="merchants-table-body">
              <td>{{row.id}}</td>
              <td>{{row.name}}</td>
              <td>{{row.description}}</td>
              <td>
                <a class="btn-role-delete" ng-confirm-click="Are you sure you want to delete this role?" ng-click="deleteRole(row.id)">
                  <i class="fa fa-user-times text-danger" tooltip="Delete"></i>
                </a>
                <a tooltip="Edit Role" ng-click='openEditRole(row.id)'>
                  <i class="fa fa-pencil-square"></i>
                </a>
              </td>
            </tr>
            <tr ng-show="roles.length === 0">
              <td colspan="7">No Roles</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="text/ng-template" id="editRoleModalContent.html">
  <div class="modal-header">
    <h3 class="modal-title">Edit Admin</h3>
  </div>
  <div class="modal-body merchant-modal">
    <form class="form-horizontal form-validation">
      <div class="form-group">
        <label for='name' class="col-lg-2 control-label">Name</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="name" ng-model="role.name" />
        </div>
      </div>
      <div class="form-group">
        <label for='description' class="col-lg-2 control-label">Description</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="description" ng-model="role.description" />
        </div>
      </div>
      <div class="form-group">
        <div class="col-lg-2 control-label">Permissions</div>
        <div class="col-lg-10 scrollable-table">
          <table ui-jq="footable" data-page-size="10000" class="table table-striped b-t b-light">
            <thead>
              <tr>
                <th></th>
                <th>Permission</th>
                <th>Permission description</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="(key, row) in permissions">
                <td><input type="checkbox" name='permissions[]' ng-model='selected_permissions[row.id]' value="{{row.id}}"></td>
                <td>{{row.name}}</td>
                <td>{{row.description}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button class="btn btn-default" ng-click="cancel()">Cancel</button>
    <button class="btn btn-primary modal-ok" ng-click="ok(role)">OK</button>
  </div>
</script>
