<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">
    Activation Form
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md activation-wrapper" ng-controller="MerchantActivationCtrl" ng-init="getData()">
  <div class="text-center m-t m-b">
    <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
  </div>
  <div class="panel panel-default" >
    <div class="panel-heading m-t m-b">
      Merchant: <a ui-sref="app.merchants.detail({id:merchant.id})"><strong>{{merchant.id}}</strong></a>
    </div>
    <div class="row wrapper">
      <div class="list-group">
        <a href class="list-group-item">
          <span class="pull-right">{{merchant.name}}</span>
          Name
        </a>
        <a href class="list-group-item">
          <span class="pull-right">{{merchant.email}}</span>
          Email
        </a>
        <a href class="list-group-item">
          <span class="pull-right" tooltip="{{merchant.submitted == 1 ? 'Submitted' : 'Not Submitted'}}">
            <i class="fa" ng-class="{'fa-check text-success': merchant.submitted == 1, ' fa-times text-danger':merchant.submitted == 0}"></i>
          </span>
          Activation Form Submitted
        </a>
        <a href class="list-group-item">
          <span class="pull-right" tooltip="{{merchant.locked == 1 ? 'Locked' : 'Unlocked'}}">
            <i class="fa" ng-class="{'fa-lock': merchant.locked == 1, ' fa-unlock':merchant.locked == 0}"></i>
          </span>
          Activation Form Status
        </a>
        <a href class="list-group-item">
          <span class="pull-right" tooltip="{{merchant.activated == 1 ? 'Activated' : 'Not Activated'}}"><i class="fa" ng-class="{'fa-check text-success': merchant.activated == 1, 'fa-times text-danger':merchant.activated == 0}"></i></span>
          Activated
        </a>
      </div>
    </div>
  </div>
  <div class="panel panel-default" >
    <div class="panel-heading m-t m-b">
      Merchant Activation Form
    </div>
    <div ng-include="'/tpl/common/activation_form.html'"></div>
  </div>
</div>
