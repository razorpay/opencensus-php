<div ng-controller="WorkflowListCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Workflows - Total {{count}}
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel panel-default">
      <div class="panel-heading">
        List of all Workflows
      </div>
      <div class="text-center m-t">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="row wrapper">
        <div class="col-md-6 m-b-xs">
          <label for='filter' class='m-r'>Search</label>
          <input id="filter" type="text"
            class="form-control input-sm w-sm inline m-r">
        </div>
        <div class="col-md-6" ng-show="admin.permissions && admin.permissions.indexOf('create_workflow') === -1">
          <a class='btn btn-default pull-right'
            ui-sref='app.workflows.new'>
            Add New Workflow
          </a>
        </div>
      </div>
      <div>
        <table ui-jq="footable" data-filter="#filter" data-page="false" class="table-responsive table table-striped b-t b-light">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Created At</th>
              <th>Action</th>
          </thead>
          <tbody>
            <tr ng-repeat="row in workflows">
              <td>{{row.id}}</td>
              <td>{{row.name}}</td>
              <td>{{row.created_at*1000 | date:'medium'}}</td>
              <td>
                <div class="btn-group">
                  <a class="btn btn-default btn-xs" ui-sref="app.workflows.edit({ id: row.id })"
                    ng-show="admin.permissions && admin.permissions.indexOf('edit_workflow') !== -1">
                    <i class="fa fa-pencil-square"></i>
                    edit
                  </a>
                  <button class="btn btn-default btn-xs" ng-confirm-click="Are you sure you want to delete this Workflow?"
                    ng-click="deleteWorkflow(row.id)"
                    ng-show="admin.permissions && admin.permissions.indexOf('delete_workflow') !== -1">
                    <i class="fa fa-trash text-danger"></i>
                    delete
                  </button>
                </div>
              </td>
            </tr>
            <tr ng-show="workflows.length == 0">
              <td colspan="6">No Workflows</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
