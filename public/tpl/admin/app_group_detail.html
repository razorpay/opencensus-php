<div ng-controller="GroupDetailCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Group Detail
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel panel-default">
      <div class="panel-heading">
        List of all Admins
      </div>
      <div class="row wrapper">
        <div class="col-md-6 m-b-xs">
          Search: <input id="filter" type="text" class="form-control input-sm w-sm inline m-r">
        </div>
         <div class="col-md-6">
            <button id='addAdminButton' class='btn btn-default pull-right' ng-click="openAddAdminModal()">
              Add an Admin
            </button>
          </div>
      </div>
      <div>
        <table ui-jq="footable" data-filter="#filter" data-page="false" class="merchants-table table-responsive table table-striped b-t b-light">
          <thead>
            <tr>
              <th>Admin Id</th>
              <th>Name</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="row in groupAdmins" class="merchants-table-body">
              <td><a ui-sref="app.group.detail({id:row.id})" target="_blank">{{row.id}}</a></td>
              <td>{{row.name}}</td>
              <td>{{row.email}}</td>
            </tr>
            <tr ng-show="groups.length == 0">
              <td colspan="7">No Admins</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="text/ng-template" id="addAdminModal.html">
  <div class="modal-header">
    <h3 class="modal-title">Add New Admin</h3>
  </div>
  <div class="modal-body">
    <select class="form-control" ng-model="admin.newAdminId">
      <option ng-repeat="orgAdmin in orgAdmins" value="{{orgAdmin.id}}">{{orgAdmin.email}}</option>
    </select>
  </div>
  <div class="modal-footer">
    <button class="btn btn-default" ng-click="cancel()">Cancel</button>
    <button class="btn btn-primary modal-ok" ng-click="ok(admin)">OK</button>
  </div>
</script>
