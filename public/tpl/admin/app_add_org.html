<div ng-controller="AddOrgCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Organizations
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel-form-container">
      <div class="text-center">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>
            {{ organization.id ? 'Edit ' + organization.id : 'Add a new Organization' }}
          </h4>
        </div>
        <div class="panel-body">
          <form class="form-horizontal form-validation">
            <div class="form-group">
             <label for="email" class="col-lg-3 control-label">Email</label>
              <div class="col-lg-8" >
                <input type="email" class="form-control m-b" name="email"
                  ng-model="organization.email" ng-readonly="organization.id" placeholder="admin@company.com">
              </div>
            </div>
            <div class="form-group">
             <label for="business_name" class="col-lg-3 control-label">Business name</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="business_name"
                  ng-model="organization.business_name">
              </div>
            </div>
            <div class="form-group">
             <label for="display_name" class="col-lg-3 control-label">Display name</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="display_name"
                  ng-model="organization.display_name">
              </div>
            </div>
            <div class="form-group">
             <label for="email_domains" class="col-lg-3 control-label">Email domains</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="email_domains"
                  ng-model="organization.email_domains">
              </div>
            </div>
            <div class="form-group">
             <label for="hostname" class="col-lg-3 control-label">Hostname</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="hostname"
                  ng-model="organization.hostname">
              </div>
            </div>
            <!-- <div class="form-group">
             <label for="logo" class="col-lg-3 control-label">Logo URL</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="logo_url"
                  ng-model="organization.logo_url">
              </div>
            </div> -->
            <div class="form-group">
             <label for="auth_type" class="col-lg-3 control-label">Auth Type</label>
              <div class="col-lg-8" >
                <select class="form-control m-b" ng-model="organization.auth_type">
                  <option value="">Please select an auth type</option>
                  <option value="password">Password</option>
                  <option value="google_auth">Google Auth</option>
                </select>
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="full_name" class="col-lg-3 control-label">Full Name</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="name" ng-model="organization.admin.name" />
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="username" class="col-lg-3 control-label">Username</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="username" ng-model="organization.admin.username" />
                <span class="help-block">Required to login to user panel.</span>
              </div>
            </div>
            <div class="form-group" ng-show="!user.id && !organization.id">
              <label for="password" class="col-lg-3 control-label">Password</label>
              <div class="col-lg-8" >
                <input type="password" class="form-control m-b" name="password" ng-model="organization.admin.password" />
              </div>
            </div>
            <div class="form-group" ng-show="!user.id && !organization.id">
              <label for="password_confirmation" class="col-lg-3 control-label">Re-Type Password</label>
              <div class="col-lg-8" >
                <input type="password" class="form-control m-b" name="password" ng-model="organization.admin.password_confirmation" />
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="employee_code" class="col-lg-3 control-label">Employee Code</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="name" ng-model="organization.admin.employee_code" />
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="department_code" class="col-lg-3 control-label">Department Code</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="name" ng-model="organization.admin.department_code" />
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="branch_code" class="col-lg-3 control-label">Branch Code</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="name" ng-model="organization.admin.branch_code" />
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="location_code" class="col-lg-3 control-label">Location Code</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="name" ng-model="organization.admin.location_code" />
              </div>
            </div>
            <div class="form-group" ng-show=!organization.id>
              <label for="supervisor_code" class="col-lg-3 control-label">Supervisor Code</label>
              <div class="col-lg-8" >
                <input type="text" class="form-control m-b" name="name" ng-model="organization.admin.supervisor_code" />
              </div>
            </div>

            <!-- Logo for login and nav headers -->

            <div class="form-group" ng-show="organization.id">
              <label class="col-sm-3 control-label">Login Logo</label>
              <div class="col-sm-8">
                <input ui-jq="filestyle" type="file" name="login_logo" ng-file-select="onLoginLogoSelect($files, 'login_logo')">
              </div>
            </div>

            <div class="form-group" ng-show="organization.id">
              <label class="col-sm-3 control-label">Main (Dashboard) Logo</label>
              <div class="col-sm-8">
                <input ui-jq="filestyle" type="file" name="main_logo" ng-file-select="onMainLogoSelect($files, 'main_logo')">
              </div>
            </div>

            <div class="form-group" ng-show="organization.id">
              <label class="col-sm-3 control-label">Invoice Logo</label>
              <div class="col-sm-8">
                <input ui-jq="filestyle" type="file" name="invoice_logo" ng-file-select="onInvoiceLogoSelect($files, 'invoice_logo')" accept="image/jpeg,image/jpg,image/png">
              </div>
            </div>

            <div class="panel-footer">
              <div class="row">
                <div class="col-lg-offset-3 col-lg-8 text-center">
                  <button class="btn btn-primary panel-btn-action" ng-click="save(organization)">
                    Save
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
