<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">
    Entities
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md" ng-controller="EntitiesCtrl">
  <div class="panel panel-default">
    <div class="panel-heading">
      <ul class="nav navbar-nav navbar-right pagination-sm m-t-none m-b-none">
        <li ng-click="allowPrev && prev()"><button class="btn btn-default fa fa-chevron-left" ng-disabled="!allowPrev"></button></li>
        <li ng-click="allowNext && next()"><button class="btn btn-default  fa fa-chevron-right" ng-disabled="!allowNext"></button></li>
      </ul>

      List of all {{entity_type +  "s"| titlecase}} ({{mode + " mode" | titlecase}})
    </div>
    <div class="row wrapper">
      <div class="text-center m-t">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="col-sm-3 m-b-xs">
        Entity Type:
        <select class="form-control input-sm w-sm inline m-r" name="entity_type" ng-model="entity_type">
          <option value="adjustment">Adjustment</option>
          <option value="atom">Atom</option>
          <option value="axis_genius">Axis Genius</option>
          <option value="axis_migs">Axis Migs</option>
          <option value="bank_account">Bank Account</option>
          <option value="billdesk">Billdesk</option>
          <option value="card">Card</option>
          <option value="dailysettlement">Daily Settlement</option>
          <option value="hdfc">Hdfc</option>
          <option value="iin">IIN</option>
          <option value="key">Keys</option>
          <option value="kotak">Kotak</option>
          <option value="merchant">Merchant</option>
          <option value="netbanking">Netbanking</option>
          <option value="payment">Payments</option>
          <option value="paytm">Paytm</option>
          <option value="mobikwik">Paytm</option>
          <option value="refund">Refunds</option>
          <option value="settlement">Settlements</option>
          <option value="terminal">Terminal</option>
          <option value="transaction">Transactions</option>
        </select>
      </div>
      <div class="col-sm-2">
        Mode:
        <select class="form-control input-sm w-sm inline m-r" name="mode" ng-model="mode">
          <option value="live">Live</option>
          <option value="test">Test</option>
        </select>
      </div>
      <div class="col-sm-2">
        Count:
        <input type="number" min="10" step="10" class="form-control input-sm w-sm inline m-r" ng-model="count" value="20" placeholder="20" name="count">
      </div>
      <div class="col-sm-2"></div>
      <div class="col-sm-3">
        <div class="input-group">
          <input type="text" class="input-sm form-control" placeholder="Search Entity Id" ng-model="entity.id">
          <span class="input-group-btn">
            <button class="btn btn-sm btn-default" type="button" ng-click="search()" >Go!</button>
          </span>
        </div>
      </div>
    </div>
    <div class="row wrapper">
      <div class="col-sm-2" ng-repeat="(filter, values) in availableFilters[entity_type]">
        <label ng-show="values.length !== 1">
          {{filter|titlecase}}:
        </label>
        <label ng-show="values.length === 1">
          {{values[0]}}
        </label>
        <select ng-show="values.length !== 1"
          class="form-control input-sm w-sm"
          ng-model="filters[entity_type][filter]"
        >
          <option value="{{value}}" ng-repeat="value in values">
            {{displayFilter(value)|titlecase}}
          </option>
        </select>
        <input ng-show="values.length===1" type="text"
          ng-enter="showTable()"
          class="input-sm form-control w-sm" placeholder="{{filter}}"
          value="" ng-model="filters[entity_type][filter]"
        >
      </div>
    </div>
    <div class="table-responsive">
      <table id="merchants-table" class="table table-striped b-t b-light">
        <thead>
          <tr>
            <th ng-repeat="(key, value) in headings | limitTo: 7" data-hide="{{key != 0 ? 'phone,tablet' : ''}}">{{value}}</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="row in entity.items">
            <td ng-repeat="key in notSorted(row) | limitTo: 7" ng-init="value = row[key]" ng-click="showDetail(row)" style="cursor: pointer;">{{value}}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <footer class="panel-footer">
      <div class="row">
        <div class="col-sm-4 hidden-xs">
        </div>
        <div class="col-sm-4 text-center">
          <small class="text-muted inline m-t-sm m-b-sm">Showing {{entity.countStart}}-{{entity.countEnd}}</small>
        </div>
        <div class="col-sm-4 text-right text-center-xs">
          <ul class="nav navbar-nav navbar-right pagination-sm m-t-none m-b-none">
            <li ng-click="allowPrev && prev()"><button class="btn btn-default fa fa-chevron-left" ng-disabled="!allowPrev"></button></li>
            <li ng-click="allowNext && next()"><button class="btn btn-default  fa fa-chevron-right" ng-disabled="!allowNext"></button></li>
          </ul>
        </div>
      </div>
    </footer>
  </div>
</div>
<script type="text/ng-template" id="entityDetailModalContent.html">
  <div class="modal-header">
    <h3 class="modal-title">{{data['entity'].toUpperCase()}} entity details</h3>
  </div>
  <div class="modal-body">
    <div>
      <table class="table table-striped b-t b-light">
        <tr ng-repeat="key in notSorted(data)" ng-init="value = data[key]; type = getType(key, value)">
          <th>{{key}}</th>
          <td ng-show="type==='timestamp'">
            {{displayValue(value, type)}}
          </td>
          <td ng-show="type==='id'" ng-click='updateEntity(key, value)'>
            <a href>{{value}}</a>
          </td>
          <td ng-show="type === 'payment'">
            <a ui-sref="app.payments({id:value, mode: mode})" target="_blank">
              {{value}}
            </a>
            (will open in new tab)
          </td>
          <td ng-show="type === 'merchant'">
            <a ui-sref="app.merchants.detail({id:value})" target="_blank">
              {{value}}
            </a>
            (will open in new tab)
          </td>
          <td ng-show="type==='unknown'">
            {{value}}
          </td>
        </tr>
      </table>
    </div>
  </div>
  <div class="modal-footer">
    <div class="btn-group col-lg-11 text-left" role="group"
      aria-label="Payment actions" ng-show="data['entity'] == 'payment'"
    >
      <button class="btn btn-success">Verify</button>
      <button ng-show="data['status'] == 'failed'" class="btn btn-info"
        ng-confirm-click="Are you sure you want to authorize this failed payment?"
        ng-click="payment.authorize(data['id'])"
      >
        Authorize Failed
      </button>
      <button ng-show="data['status'] !== 'refunded'" class="btn btn-primary"
        ng-click="payment.refund(data['id'])"
      >
        Refund
      </button>
    </div>
    <div class="btn-group col-lg-11 text-left" role="group"
      aria-label="Terminal Actions" ng-show="data['entity'] == 'terminal'"
    >
      <button class="btn btn-danger" ng-click="terminal.delete(data['id'])"
        ng-confirm-click="Are you sure you want to delete this terminal?"
      >
        Delete
      </button>
    </div>
    <button class="col-lg-1 text-right btn btn-primary" ng-click="ok()">OK</button>
  </div>
</script>
