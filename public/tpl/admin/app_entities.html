<div class="bg-light lter b-b wrapper-md">
  <h1 class="m-n font-thin h3">
    Entities
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md" ng-controller="EntitiesCtrl">
  <div class="panel panel-default">
    <div class="panel-heading">
      <ul class="nav navbar-nav navbar-right pagination-sm m-t-none m-b-none">
        <li ng-click="allowPrev && prev()"><button class="btn btn-default fa fa-chevron-left" ng-disabled="!allowPrev"></button></li>
        <li ng-click="allowNext && next()"><button class="btn btn-default  fa fa-chevron-right" ng-disabled="!allowNext"></button></li>
      </ul>

      List of all {{entity_type +  "s"| titlecase}} ({{mode + " mode" | titlecase}})
    </div>
    <div class="row wrapper">
      <div class="text-center m-t">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="col-sm-2 m-b-xs">
        Entity Type:
        <select class="form-control input-sm w-sm inline " name="entity_type" ng-model="entity_type">
          <option ng-repeat="(entity, display) in getEntityListForUI()" value="{{entity}}" ng-selected="entity_type==entity">
            {{display | titlecase}}
          </option>
        </select>
      </div>
      <div class="col-xs-2">
        Mode:
        <select class="form-control input-sm w-xs inline" name="mode" ng-model="mode">
          <option value="live">Live</option>
          <option value="test">Test</option>
        </select>
      </div>
      <div class="col-xs-1">
        Count
        <input type="number" min="10" step="10" class="form-control inline w-xxs" ng-model="count" value="20" placeholder="20" name="count" ng-enter="showTable()">
      </div>
      <div class="col-sm-2">
        From:
        <!-- The min is 1st Jan 2015 -->
        <input type="number" min="{{minTimestamp}}" step="3600" class="form-control input-sm w-sm inline " ng-model="from" value="{{from}}" placeholder="From Timestamp" name="frpm" max="{{maxTimestamp}}"><br>
        <span>{{timestamps('from')}}</span>
      </div>
      <div class="col-sm-2">
        To:
        <!-- The min is 1st Jan 2015 -->
        <input type="number" min="{{minTimestamp}}" step="3600" class="form-control input-sm w-sm inline " ng-model="to" value="{{to}}" placeholder="To Timestamp" name="to" max="{{maxTimestamp}}"><br>
        <span>{{timestamps('to')}}</span>
      </div>
      <div class="col-sm-2">
        <div class="input-group">
          <input type="text" class="input-sm form-control" placeholder="Search Entity Id" ng-model="entity.id">
          <span class="input-group-btn">
            <button class="btn btn-sm btn-default" type="button" ng-click="search()" >Go!</button>
          </span>
        </div>
      </div>
      <div class="col-sm-1">
        <button class="btn btn-primary" ng-click="generateTable(true);">Download</button>
      </div>
    </div>
    <div class="row wrapper">
      <div class="col-sm-2" ng-repeat="(filter, values) in availableFilters[entity_type]">
        <label ng-show="values.length !== 1">
          {{filter|titlecase}}:
        </label>
        <label ng-show="values.length === 1">
          {{values[0]}}
        </label>
        <select ng-show="values.length !== 1"
          class="form-control input-sm w-sm"
          ng-model="filters[entity_type][filter]"
        >
          <option value="{{value}}" ng-repeat="value in values">
            {{displayFilter(value)|titlecase}}
          </option>
        </select>
        <input ng-show="values.length===1" type="text"
          ng-enter="showTable()"
          class="input-sm form-control w-sm" placeholder="{{filter}}"
          value="" ng-model="filters[entity_type][filter]"
        >
      </div>
    </div>
    <div class="table-responsive">
      <table id="merchants-table" class="table table-striped b-t b-light">
        <thead>
          <tr>
            <th ng-repeat="(key, value) in headings | limitTo: 11" data-hide="{{key != 0 ? 'phone,tablet' : ''}}">{{value}}</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="row in entity.items">
            <td ng-repeat="key in notSorted(row) | limitTo: 11" ng-init="value = row[key]">
              <!-- This is the entity.id -->
              <a target="_blank" ui-sref="{{getState(row.entity, true)}}" ng-show="key==='id'">
                <code>{{value}}</code>
              </a>
              <!-- References to other entities -->
              <a target="_blank" ui-sref="{{getState(key, false, row.entity_type || row.type)}}" ng-show="getState(key)!=='.'">
                <code>{{value}}</code>
              </a>

              <span ng-show="key=='status'" title="{{value}}" class="label {{getStatusClass(value)}}"
              style="font-size: 100%">
                {{value}}
              </span>
              <!-- Just entity fields -->
              <span ng-show="key!=='id' && key!=='status' && getState(key)==='.'">
                {{value}}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <footer class="panel-footer">
      <div class="row">
        <div class="col-sm-4 hidden-xs">
        </div>
        <div class="col-sm-4 text-center">
          <small class="text-muted inline m-t-sm m-b-sm">Showing {{entity.countStart}}-{{entity.countEnd}}</small>
        </div>
        <div class="col-sm-4 text-right text-center-xs">
          <ul class="nav navbar-nav navbar-right pagination-sm m-t-none m-b-none">
            <li ng-click="allowPrev && prev()"><button class="btn btn-default fa fa-chevron-left" ng-disabled="!allowPrev"></button></li>
            <li ng-click="allowNext && next()"><button class="btn btn-default  fa fa-chevron-right" ng-disabled="!allowNext"></button></li>
          </ul>
        </div>
      </div>
    </footer>
  </div>
</div>
