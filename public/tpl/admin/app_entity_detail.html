<div class="bg-light lter b-b wrapper-md" ng-controller="EntityDetailCtrl">
  <h1 class="m-n font-thin h3">
    {{entity.type | titlecase}} Entity Detail ({{mode + " Mode"| titlecase }})
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md entity-wrapper" ng-controller="EntityDetailCtrl" ng-init="generate(loadType)">
  <div class="panel panel-default col-sm-6 col-sm-offset-3" >
    <div class="panel-heading m-t m-b">
      Entity Id: <strong>{{entity.id}}</strong><br>
    </div>
  <div class="text-center m-t">
    <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
  </div>
    <div class="row wrapper">
      <div class="list-group">
        <div class="list-group-item" ng-repeat="key in getKeys()"
          ng-init="value = entity[key];valueType = getType(key, value);state=getState(key);" ui-sref="{{state}}"
        >
          <span ng-show="!isStatusKey(key)" class="pull-right {{displayClass(value)}}" title="{{value}}">
            {{displayValue(value, valueType)}}
          </span>
          <span ng-show="isStatusKey(key)" class="pull-right label {{getStatusClass(value)}}" title="{{value}}" >
            {{displayValue(value, valueType)}}
          </span>
          {{key|titlecase}}
        </div>
        <div class="list-group-item" style="overflow:auto;">
          <pre class="col-lg-8 pull-right">{{toJson(entity)}}</pre>
          Raw
        </div>
      </div>
    </div>
    <div class="panel-footer row" ng-show="entity.entity == 'terminal'">
      <div class="btn-group text-left" role="group"
        aria-label="Terminal Actions"
      >
        <button class="btn btn-danger" ng-click="terminal.delete(entity.id)"
          ng-confirm-click="Are you sure you want to delete this terminal?"
        >
          Delete Terminal
        </button>
        <button class="btn btn-info" ng-click="open.terminalEdit(entity)">
          Edit Terminal
        </button>
        <button ng-show="entity.enabled" class="btn btn-warning" ng-click="terminal.disable(entity.id)"
          ng-confirm-click="Are you sure you want to disable this terminal?"
        >
          Disable Terminal
        </button>
        <button ng-show="!entity.enabled" class="btn btn-success" ng-click="terminal.enable(entity.id)"
          ng-confirm-click="Are you sure you want to disable this terminal?"
        >
          Enable Terminal
        </button>
      </div>
    </div>
    <div class="panel-footer row" ng-show="entity.entity == 'iin'">
      <div class="btn-group text-left" role="group"
        aria-label="IIN Actions"
      >
        <button class="btn btn-danger" ng-click="iin.delete(entity.id)"
          ng-confirm-click="Are you sure you want to delete this iin?"
        >
          Delete IIN
        </button>
        <button class="btn btn-info" ng-click="open.iinEdit(entity)">
          Edit IIN
        </button>
      </div>
    </div>
    <div class="panel-footer row" ng-show="entity.entity == 'emi'">
      <div class="btn-group text-left" role="group"
        aria-label="EMI Plan Actions"
      >
        <button class="btn btn-danger" ng-click="emi.delete(entity.id)"
          ng-confirm-click="Are you sure you want to delete this EMI Plan?"
        >
          Delete EMI Plan
        </button>
        <!-- <button class="btn btn-info" ng-click="open.emiEdit(entity)">
          Edit EMI Plan
        </button> -->
      </div>
    </div>
  </div>
</div>
<script type="text/ng-template" id="editTerminal.html">
  <div class="modal-header">
    <h3 class="modal-title">Edit Terminal</h3>
  </div>
  <div class="modal-body terminal-modal">
    <span class="text-danger"><strong>
    Warning: Terminals can only be edit before any transactions happen through them
    </strong></span>
    <form class="form-horizontal">
      <div class="form-group">
        <label class="col-lg-4 control-label">Gateway:</label>
        <div class="col-lg-8" >
          <select disabled class="form-control m-b" ng-model="terminal.gateway">
             <option value="hdfc" selected>HDFC</option>
             <option value="amex">Amex</option>
             <option value="atom">Atom</option>
             <option value="axis_migs">Axis MIGS</option>
             <option value="axis_genius">Axis Genius</option>
             <!-- <option value="paytm">Paytm</option> -->
             <option value="mobikwik">Mobikwik</option><
             <option value="billdesk">Billdesk</option>
             <option value="ebs">EBS</option>
             <option value="first_data">FirstData</option>
             <option value="kotak">Kotak</option>
             <option value="netbanking_hdfc">Netbanking HDFC</option>
             <option value="netbanking_kotak">Netbanking KOTAK</option>
             <option value="cybersource">Cybersource</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="col-lg-3 control-label">Acquirer:</label>
        <div class="col-lg-9" >
          <select class="form-control m-b" ng-model="terminal.gateway_acquirer">
             <option value="hdfc" selected>HDFC</option>
             <option value="axis">Axis</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="gateway_merchant_id" class="col-lg-4 control-label">Gateway Merchant Id:</label>
        <div class="col-lg-8" >
          <input type="text" class="form-control m-b" name="gateway_merchant_id" ng-model="terminal.gateway_merchant_id" />
        </div>
      </div>
      <div class="form-group">
        <label for="gateway_terminal_id" class="col-lg-4 control-label">Gateway Terminal Id:</label>
        <div class="col-lg-8" >
          <input type="text" class="form-control m-b" name="gateway_terminal_id" ng-model="terminal.gateway_terminal_id" />
        </div>
      </div>
      <div class="form-group">
        <label for="gateway_terminal_password" class="col-lg-4 control-label">Gateway Terminal Password:</label>
        <div class="col-lg-8" >
          <input type="password" class="form-control m-b" name="gateway_terminal_password" ng-model="terminal.gateway_terminal_password" />
        </div>
      </div>
      <div class="form-group">
        <label for="gateway_access_code" class="col-lg-4 control-label">Gateway Access Code:</label>
        <div class="col-lg-8" >
          <input type="text" class="form-control m-b" name="gateway_access_code" ng-model="terminal.gateway_access_code" />
        </div>
      </div>
      <div class="form-group">
        <label for="gateway_recon_password" class="col-lg-4 control-label">Gateway Recon Password:</label>
        <div class="col-lg-8" >
          <input type="text" class="form-control m-b" name="gateway_recon_password" ng-model="terminal.gateway_recon_password" />
        </div>
      </div>
      <div class="form-group">
        <label for="gateway_secure_secret" class="col-lg-4 control-label">Gateway Secure Secret:</label>
        <div class="col-lg-8" >
          <input type="text" class="form-control m-b" name="gateway_secure_secret" ng-model="terminal.gateway_secure_secret" />
        </div>
      </div>
      <div class="form-group">
        <label for="card" class="col-lg-4 control-label">Card Allowed (Always Yes for HDFC):</label>
        <div class="col-lg-8" >
          <select class="form-control m-b" ng-model="terminal.card">
             <option value="1" selected>Yes</option>
             <option value="0">No</option>
          </select>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
      <button class="btn btn-default" ng-click="cancel()">Cancel</button>
      <button class="btn btn-primary modal-ok" ng-confirm-click="Terminal editing is dangerous. Please ensure you have filled the correct details." ng-click="ok(terminal)">OK</button>
  </div>
</script>
<script type="text/ng-template" id="editIin.html">
  <div class="modal-header">
    <h3 class="modal-title">Edit IIN</h3>
  </div>
  <div class="modal-body iin-modal">
    <form class="form-horizontal">
      <div class="form-group">
        <label for="iin" class="col-lg-2 control-label">IIN (6 digit):</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="iin" ng-model="iin.iin" readonly="true">
        </div>
      </div>
      <div class="form-group">
        <label for="network" class="col-lg-2 control-label">Network:</label>
        <div class="col-lg-10" >
          <select class="form-control m-b" name="network" ng-model="iin.network">
            <option value="American Express">American Express</option>
            <option value="Diners Club">Diners Club</option>
            <option value="Discover">Discover</option>
            <option value="JCB">JCB</option>
            <option value="Maestro">Maestro</option>
            <option value="MasterCard">MasterCard</option>
            <option value="RuPay">RuPay</option>
            <option value="Visa">Visa</option>
            <option value="Union Pay">Union Pay</option>
            <option value="Unknown">Unknown</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="type" class="col-lg-2 control-label">Type:</label>
        <div class="col-lg-10" >
          <select class="form-control m-b" name="type" ng-model="iin.type">
            <option value="credit">Credit</option>
            <option value="debit">Debit</option>
            <option value="unkown">Unknown</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="country" class="col-lg-2 control-label">Country (2 character):</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="country" length="2" ng-model="iin.country" />
        </div>
      </div>
      <div class="form-group">
        <label for="category" class="col-lg-2 control-label">Category:</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="category" ng-model="iin.category" />
        </div>
      </div>
      <div class="form-group">
        <label for="issuer" class="col-lg-2 control-label">Issuer:</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="issuer" ng-model="iin.issuer" />
        </div>
      </div>
      <div class="form-group">
        <label for="issuer_name" class="col-lg-2 control-label">Issuer Name:</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="issuer_name" ng-model="iin.issuer_name" />
        </div>
      </div>
      <div class="form-group">
        <label for="emi" class="col-lg-2 control-label">EMI:</label>
        <div class="col-lg-10" >
          <label class="i-checks ng-binding">
            <input ng-model="iin.emi" name="emi" type="checkbox" class="ng-pristine ng-valid">
            <i></i>
            EMI Available
          </label>
        </div>
      </div>
      <!--<div class="form-group">
        <label for="emi" class="col-lg-2 control-label">International:</label>
        <div class="col-lg-10" >
          <label class="i-checks ng-binding">
            <input name="international" ng-model="iin.international" type="checkbox" class="ng-pristine ng-valid">
            <i></i>
            International
          </label>
        </div>
      </div>-->
      <div class="form-group">
        <label for="trivia" class="col-lg-2 control-label">Trivia:</label>
        <div class="col-lg-10" >
          <input type="text" class="form-control m-b" name="trivia" ng-model="iin.trivia" />
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
      <button class="btn btn-default" ng-click="cancel()">Cancel</button>
      <button class="btn btn-primary modal-ok" ng-click="ok(iin)">OK</button>
  </div>
</script>
