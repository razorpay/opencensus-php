<div class="bg-light lter b-b wrapper-md" ng-controller="EntityDetailCtrl">
  <h1 class="m-n font-thin h3">
    {{entity.type | titlecase}} Entity Detail ({{mode + " Mode"| titlecase }})
    <spinner class="inline"></spinner>
  </h1>
</div>
<div class="wrapper-md entity-wrapper" ng-controller="EntityDetailCtrl" ng-init="generate(entity.type)">
  <div class="panel panel-default col-sm-6 col-sm-offset-3" >
    <div class="panel-heading m-t m-b">
      Entity Id: <strong>{{entity.id}}</strong>
    </div>
  <div class="text-center m-t">
    <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
  </div>
    <div class="row wrapper">
      <div class="list-group">
        <a class="list-group-item" ng-repeat="(key,value) in entity"
          ng-init="type = getType(key, value)" ui-sref="{{getState(type)}}"
        >
          <span class="pull-right">
            {{displayValue(value, type)}}
          </span>
          {{key|titlecase}}
        </a>
      </div>
    </div>
    <div class="panel-footer row">
      <div class="btn-group text-left" role="group"
        aria-label="Terminal Actions" ng-show="entity.entity == 'terminal'"
      >
        <button class="btn btn-danger" ng-click="terminal.delete(entity.id)"
          ng-confirm-click="Are you sure you want to delete this terminal?"
        >
          Delete Terminal
        </button>
        <button class="btn btn-warning" ng-click="terminal.edit(entity)">
          Edit Terminal
        </button>
      </div>
    </div>
  </div>
</div>
