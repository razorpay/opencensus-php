<div class="container w-xxl w-auto-xs" ng-controller="SigninCtrl">
  <a href="#/" class="col-sm-12 text-center m-t m-b"><img id="login_logo" class="img-responsive" src="{{login_logo}}" alt=""></a>
  <div class="m-b-lg">
    <div class="wrapper text-center">
      <strong>Admin Sign in</strong>
    </div>
    <form name="signin" ng-submit="submit(signin.$valid)" class="form-validation" novalidate>
      <div class="list-group list-group-sm">
        <div class="list-group-item">
          <input type="text" name="username" ng-model="data.username" placeholder="Username" class="form-control no-border" required>
        </div>
        <div class="list-group-item">
           <input type="password" name="password" ng-model="data.password" placeholder="Password" class="form-control no-border" required>
        </div>
      </div>
      <button type="submit" name="submit" class="btn btn-lg btn-primary btn-block">Log in</button>

      <div class="text-center m-t m-b">
        <spinner></spinner>
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
    </form>
  </div>
  <div class="text-center" ng-include="'tpl/blocks/page_footer.html'"></div>
</div>
