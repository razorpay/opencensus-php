<div ng-controller="AddOrgFieldMap">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Field Map
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel-form-container">
      <div class="text-center">
        <alert ng-repeat="alert in alerts.getAlerts()" type="{{alert.type}}" close="alerts.closeAlert($index)">{{alert.msg}}</alert>
      </div>
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>
            {{ fieldMap.id ? 'Edit ' + fieldMap.id : 'Add a new Field Map' }}
          </h4>
        </div>
        <div class="panel-body">
          <form class="form-horizontal form-validation">
            <div class="form-group">
             <label for="name" class="col-lg-3 control-label">Entity Name</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="entity_name"
                  ng-model="fieldMap.entity_name" ng-required="true">
              </div>
            </div>
            <div class="form-group">
             <label for="name" class="col-lg-3 control-label">Fields</label>
              <div class="col-lg-8" >
                <input class="form-control m-b" name="fields"
                  ng-model="fieldMap.fields" ng-required="true">
              </div>
            </div>
            <div class="panel-footer">
              <div class="row">
                <div class="col-lg-offset-3 col-lg-8 text-center">
                  <button class="btn btn-primary panel-btn-action" async-btn-click="save(fieldMap)">
                    Save
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
