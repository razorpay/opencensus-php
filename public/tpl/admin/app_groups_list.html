<div ng-controller="GroupsCtrl">
  <div class="bg-light lter b-b wrapper-md">
    <h1 class="m-n font-thin h3">
      Groups - Total {{count}}
      <spinner class="inline"></spinner>
    </h1>
  </div>
  <div class="wrapper-md">
    <div class="panel panel-default">
      <div class="panel-heading">
        List of all Groups
      </div>
      <div class="row wrapper">
        <div class="col-md-6 m-b-xs">
          Search: <input id="filter" type="text" class="form-control input-sm w-sm inline m-r">
        </div>
         <div class="col-md-6">
            <a id='addGroupButton' class='btn btn-default pull-right' ui-sref='app.groups.add'>
              Add a Groups
            </a>
          </div>
      </div>
      <div>
        <table ui-jq="footable" data-filter="#filter" data-page="false" class="merchants-table table-responsive table table-striped b-t b-light">
          <thead>
            <tr>
              <th>Group Id</th>
              <th>Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="row in groups" class="merchants-table-body">
              <td><a ui-sref="app.groups.detail({id:row.id})" target="_blank">{{row.id}}</a></td>
              <td>{{row.name}}</td>
              <td>{{row.description}}</td>
  <!--        <td data-value="{{row.created_at}}">{{row.created_at*1000 | date:'medium'}}</td> -->
            </tr>
            <tr ng-show="groups.length == 0">
              <td colspan="7">No Groups</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
