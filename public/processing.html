<!doctype html>
<head>
    <title>Razorpay - Payment in progress</title>
</head>
<body>
<script>
function createCookie(name, value, days){
  if (days) {
    var date = new Date();
    date.setTime(date.getTime()+(days*24*60*60*1000));
    var expires = "; expires="+date.toGMTString();
  }
  else var expires = "";
  document.cookie = name+"="+value+expires+"; path=/";
}

function readCookie(name){
  var nameEQ = name + "=";
  var ca = document.cookie.split(';');
  for(var i=0;i < ca.length;i++){
    var c = ca[i];
    while (c.charAt(0)==' ') c = c.substring(1,c.length);
    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
  }
  return null;
}

// remove cookie
    // TODO cookie with unique keys, so that one tab doesn't interfere another
if(readCookie('rzp-receive'))
  createCookie('rzp-receive', '', -1)
//
// everything is wrapped in the XD function to reduce namespace collisions
//
var XD = function() {

    var interval_id,
        last_hash,
        cache_bust = 1,
        attached_callback,
        window = this;

    return {
        postMessage : function(message, target_url, target) {
            if (!target_url) {
                return;
            }
            //
            // default to parent
            //
            target = target || parent;

            if (window['postMessage']) {
                //
                // the browser supports window.postMessage, so call it with a
                // targetOrigin set appropriately, based on the target_url
                // parameter.
                //
                target['postMessage'](message, target_url.replace( /([^:]+:\/\/[^\/]+).*/, '$1'));
            }
            else if (target_url) {
                //
                // the browser does not support window.postMessage,
                // so use the window.location.hash fragment hack
                //
                target.location = target_url.replace(/#.*$/, '') + '#' +
                                  (+new Date) + (cache_bust++) + '&' + message;
            }
        },
        receiveMessage : function(callback, source_origin) {
            //
            // browser supports window.postMessage
            //
            if (window['postMessage']) {
                //
                // bind the callback to the actual event associated with
                // window.postMessage
                //
                if (callback) {
                    attached_callback = function(e) {
                        if ((typeof source_origin === 'string' && e.origin !== source_origin)
                        || ((Object.prototype.toString.call(source_origin) === "[object Function]") &&
                            (source_origin(e.origin) === !1))) {
                             return !1;
                         }

                         callback(e);
                     };
                 }
                 if (window['addEventListener']) {
                     window[callback ? 'addEventListener' : 'removeEventListener']('message', attached_callback, !1);
                 } else {
                     window[callback ? 'attachEvent' : 'detachEvent']('onmessage', attached_callback);
                 }
             } else {
                 //
                 // a polling loop is started & callback is called whenever
                 // the location.hash changes
                 //
                 interval_id && clearInterval(interval_id);
                 interval_id = null;

                 if (callback) {
                     interval_id = setInterval(function() {
                         var hash = document.location.hash,
                         re = /^#?\d+&/;
                         if (hash !== last_hash && re.test(hash)) {
                             last_hash = hash;
                             callback({data: hash.replace(re, '')});
                         }
                     }, 100);
                 }
             }
         }
    };
}();

function autosubmit(data){
  document.querySelectorAll('input[name="PaReq"]')[0].setAttribute('value', data.PAReq);
  document.querySelectorAll('input[name="MD"]')[0].setAttribute('value', data.paymentid);
  document.querySelectorAll('input[name="TermUrl"]')[0].setAttribute('value', data.callbackUrl);
  document.querySelectorAll('#rzp-dcform')[0].setAttribute('action', data.url);
  document.getElementById('rzp-dcform').submit();
}

XD.receiveMessage(function(message){
  handleMessage(message.data);
});

var csData = {};

// delete localStorage['rzp-receive'];
var intervalID = setInterval(function(){
  receive_cookie = readCookie('rzp-receive')
  if(receive_cookie){
    handleMessage(JSON.parse(receive_cookie));
    createCookie('rzo-receive', '', -1)
  }
  // else if(typeof localStorage['rzp-receive'] !== 'undefined'){
  //   handleMessage(JSON.parse(localStorage['rzp-receive']));
  // }
  else{
    return
  }
  clearInterval(intervalID);
}, 300)

function handleMessage(data){
  if(typeof data.rzp !== 'undefined'){
    if(typeof data.location !== 'undefined'){
      window.location = data.location;
    }
    else if(typeof data.autosubmit !== 'undefined'){
      autosubmit(data.autosubmit);
    }
  }
}

</script>
<style>
  .rzp-loader {
    display: block;
    position: relative;
    left: 50%;
    top: 50%;
    width: 160px;
    height: 160px;
    margin: 75px 0 0 -75px;
    border-radius: 50%;
    border: 5px solid transparent;
    border-top-color: #29b7d6;
    -webkit-animation: spin 2s linear infinite;
    animation: spin 2s linear infinite;
  }
  .rzp-loader:before {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    right: 5px;
    bottom: 5px;
    border-radius: 50%;
    border: 5px solid transparent;
    border-top-color: #0b81b2;
    -webkit-animation: spin 3s linear infinite;
    animation: spin 3s linear infinite;
  }
  .rzp-loader:after {
    content: "";
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    bottom: 15px;
    border-radius: 50%;
    border: 5px solid transparent;
    border-top-color: #29b7d6;
    -webkit-animation: spin 1.5s linear infinite;
    animation: spin 1.5s linear infinite;
  }

  .rzp-loader img {
    width: 80px;
    position: absolute;
    top: 40px;
    left: 40px;
    -webkit-animation: antispin 2s linear infinite;
    animation: antispin 2s linear infinite;
  }

  @-webkit-keyframes spin {
    0%{
      -webkit-transform: rotate(0deg);  /* Chrome, Opera 15+, Safari 3.1+ */
      -ms-transform: rotate(0deg);  /* IE 9 */
      transform: rotate(0deg);  /* Firefox 16+, IE 10+, Opera */
    }
    100% {
      -webkit-transform: rotate(360deg);  /* Chrome, Opera 15+, Safari 3.1+ */
      -ms-transform: rotate(360deg);  /* IE 9 */
      transform: rotate(360deg);  /* Firefox 16+, IE 10+, Opera */
    }
  }
  @-webkit-keyframes antispin {
    0%{
      -webkit-transform: rotate(360deg);  /* Chrome, Opera 15+, Safari 3.1+ */
      -ms-transform: rotate(360deg);  /* IE 9 */
      transform: rotate(360deg);  /* Firefox 16+, IE 10+, Opera */
    }
    100% {
      -webkit-transform: rotate(0deg);  /* Chrome, Opera 15+, Safari 3.1+ */
      -ms-transform: rotate(0deg);  /* IE 9 */
      transform: rotate(0deg);  /* Firefox 16+, IE 10+, Opera */
    }
  @keyframes spin {
    0%{
      -webkit-transform: rotate(0deg);  /* Chrome, Opera 15+, Safari 3.1+ */
      -ms-transform: rotate(0deg);  /* IE 9 */
      transform: rotate(0deg);  /* Firefox 16+, IE 10+, Opera */
    }
    100%{
      -webkit-transform: rotate(360deg);  /* Chrome, Opera 15+, Safari 3.1+ */
      -ms-transform: rotate(360deg);  /* IE 9 */
      transform: rotate(360deg);  /* Firefox 16+, IE 10+, Opera */
    }
  }
</style>
<div class="rzp-loader">
<img src="https://checkout.razorpay.com/v1/images/loader-logo.png" alt="">
</div>

<div class="autosubmit">
  <form method = "POST" action = "{{=it.data.url}}" id = "rzp-dcform">
    <input type = "hidden" name = "PaReq" value = "{{=it.data.PAReq}}">
    <input type = "hidden" name = "MD" value = "{{=it.data.paymentid}}">
    <input type = "hidden" name = "TermUrl" value = "{{=it.callbackUrl}}">
    <input style = "display:none" type = "submit" value = "Submit">
  </form>
</div>

<script>
  msg = JSON.stringify({
    source: 'popup',
    loaded: true
  })
  XD.postMessage(msg, '*', window.opener);
  // localStorage['rzp'] = msg;
  document.cookie = "rzp="+msg+"; path=/";
</script>
</body>
</html>
