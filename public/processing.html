<!doctype html>
<head>
    <title>Razorpay - Payment in progress</title>
</head>
<body>
<script>

function autosubmit(data){
  document.querySelectorAll('input[name="PaReq"]')[0].setAttribute('value', data.PAReq);
  document.querySelectorAll('input[name="MD"]')[0].setAttribute('value', data.paymentid);
  document.querySelectorAll('input[name="TermUrl"]')[0].setAttribute('value', data.callbackUrl);
  document.querySelectorAll('#rzp-dcform')[0].setAttribute('action', data.url);
  document.getElementById('rzp-dcform').submit();
}

if (window.addEventListener) {
  var callback = function(message){
    handleMessage(message.data);
  }
  window.addEventListener('message', callback, false);
}
else {
  window.attachEvent('onmessage', callback);
}

function createCookie(name, value, days){
  if (days) {
    var date = new Date();
    date.setTime(date.getTime()+(days*24*60*60*1000));
    var expires = "; expires="+date.toGMTString();
  }
  else var expires = "";
  document.cookie = name+"="+value+expires+"; path=/";
}

function readCookie(name){
  var nameEQ = name + "=";
  var ca = document.cookie.split(';');
  for(var i=0;i < ca.length;i++){
    var c = ca[i];
    while (c.charAt(0)==' ') c = c.substring(1,c.length);
    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
  }
  return null;
}

// remove cookie
// TODO cookie with unique keys, so that one tab doesn't interfere another

var csData = {};

var intervalID = setInterval(function(){
  receive_cookie = readCookie('rzp-receive')
  if(receive_cookie){
    handleMessage(JSON.parse(receive_cookie));
    createCookie('rzp-receive', '', -1)
  }
}, 500)

function handleMessage(data){
  if(typeof data.rzp !== 'undefined'){
    if(typeof data.location !== 'undefined'){
      window.location = data.location;
    }
    else if(typeof data.autosubmit !== 'undefined'){
      autosubmit(data.autosubmit);
    }
  }
}

</script>
<style>
  .rzp-loader {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140px;
    height: 140px;
    margin: -70px 0 0 -70px;
    border-radius: 50%;
    border: 5px solid transparent;
    border-top-color: #29b7d6;
    -webkit-animation: spin 2s linear infinite;
    animation: spin 2s linear infinite;
  }
  .rzp-loader:before {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    right: 5px;
    bottom: 5px;
    border-radius: 50%;
    border: 5px solid transparent;
    border-top-color: #0b81b2;
    -webkit-animation: spin 3s linear infinite;
    animation: spin 3s linear infinite;
  }
  .rzp-loader:after {
    content: "";
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    bottom: 15px;
    border-radius: 50%;
    border: 5px solid transparent;
    border-top-color: #29b7d6;
    -webkit-animation: spin 1.5s linear infinite;
    animation: spin 1.5s linear infinite;
  }

  .rzp-logo {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    width: 80px;
    height: 80px;
    margin-top: -40px;
    margin-left: -40px;
  }

  @-webkit-keyframes spin {
    0%{
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
    }
    100% {
      -webkit-transform: rotate(360deg);
      transform: rotate(360deg);
    }
  }
  @-ms-keyframes spin {
    0%{
      -ms-transform: rotate(0deg);
      transform: rotate(0deg);
    }
    100% {
      -ms-transform: rotate(360deg);
      transform: rotate(360deg);
    }
  }
  @-moz-keyframes spin {
    0%{
      -moz-transform: rotate(0deg);
      transform: rotate(0deg);
    }
    100% {
      -moz-transform: rotate(360deg);
      transform: rotate(360deg);
    }
  }
  @keyframes spin {
    0%{
      -webkit-transform: rotate(0deg);
      -moz-transform: rotate(0deg);
      -ms-transform: rotate(0deg);
      transform: rotate(0deg);
    }
    100%{
      -webkit-transform: rotate(360deg);
      -moz-transform: rotate(360deg);
      -ms-transform: rotate(360deg);
      transform: rotate(360deg);
    }
  }
</style>
<img class="rzp-logo" src="https://checkout.razorpay.com/v1/images/loader-logo.png" alt="">
<div class="rzp-loader"></div>

<div class="autosubmit">
  <form method = "POST" action = "{{=it.data.url}}" id = "rzp-dcform">
    <input type = "hidden" name = "PaReq" value = "{{=it.data.PAReq}}">
    <input type = "hidden" name = "MD" value = "{{=it.data.paymentid}}">
    <input type = "hidden" name = "TermUrl" value = "{{=it.callbackUrl}}">
    <input style = "display:none" type = "submit" value = "Submit">
  </form>
</div>

<script>
  msg = {
    source: 'popup',
    loaded: true
  }
  window.opener.postMessage(msg, '*');
  // localStorage['rzp'] = msg;
  document.cookie = "rzp="+JSON.stringify(msg)+"; path=/";
</script>
</body>
</html>
