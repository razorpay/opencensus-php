<VirtualHost *:80>
	ServerName dashboard.razorpay.test
	ServerAdmin abhshkdz@razorpay.test
	DocumentRoot /Users/sumeetilalwani/workspace/projects/dashboard/public
	<Directory /Users/sumeetilalwani/workspace/projects/dashboard/public>
		#Do not show indexes
		#Do not follow symlinks
		Options -Indexes -MultiViews
		AllowOverride All
		Require local
		<IfModule mod_rewrite.c>
			RewriteEngine on
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{REQUEST_FILENAME} !-d
			RewriteCond $1 !^(index\.php)
			RewriteRule ^(.*)$ index.php/$1 [L]
		</IfModule>
	</Directory>
	ErrorLog /var/log/apache2/rzp.dashboard.error.log

	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel warn
	CustomLog /var/log/apache2/rzp.dashboard.access.log combined
</VirtualHost>
