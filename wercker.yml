box: wercker/php
services:
    - wercker/mysql
build:
    steps:
      - install-packages:
          packages: lsof
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: Install java
          code: |-
                sudo apt-get install openjdk-7-jdk
                sudo apt-get remove openjdk-6-jre openjdk-6-jre-lib
                java -version
                echo $JAVA_HOME
      - script:
          name: Enable virtual display
          code: |-
                # Start xvfb which gives the context a virtual display
                # which is required for tests that require an GUI
                export DISPLAY=:99.0
                start-stop-daemon --start --quiet --pidfile /tmp/xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset
                # Give xvfb time to start. 3 seconds is the default for all xvfb-run commands.
                sleep 3
      - script:
          name: copy wercker config
          code:  cp .env.wercker.php .env.testing.php
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - wercker/npm-install@0.9.3
      - script:
          name: Create grunt config and set environment
          code: cp app/config/grunt.sample.json app/config/grunt.json && sed -i "2s/development/production/" app/config/grunt.json
      - grunt:
          tasks: default
          fail-on-warnings: true
      # This pins the selenium version to our choice
      - script:
          name: Install selenium
          code: wget http://selenium-release.storage.googleapis.com/2.49/selenium-server-standalone-2.49.0.jar
      - script:
          name: Start selenium
          code: nohup java -jar selenium-server-standalone-2.49.0.jar > $WERCKER_REPORT_ARTIFACTS_DIR/selenium.log 2>&1&
      - script:
          name: run unit tests
          code: phpunit --stop-on-error --stop-on-failure
      # This is because wercker is untrusworthy
      - script:
          name: List directory
          code: ls -lah
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
      - script:
          name: copy screenshot
          # We want this step to not fail even if the file is missing
          code: cp app/storage/selenium.png $WERCKER_REPORT_ARTIFACTS_DIR/selenium.png || true
deploy:
    steps:
      - script:
          name: Change to production mode
          code: >
              sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      # We don't trust wercker anymore
      - script:
          name: List directory
          code: ls -lah
      - script:
          name: check vendor dir exists
          code: if [ ! -d vendor ] ; then exit 1 ; fi;
      - script:
          name: check if dotfile rsyncignore exists
          code: if [ ! -f .rsyncignore ] ; then exit 1 ; fi;
      - nhuray/aws-code-deploy:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: Dashboard
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: "rzp-codedeploy"
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
      - akelmanson/rollbar-notify:
          access-token: $ROLLBAR_ACCESS_TOKEN
          environment: $WERCKER_DEPLOYTARGET_NAME
