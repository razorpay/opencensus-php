box: php:5.6
dev:
  steps:
    - internal/shell:
      code: echo "Welcome to Razorpay\\Api"
build:
    services:
      - id: mysql
        tag: latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: root
          MYSQL_ROOT_PASSWORD: root
    # The steps that will be executed on build
    steps:
      # A custom script step, name value is used in the UI
      # and the code value contains the command that get executed
      - script:
          name: Install linux packages
          code: apt-get update && apt-get install -y libmcrypt-dev libssl-dev git-core libsqlite3-dev libmysqlclient18 python-pip
      - script:
          name: Install php extensions
          code: docker-php-ext-install mcrypt mbstring zip pcntl pdo_sqlite pdo_mysql
      - script:
          name: copy env file
          code: cp .env.wercker.php .env.testing.php
      - script:
          name: set composer to use github oauth token
          code: php composer.phar config -g github-oauth.github.com $github_token
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: install dependencies
          code: php composer.phar install --no-interaction
      - script:
          name: install xdebug
          code: pecl install xdebug && echo "zend_extension=/usr/local/lib/php/extensions/no-debug-non-zts-20131226/xdebug.so" > /usr/local/etc/php/conf.d/xdebug.ini
      - script:
          name: create report dir
          code: mkdir ./report
      - script:
          name: Run unit tests
          code: php -d memory_limit=1024M vendor/phpunit/phpunit/phpunit --debug --verbose # --coverage-clover /tmp/clover.xml
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
      - script:
          name: Upload coverage to codacy
          code: vendor/bin/codacycoverage clover /tmp/clover.xml

deploy:
    steps:
      - script:
          name: Change to production mode
          code: sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      - script:
          name: Install linux packages
          code: apt-get update && apt-get install -y python-pip
      - script:
          name: Install aws cli
          code: pip install awscli
      - nhuray/aws-code-deploy:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: Api
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-codedeploy
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
