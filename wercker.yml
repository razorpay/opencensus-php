box: pronav/node

build:
    steps:
      - npm-install

      - script:
          name: Build
          code: |
            npm run build
            npm run squash
            mkdir -p /tmp/generated
            mv scripts/s3sync.js /tmp
            cp -r public/dist /tmp/generated
            rm -rf {,.[!.],..?}*
            mkdir dashboard
            mv /tmp/generated/dist dashboard/
            mv /tmp/s3sync.js ./

      - script:
          name: Gzip
          code: node /scripts/gzip.js

deploy:
    steps:
      - script:
          name: S3 Sync
          code: mv s3sync.js /scripts && node /scripts/s3sync.js
      - script:
          name: Cloudfront cache invalidate
          code: AWS_ACCESS_KEY=$AWS_KEY AWS_ACCESS_SECRET=$AWS_SECRET node /scripts/invalidate.js

    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
