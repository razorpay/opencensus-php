box: pronav/node

build:
    steps:
      - npm-install

      - script:
          name: Build
          code: |
            NODE_ENV=prod npm run build
            mkdir -p /tmp/generated
            cp -r public/dist /tmp/generated
            rm -rf {,.[!.],..?}*
            mkdir dashboard
            mv /tmp/generated/dist ./dashboard/

      - script:
          name: Gzip
          code: node /scripts/gzip.js

deploy:
    steps:
      - script:
          name: S3 Sync
          code: AWS_ACCESS_KEY=$AWS_KEY AWS_ACCESS_SECRET=$AWS_SECRET AWS_S3_BUCKET=$AWS_CDN_BUCKET node /scripts/s3sync.js

    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
