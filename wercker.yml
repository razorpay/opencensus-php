box: wercker/php
services:
    - wercker/mysql
build:
    steps:
      - install-packages:
          packages: lsof
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: Enable virtual display
          code: |-
                # Start xvfb which gives the context a virtual display
                # which is required for tests that require an GUI
                export DISPLAY=:99.0
                start-stop-daemon --start --quiet --pidfile /tmp/xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset
                # Give xvfb time to start. 3 seconds is the default for all xvfb-run commands.
                sleep 3
      - script:
          name: copy wercker config
          code:  cp .env.wercker.php .env.testing.php
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - wercker/npm-install@0.9.3
      - script:
          name: Create grunt config and set environment
          code: cp app/config/grunt.sample.json app/config/grunt.json && sed -i "2s/development/production/" app/config/grunt.json
      - grunt:
          tasks: default
      - desmondmorris/selenium-install@0.0.2
      - script:
          name: run unit tests
          code: phpunit --stop-on-error --stop-on-failure
    after-steps:
      - williamli/slack-notify-no-owner-info:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: tech
      - script:
          name: copy screenshot
          code: cp app/storage/selenium.png $WERCKER_REPORT_ARTIFACTS_DIR/selenium.png
deploy:
    steps:
      - script:
          name: Change to production mode
          code: sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      - nhuray/aws-code-deploy:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: Dashboard
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-codedeploy
    after-steps:
      - williamli/slack-notify-no-owner-info:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: tech
      - akelmanson/rollbar-notify:
          access-token: $ROLLBAR_ACCESS_TOKEN
          environment: $WERCKER_DEPLOYTARGET_NAME
