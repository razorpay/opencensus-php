box: pronav/dash

build:
    services:
      - redis
    steps:
      - script:
          name: copy env file
          code: cp ./environment/.env.wercker ./environment/.env.testing

      - script:
          name: Export wercker Redis env var to Dashboard environment variables
          code: >
              export REDIS_HOST="$REDIS_PORT_6379_TCP_ADDR"
              export REDIS_PORT="6379"

      - add-ssh-key:
          keyname: RZP_API

      - script:
          name: install dependencies
          code: |
              composer config -g github-oauth.github.com $github_token
              export COMPOSER_CACHE_DIR="$WERCKER_CACHE_DIR/composer" && mkdir -p $COMPOSER_CACHE_DIR
              composer install --no-interaction

      - script:
          name: clear cache
          code: php artisan cache:clear; php artisan clear-compiled

      - script:
          name: node version
          code: node -v

      - script:
          name: npm install
          code: npm i --unsafe-perm

      - script:
          name: build
          code: npm run build

      - script:
          name: Run artisan migrate
          code: APP_ENV=testing php artisan migrate --env=testing

      # - script:
      #     name: run unit tests
      #     code: phpunit --stop-on-error --stop-on-failure --debug

    after-steps:
      - script:
          name: copy screenshot
          # We want this step to not fail even if the file is missing
          code: cp storage/screenshots/* $WERCKER_REPORT_ARTIFACTS_DIR/. || true
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
      - script:
          name: change storage permissions
          code: sudo chmod g+wx -R storage/ || true
      - script:
          name: copy trace logs
          code: cp storage/logs/trace.log $WERCKER_REPORT_ARTIFACTS_DIR/. || true
      - script:
          name: copy trace logs
          code: cp storage/logs/laravel*.log $WERCKER_REPORT_ARTIFACTS_DIR/. || true
      - script:
          name: create commit.txt
          code: git rev-parse HEAD > public/commit.txt
      - script:
          name: remove heavy directories
          code: rm --recursive --force .git web/node_modules
      - script:
          name: copy artisan server logs
          code: cp /tmp/rzp-dbd* $WERCKER_REPORT_ARTIFACTS_DIR/
deploy:
    steps:
      - script:
          name: check currently deployed commit
          code: |
            curl --fail --remote-name "$APP_EXTERNAL_URL/commit.txt" && \
            if [[ -z "`cat commit.txt | xargs -L 2 git diff --name-only | grep -v '^web/'`" ]]; then
               export SKIP_CODEDEPLOY=true
            fi
      - script:
          name: check vendor dir exists
          code: if [ ! -d vendor ] ; then exit 1 ; fi;
      - script:
          name: check if dotfile rsyncignore exists
          code: if [ ! -f .rsyncignore ] ; then exit 1 ; fi;
      - script:
          name: S3 Sync
          code: ./s3sync.js
      - razorpay/aws-code-deploy@0.0.32:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: dashboard
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-code-deploy
          skip: $SKIP_CODEDEPLOY

    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
