box: wercker/php
services:
    - wercker/mysql
build:
    # The steps that will be executed on build
    steps:
      # A custom script step, name value is used in the UI
      # and the code value contains the command that get executed
      - script:
          name: copy env file
          code: cp .env.wercker.php .env.testing.php
      - script:
          name: set composer to use github oauth token
          code: composer config -g github-oauth.github.com $github_token
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - script:
          name: create report dir
          code: mkdir ./report
      - script:
          name: Activate PHP 5.5
          code: phpenv global 5.5
      - script:
          name: Run unit tests
          code: phpunit --debug --verbose --coverage-clover /tmp/clover.xml
      - script:
          name: Upload coverage to codacy
          code: vendor/bin/codacycoverage clover /tmp/clover.xml
    after-steps:
      - script:
          name: Download apigen
          cwd: $WERCKER_ROOT
          code: curl -L https://github.com/ApiGen/ApiGen/releases/download/v4.1.0/apigen-4.1.0.phar -o apigen && chmod +x apigen
      - script:
          name: Generate docs
          code: ./apigen generate -d ./docs
      - script:
          name: Archive docs
          # This is on the old stack
          code: (cd ./docs && tar zcvf /tmp/docs.tar.gz .)
      - script:
          name: Upload docs
          code: >
              curl -F "coverage=@/tmp/docs.tar.gz"
              https://cc.razorpay.com/api/upload/?token=$COVERAGE_TOKEN
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
deploy:
    steps:
      - script:
          name: Change to production mode
          code: sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      - nhuray/aws-code-deploy:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: Api
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-codedeploy
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
