box: razorpay/docker:latest
dev:
  steps:
    - internal/shell:
      code: echo "Welcome to Razorpay\\Api"
build:
    services:
      - id: mysql
        tag: latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: root
          MYSQL_ROOT_PASSWORD: root
    # The steps that will be executed on build
    steps:
      - script:
          name: copy env file
          code: cp .env.wercker.php .env.testing.php
      - script:
          name: copy environment.php
          code: cp ./bootstrap/sample.environment.php ./bootstrap/environment.php
      - script:
          name: set environment.php 'env' -> 'testing'
          code: sed -i 's/dev/testing/g' ./bootstrap/environment.php
      - script:
          name: set composer to use github oauth token
          code: composer config -g github-oauth.github.com $github_token
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: enable composer cache
          code: export COMPOSER_CACHE_DIR="$WERCKER_CACHE_DIR/composer" && mkdir -p $COMPOSER_CACHE_DIR
      - create-file:
          name: Create api_sqlite.db
          filename: api_sqlite.db
          overwrite: true
          content:
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - script:
          name: Run unit tests
          code: php -d memory_limit=1024M vendor/phpunit/phpunit/phpunit --debug --verbose
      - script:
          name: List directory
          code: ls -lah
      - script:
          name: Copy entire data to wercker-output-directory
          code: ls -lah && cp -vr . $WERCKER_OUTPUT_DIR/
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel:  tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg

deploy:
    steps:
      - script:
          name: Change to production mode
          code: sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      - script:
          name: Run composer
          code: composer config -g github-oauth.github.com $github_token
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - script:
          name: List directory
          code: ls -lah
      - script:
          name: check vendor dir exists
          code: if [ ! -d vendor ] ; then exit 1 ; fi;
      - script:
          name: check if dotfile rsyncignore exists
          code: if [ ! -f .rsyncignore ] ; then exit 1 ; fi;
      - nhuray/aws-code-deploy:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: Api
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-codedeploy
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
