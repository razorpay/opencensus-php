box: wercker/php
services:
    - wercker/mysql
build:
    # The steps that will be executed on build
    steps:
      # A custom script step, name value is used in the UI
      # and the code value contains the command that get executed
      - script:
          name: copy db config
          code:  cp app/config/testing/database.php.wercker app/config/testing/database.php 
      - script:
          name: copy HDFC config
          code: cp app/gateway/hdfc/HdfcGatewayConfig.php.wercker app/gateway/hdfc/HdfcGatewayConfig.php
      - script:
          name: set composer to use github oauth token
          code: composer config -g github-oauth.github.com $github_token
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - script:
          name: run unit tests
          code: phpunit
      - script:
          name: copy output for deployment
          code: |-
            rsync -avz --exclude '.git' "$WERCKER_SOURCE_DIR/" "$WERCKER_OUTPUT_DIR"
    after-steps:
        - sherzberg/slack-notify:
            subdomain: razorpay
            token: $SLACK_TOKEN
            channel: general
deploy:
    steps:
      - add-to-known_hosts:
          hostname: api.razorpay.com
      - script:
          name: Create lease on AWS
          code: wget https://ac.razorpay.com/invite/$concierge_token
      - create-file:
          name: write key
          filename: /tmp/privatekey_rzp.pem
          content: $AWS_deploykey
          overwrite: true
          hide-from-log: true
      - script:
          name: set private key permissions
          code: chmod 600 /tmp/privatekey_rzp.pem
      - script:
          name: Put application in maintenance mode
          code: ssh -i /tmp/privatekey_rzp.pem -l ubuntu -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no api.razorpay.com "(cd ~/api/ && php artisan down)"
      - script:
          name: copy with rsync over ssh
          code: rsync -avz --force --delete --progress --exclude-from=.gitignore "ssh -i /tmp/privatekey_rzp.pem -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" $WERCKER_OUTPUT_DIR/ ubuntu@api.razorpay.com:/home/ubuntu/api/
      - script:
          name: Install dependencies
          code: ssh -i /tmp/privatekey_rzp.pem -l ubuntu -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no api.razorpay.com "(cd ~/api/ && php composer.phar install --no-interaction)"
      - script:
          name: Perform DB migrations
          code: ssh -i /tmp/privatekey_rzp.pem -l ubuntu -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no api.razorpay.com "(cd ~/api/ && php artisan migrate)"
      - script:
          name: start application
          code: ssh -i /tmp/privatekey_rzp.pem -l ubuntu -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no api.razorpay.com "(cd ~/api/ && php artisan up)"
    after-steps:
      - sherzberg/slack-notify:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: general
