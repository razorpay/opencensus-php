box:
  id: razorpay/containers:php7
  username: $DOCKERHUB_USER
  password: $DOCKERHUB_PASSWORD
dev:
  steps:
    - internal/shell:
      code: echo "Welcome to Razorpay\\Api"
build:
    services:
      - id: mysql
        tag: latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: root
      - redis
      - elasticsearch
    # The steps that will be executed on build
    steps:
      - script:
          name: ENV Variables
          code: env
      - script:
          name: copy env file
          code: cp ./environment/.env.wercker ./environment/.env.testing
      - add-ssh-key:
          keyname: RZP_API
      - create-file:
          name: Create api_sqlite.db
          filename: api_sqlite.db
          overwrite: true
          content:
      - script:
          name: Export ES env var to API environment variables
          code: >
              export ES_HOST="$ELASTICSEARCH_PORT_9200_TCP_ADDR"
              export ES_AUDIT_HOST="$ELASTICSEARCH_PORT_9200_TCP_ADDR"
      - script:
          name: Export wercker DB env var to API environment variables
          code: >
              export DB_TEST_HOST="$MYSQL_PORT_3306_TCP_ADDR"
              export DB_TEST_PORT="$MYSQL_PORT_3306_TCP_PORT"
              export DB_AUTH_HOST="$MYSQL_PORT_3306_TCP_ADDR"
              export DB_AUTH_PORT="$MYSQL_PORT_3306_TCP_PORT"
      - script:
          name: Export wercker Redis env var to API environment variables
          code: >
              export REDIS_HOST="$REDIS_PORT_6379_TCP_ADDR"
              export REDIS_PORT="6379"
      - create-file:
          name: Create assertion.ini
          filename: /etc/php7/conf.d/assertion.ini
          overwrite: true
          content: |
              zend.assertions=1
              assert.exception=On
      - script:
          name: Copy nanotime extension
          code: cp scripts/nanotime.* /usr/lib/php7/modules
      - create-file:
          name: Enable nanotime extension
          filename: /etc/php7/conf.d/nanotime.ini
          overwrite: true
          content: |
              extension=nanotime.so
      - script:
          name: List PHP extensions
          code: php -m
      - script:
          name: Composer set-up
          code: |
              composer config -g github-oauth.github.com $github_token
              export COMPOSER_CACHE_DIR="$WERCKER_CACHE_DIR/composer" && mkdir -p $COMPOSER_CACHE_DIR
              composer install --no-interaction
      - script:
          name: Create certificate directories
          code: |
              mkdir -p /opt/razorpay/certs/first_data
      - script:
          name: Run unit tests
          code: php -d memory_limit=512M vendor/phpunit/phpunit/phpunit --debug --verbose
      - script:
          name: List directory
          code: ls -lah
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel:  tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
dockerhub-push:
    box:
      id: razorpay/containers:base-php7
      username: $DOCKERHUB_USER
      password: $DOCKERHUB_PASSWORD
      cmd: /bin/bash
    steps:
      - script:
          name:  Copy app directory
          code: |
            cp -Rp $WERCKER_SOURCE_DIR/* /app/
      - script:
          name: Fix permissions
          code: |
            chown -R apache.www-data /app
      - script:
          name: Configure mpm and httpd
          code: |
            sed -i 's#PidFile "/run/.*#Pidfile /tmp/run/httpd.pid"#g' /etc/apache2/conf.d/mpm.conf && \
            sed -i 's/#LoadModule rewrite_module*/LoadModule rewrite_module/' /etc/apache2/httpd.conf
      - script:
          name: Copy entrypoint script
          code: |
            cp /app/dockerconf/entrypoint.sh /app/entrypoint.sh
      - internal/docker-push:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASSWORD
          repository: razorpay/api
          entrypoint: /app/entrypoint.sh
          ports: 80/tcp
          working-dir: /app/
          tag: ${WERCKER_GIT_BRANCH}-${WERCKER_GIT_COMMIT}
      - script:
          name: Docker Image tag
          code: |
            echo "[INFO] Tag for created image:"
            echo "${WERCKER_GIT_BRANCH}-${WERCKER_GIT_COMMIT}"
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
deploy:
    steps:
      - script:
          name: Check if branch is master on prod-api
          code: |
            if [ "$APP_ENV" == "prod" ]; then
              if [ "$WERCKER_GIT_BRANCH" != "master" ]; then
                echo "[ERROR] Cannot deploy a non-master branch to prod"
                exit $?
              fi
            fi
      - script:
          name: List directory
          code: ls -lah
      - script:
          name: check vendor dir exists
          code: if [ ! -d vendor ] ; then exit 1 ; fi;
      - script:
          name: check if dotfile rsyncignore exists
          code: if [ ! -f .rsyncignore ] ; then exit 1 ; fi;
      - script:
          name: create commit.txt
          code: git rev-parse HEAD > public/commit.txt
      - script:
          name: Conditionally skip canary deployment
          code: |
            if [ "$APP_ENV" != "beta" ] && [ "$APP_ENV" != "prod" ]; then
              export SKIP_CANARY=true
            fi
      - razorpay/aws-code-deploy@0.0.32:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: api
          deployment-group-name: $APP_ENV-api-canary
          s3-bucket: rzp-code-deploy
          skip: $SKIP_CANARY
      - razorpay/aws-code-deploy@0.0.32:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: api
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-code-deploy
      - script:
          name: Conditionally skip newrelic deployment marker
          code: |
            if [ "$APP_ENV" == "prod" ]; then
              SKIP_NR=false
            fi
      - hashfyre/newrelic-deployment:
          api_key: $NEWRELIC_API_KEY
          app_name: "$APP_ENV-$APP_NAME"
          skip: $SKIP_NR
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
      - script:
         name: post_deploy_notifier
         code: |
            python scripts/post_deploy_notifier.py
deploy-canary:
    steps:
      - script:
          name: Check if canary branch is up-to-date on prod-api-canary
          code: |
            MASTER=$(git rev-parse master)
            if [ "$APP_ENV" == "prod" ] && [ "$CANARY" == "true" ]; then
              if [ "$WERCKER_GIT_BRANCH" != "canary" ]; then
                echo "[ERROR] Cannot deploy a non-canary branch to prod-canary instance"
                exit $?
              fi
              if [ ! -n $(git rev-list HEAD | grep $MASTER) ]; then
                echo "[ERROR] Cannot deploy outdated branch to prod-canary"
                exit $?
              fi
            fi
      - script:
          name: List directory
          code: ls -lah
      - script:
          name: check vendor dir exists
          code: if [ ! -d vendor ] ; then exit 1 ; fi;
      - script:
          name: check if dotfile rsyncignore exists
          code: if [ ! -f .rsyncignore ] ; then exit 1 ; fi;
      - script:
          name: create commit.txt
          code: git rev-parse HEAD > public/commit.txt
      - razorpay/aws-code-deploy@0.0.25:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: api
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-code-deploy
      - script:
          name: Conditionally skip newrelic deployment marker
          code: |
            if [ "$APP_ENV" == "prod" ]; then
              SKIP_NR=false
            fi
      - hashfyre/newrelic-deployment:
          api_key: $NEWRELIC_API_KEY
          app_name: "$APP_ENV-$APP_NAME"
          skip: $SKIP_NR
    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
      - script:
         name: post_deploy_notifier
         code: |
            python scripts/post_deploy_notifier.py
