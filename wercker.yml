box: wercker/php
services:
    - wercker/mysql
build:
    # The steps that will be executed on build
    steps:
      # A custom script step, name value is used in the UI
      # and the code value contains the command that get executed
      - script:
          name: copy env file
          code: cp .env.wercker.php .env.testing.php
      - script:
          name: set composer to use github oauth token
          code: composer config -g github-oauth.github.com $github_token
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - script:
          name: create report dir
          code: mkdir ./report
      - script:
          name: Activate PHP 5.5
          code: phpenv global 5.5
      - script:
          name: run unit tests
          code: phpunit --debug --verbose --coverage-html ./report
      - script:
          name: Generate coverage zip for upload
          code: (cd ./report && tar zcvf /tmp/$WERCKER_GIT_BRANCH.tar.gz .)
      - script:
          name: Upload Coverage to cc.razorpay.com
          code: curl -F "coverage=@/tmp/$WERCKER_GIT_BRANCH.tar.gz" https://cc.razorpay.com/$WERCKER_GIT_REPOSITORY/upload/?token=$COVERAGE_TOKEN
    after-steps:
      - williamli/slack-notify-no-owner-info:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: general
deploy:
    steps:
      - script:
          name: Change to production mode
          code: sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      - nhuray/aws-code-deploy:
          key: $AWS_KEY
          secret: $AWS_SECRET
          region: $AWS_REGION
          application-name: Api
          deployment-group-name: $WERCKER_DEPLOYTARGET_NAME
          s3-bucket: rzp-codedeploy
    after-steps:
      - williamli/slack-notify-no-owner-info:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: general
