box: wercker/php
services:
    - wercker/mysql
build:
    steps:
      - add-ssh-key:
          keyname: RZP_API
      - script:
          name: Enable virtual display
          code: |-
                # Start xvfb which gives the context an virtual display
                # which is required for tests that require an GUI
                export DISPLAY=:99.0
                start-stop-daemon --start --quiet --pidfile /tmp/xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset
                # Give xvfb time to start. 3 seconds is the default for all xvfb-run commands.
                sleep 3
      - script:
          name: copy wercker config
          code:  cp .env.wercker.php .env.testing.php
      - script:
          name: install dependencies
          code: composer install --no-interaction
      - wercker/npm-install@0.9.3
      - script:
          name: Create grunt config and set environment
          code: cp app/config/grunt.sample.json app/config/grunt.json && sed -i "2s/development/production/" app/config/grunt.json
      - grunt:
          tasks: default
      - desmondmorris/selenium-install@0.0.2
      - script:
          name: run unit tests
          code: phpunit --stop-on-error --stop-on-failure
    after-steps:
      - williamli/slack-notify-no-owner-info:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: general
      - script: 
          name: copy screenshot
          code: cp app/storage/selenium.png $WERCKER_REPORT_ARTIFACTS_DIR/selenium.png
deploy:
    steps:
      - script:
          name: Change to production mode
          code: sed -i "/'debug'/c\ 'debug' => false," app/config/app.php
      - script:
          name: Create lease on AWS
          code: wget -O /dev/null https://ac.razorpay.com/invite/$concierge_token --quiet
      - add-to-known_hosts:
          hostname: dashboard.razorpay.com
      - mktemp:
          envvar: PRIVATEKEY_PATH
      - create-file:
          name: write key
          filename: $PRIVATEKEY_PATH
          content: $AWS_deploykey
          overwrite: true
          hide-from-log: true
      - script:
          name: Put application in maintenance mode
          code: >
                ssh -i $PRIVATEKEY_PATH -l ubuntu -o UserKnownHostsFile=/dev/null
                -o StrictHostKeyChecking=no dashboard.razorpay.com
                "(cd ~/dashboard/ && php artisan down)"
      - script:
          name: copy with rsync over ssh
          code: >
                rsync -avz --force --delete --progress
                --exclude-from=.rsyncignore
                -e "ssh -i $PRIVATEKEY_PATH -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
                ./ ubuntu@dashboard.razorpay.com:/home/ubuntu/dashboard/
      - script:
          name: Perform DB migrations
          code: >
                ssh -i $PRIVATEKEY_PATH -l ubuntu -o UserKnownHostsFile=/dev/null
                -o StrictHostKeyChecking=no dashboard.razorpay.com
                "(cd ~/dashboard/ && php artisan migrate)"
      - script:
          name: start application
          code: >
                ssh -i $PRIVATEKEY_PATH -l ubuntu -o UserKnownHostsFile=/dev/null
                -o StrictHostKeyChecking=no dashboard.razorpay.com
                "(cd ~/dashboard/ && php artisan up)"
    after-steps:
      - williamli/slack-notify-no-owner-info:
          subdomain: razorpay
          token: $SLACK_TOKEN
          channel: general
