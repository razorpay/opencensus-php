box: pronav/node

build:
    steps:
      - script:
          name: Packages Install
          code: cd web && npm i

      - script:
          name: Build
          code: |
            cd web
            npm run build
            cd ..
            mkdir -p /tmp/generated
            mv scripts/s3sync.js /tmp
            cp -r public/dist /tmp/generated
            rm -rf {,.[!.],..?}*
            mkdir dashboard
            mv /tmp/generated/dist dashboard/
            mv /tmp/s3sync.js ./

deploy:
    steps:
      - script:
          name: S3 Sync
          code: mv s3sync.js /scripts && /scripts/s3sync.js

    after-steps:
      - slack-notifier:
          url: $SLACK_URL
          channel: tech_bots
          username: wercker
          icon_url: https://cdn.rawgit.com/wantedly/step-pretty-slack-notify/master/icons/$WERCKER_RESULT.jpg
