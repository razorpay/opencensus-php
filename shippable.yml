build_environment: Ubuntu 14.04
language: php

php:
   - 5.5

env:
  - secure: 
  - secure: 
install:
  - sudo apt-get install php5-mcrypt
  - cp app/config/testing/database.sample.php app/config/testing/database.php 
  - cp app/gateway/hdfc/HdfcGatewayConfig.php.sample app/gateway/hdfc/HdfcGatewayConfig.php
  - mysql -e 'create database `apitesting`;'

before_script:
  - mkdir -p shippable/testresults
  - sudo apt-get install php5-mcrypt
  - php composer.phar install
  - php composer.phar dump-autoload

script:
  - phpunit --log-junit shippable/testresults/junit.xml 

notifications:
   email: false