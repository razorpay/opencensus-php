    <style>
      /* Loading the self Hosted fonts */
      /* lato-regular - latin */
      @font-face {
        font-family: 'Lato';
        font-style: normal;
        font-weight: 400;
        src: local(''),
          url('<%= process.env.UNIVERSE_PUBLIC_RESOURCE_PATH %>static/fonts/lato-v22-latin-regular.woff2')
            format('woff2'),
          /* Chrome 26+, Opera 23+, Firefox 39+ */
            url('<%= process.env.UNIVERSE_PUBLIC_RESOURCE_PATH %>static/fonts/lato-v22-latin-regular.woff')
            format('woff');
        /* Chrome 6+, Firefox 3.6+, IE 9+, Safari 5.1+ */
      }

      /* lato-700 - latin */
      @font-face {
        font-family: 'Lato';
        font-style: normal;
        font-weight: 700;
        src: local(''),
          url('<%= process.env.UNIVERSE_PUBLIC_RESOURCE_PATH %>static/fonts/lato-v22-latin-700.woff2')
            format('woff2'),
          /* Chrome 26+, Opera 23+, Firefox 39+ */
            url('<%= process.env.UNIVERSE_PUBLIC_RESOURCE_PATH %>static/fonts/lato-v22-latin-700.woff')
            format('woff');
        /* Chrome 6+, Firefox 3.6+, IE 9+, Safari 5.1+ */
      }

      .grecaptcha-badge {
        visibility: hidden;
      }

      @keyframes blinker {
        from {
          opacity: 1;
          height: 100px;
        }

        to {
          opacity: 0;
          height: 50px;
        }
      }

      .blink {
        animation: blinker 1.2s ease-in-out infinite alternate;
      }

      body {
        margin: 0;
      }

      .animation-container {
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('<%= process.env.UNIVERSE_PUBLIC_RESOURCE_PATH %>static/logos/vector.svg');
        background-size: auto;
        background-repeat: repeat-x;
        background-color: #0a1d38;
        height: 100vh;
      }
      @media only screen and (min-width: 768px) {
        .animation-container {
          background-image: url('<%= process.env.UNIVERSE_PUBLIC_RESOURCE_PATH %>static/logos/dweb-botton-vector.svg');
          background-position: bottom;
        }
      }
      .copyright {
        position: fixed;
        bottom: 48px;
        right: 48px;
        display: block;
        width: 200px;
      }
      @media only screen and (max-width: 768px) {
        .copyright {
          display: none;
        }
      }
      .copyright-text {
        font-size: 12px;
        font-family: Lato, sans-serif;
        font-weight: 400;
        line-height: 16px;
        color: #5ca2f7;
      }
      .copyright-link {
        color: #5ca2f7;
        text-decoration-color: #213554ab;
      }
      a:hover {
        color: #fff;
      }

      .sw-iframe {
        border: none;
        visibility: hidden;
        width: 1px;
        height: 1px;
        pointer-events: none;
        position: fixed;
        bottom: 0;
      }
    </style>
    <% if(process.env.UNIVERSE_PUBLIC_ENV=='production' ) { %>
    <!-- Hotjar Tracking Code for https://easy.razorpay.com -->
    <script>
      (function (h, o, t, j, a, r) {
        h.hj =
          h.hj ||
          function () {
            (h.hj.q = h.hj.q || []).push(arguments);
          };
        h._hjSettings = { hjid: 575141, hjsv: 5 };
        a = o.getElementsByTagName('head')[0];
        r = o.createElement('script');
        r.async = 1;
        r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;
        a.appendChild(r);
      })(window, document, 'https://static.hotjar.com/c/hotjar-', '.js?sv=');
    </script>
    <% } %>

  <body>

  <% } %> <% if(process.env.UNIVERSE_PUBLIC_ENV=='production' ) { %>
