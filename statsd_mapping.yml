  # [10s, 30s, 45s, 1m, 2m, 3m, 5m, 10m, 20m, 30m, 45m, 1h, 1.5h, 2h, 3h, 6h, 9h, 12h, 15h, 18h, 1d, 1.5d, 2d, 3d, 4d, 5d]
