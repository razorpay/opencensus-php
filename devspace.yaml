version: v1beta10
dev:
  sync:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./app
      containerPath: /app/app
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./public/dist
      containerPath: /app/public/dist
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
      uploadExcludePaths:
        - node_modules/
  logs:
    showLast: 200
    sync: true
    selectors:
      - labelSelector:
          name: ${APP_NAME}-${DEVSTACK_LABEL}
vars:
  - name: DEVSTACK_LABEL
    value: 'easytest22'
  - name: NAMESPACE
    value: 'dashboard'
  - name: APP_NAME
    value: 'dashboard'
