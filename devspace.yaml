version: v1beta10
dev:
  sync:
    - labelSelector:
        name: api-web-varun-agarwal
      localSubPath: ./app
      containerPath: /app/app
      namespace: api
      disableDownload: true
      initialSync: preferLocal
  logs:
    showLast: 200
    sync: true
    selectors:
      - labelSelector:
          name: api-web-varun-agarwal
vars:
  - name: DEVSTACK_LABEL
    value: "varun-agarwal"
  - name: NAMESPACE
    value: "api"
  - name: APP_NAME
    value: "api-web"
