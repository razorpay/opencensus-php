version: v1beta10
dev:
  replacePods:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      replaceImage: c.rzp.io/razorpay/api:devstackxdebug3
      namespace: ${NAMESPACE}
      patches:
        - op: replace
          path: spec.containers[0].imagePullPolicy
          value: Always
  ports:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      namespace: ${NAMESPACE}
      reverseForward:
        - port: 9000
          remotePort: 9000
  sync:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./app
      containerPath: /app/app
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
  logs:
    showLast: 200
    sync: true
    selectors:
      - labelSelector:
          name: ${APP_NAME}-${DEVSTACK_LABEL}
vars:
  - name: DEVSTACK_LABEL
    value: "animesh"
  - name: NAMESPACE
    value: "api"
  - name: APP_NAME
    value: "api-web"
