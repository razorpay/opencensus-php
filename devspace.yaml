version: v1beta10
dev:
#  Changing the probe period seconds for ensuring devspace brings up a new pod for syncing the code changes irrespective of number of pods running previously https://www.devspace.sh/docs/5.x/configuration/development/replace-pods#how-does-it-work
  replacePods:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      namespace: ${NAMESPACE}
      patches:
        - op: replace
          path: spec.containers[0].livenessProbe.periodSeconds
          value: 65
  sync:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./app
      containerPath: /app/app
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./public/dist
      containerPath: /app/public/dist
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
      uploadExcludePaths:
        - node_modules/
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./resources
      containerPath: /app/resources
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
      uploadExcludePaths:
        - node_modules/
  logs:
    showLast: 200
    sync: true
    selectors:
      - labelSelector:
          name: ${APP_NAME}-${DEVSTACK_LABEL}
vars:
  - name: DEVSTACK_LABEL
    value: 'bluecoolant'
  - name: NAMESPACE
    value: 'dashboard'
  - name: APP_NAME
    value: 'dashboard'
