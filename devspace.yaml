version: v1beta10
dev:
# Changing the imagepullpolicy for ensuring devspace brings up a new pod for syncing the code changes irrespective of number of pods running previously
  replacePods:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      namespace: ${NAMESPACE}
      patches:
        - op: replace
          path: spec.containers[0].imagePullPolicy
          value: Always
        - op: replace
          path: spec.containers[0].resources.requests.cpu
          value: 500m
# uncomment only to use remote debugging
  #    replaceImage: c.rzp.io/razorpay/api:devstackxdebug3
  # ports:
  #   - labelSelector:
  #       name: ${APP_NAME}-${DEVSTACK_LABEL}
  #     namespace: ${NAMESPACE}
  #     reverseForward:
  #       - port: 9008
  #         remotePort: 9000
  sync:
    - labelSelector:
        name: ${APP_NAME}-${DEVSTACK_LABEL}
      localSubPath: ./app
      containerPath: /app/app
      namespace: ${NAMESPACE}
      disableDownload: true
      initialSync: preferLocal
    # - labelSelector:
    #     name: ${APP_NAME}-${DEVSTACK_LABEL}
    #   localSubPath: ./resources
    #   containerPath: /app/resources
    #   namespace: ${NAMESPACE}
    #   disableDownload: true
    #   initialSync: preferLocal
  logs:
    showLast: 200
    sync: true
    selectors:
      - labelSelector:
          name: ${APP_NAME}-${DEVSTACK_LABEL}
vars:
  # Note: now you can choose to export DEVSTACK_LABEL from your shell as well!
  - name: DEVSTACK_LABEL
    source: env
    default: "bt-payu"
  - name: NAMESPACE
    value: "api"
  - name: APP_NAME
    value: "api-web"
    # value: "api-sqs-main" # use this value to sync code to sqs pod
