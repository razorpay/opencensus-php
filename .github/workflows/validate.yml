name: Validate
on: push
jobs:
  validate:
    runs-on: [self-hosted]
    continue-on-error: false
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v2

      - name: Use Node v12
        uses: actions/setup-node@v1
        with:
          node-version: 12.13.0

      # This action allows caching dependencies and build outputs
      # to improve workflow execution time
      - name: Cache multiple paths
        uses: actions/cache@v2
        with:
          path: |
            ~/cache
            !~/cache/exclude
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Install Dependencies
        run: |
          npm config set unsafe-perm true
          npm ci # Automatically installs npm ci in web too
        env:
          NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}

      - name: Validate
        # Automatically installs npm ci in web too
        run: |
          MODULES=$MODULES npm run lint
          npm run style-lint
          cd web && npx tsc
        env:
          NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          MODULES: web/v2 web/js/merchant/views/Settlements web/js/merchant/views/Transactions
