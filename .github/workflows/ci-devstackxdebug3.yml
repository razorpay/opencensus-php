name: CI-devstack

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on: [ workflow_dispatch ]

jobs:
  build-docker-image:
    runs-on:
      - api-public
      - X64
    continue-on-error: false
    name: Build Devstack xdebug3 Web Harbor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      - name: build
        uses: docker/build-push-action@v2
        with:
          context: .
          tags: c.rzp.io/razorpay/api:devstackxdebug3
          push: true
          file: ./Dockerfile.devstackxdebug3
          build-args: |
            GIT_COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            GIT_USERNAME=rzp
            CACHEBUST=${{ github.event.pull_request.head.sha || github.sha }}
            API_BASE_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:php-8.1-api-web-v2
            CURL_CLI_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:curl-7.82
            OPENCENSUS_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:php-8.1-opencensus
          secrets: |
            git_token=${{ secrets.GIT_TOKEN }}
