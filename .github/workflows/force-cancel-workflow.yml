name: Force Cancel Workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID'
        required: true
        type: string

jobs:
  force-cancel:
    runs-on: [non-api-premium]
    steps:
      - name: Trigger Force Cancel
        env:
          RUN_ID: ${{ inputs.run_id }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ACCESS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/razorpay/dashboard/actions/runs/$RUN_ID/force-cancel
