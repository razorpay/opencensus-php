name: PR validate UT and Roast Workflow

on:
  pull_request:
    types: [opened, synchronize,reopened]

jobs:
  # Add cancel job
  cancel:
    name: Cancel Previous Runs
    if: always()
    runs-on: [self-hosted]
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@0.9.0
        with:
          workflow_id: "pr_workflow.yaml"
          access_token: ${{ github.token }}
  pull_request:
    runs-on: [self-hosted]
    steps:
    - name: checkout
      uses: razorpay/checkout-action@08eef2bd6ada50786812e7351457a762856a532f
    # Trigger back-merge master if any commit pushed in an approved PR and branch isn't hotfix
    - name: backmerge-master
    # Get the Label from label list and check if approved label applied on the PR
      if: contains(github.event.pull_request.labels.*.name, 'approved') && !contains(github.event.pull_request.head.ref, 'hotfix') && !contains(github.event.pull_request.head.ref, 'revert-')
      id: backmerge
      uses: devmasx/merge-branch@a1752b9ba42bb417ec19be7dc974e2faf77d3ef2
      with:
        type: now
        from_branch: ${{ github.event.pull_request.base.ref }}
        target_branch: ${{ github.event.pull_request.head.ref }}
        github_token: ${{ secrets.CI_BOT_TOKEN }}
    - if: contains(github.event.pull_request.head.ref, 'hotfix')
      name: Set flag
      id: hotfix
      run: echo "::set-output name=flag::true"
    - if: contains(github.event.pull_request.head.ref, 'revert-')
      name: Set flag
      id: revert
      run: echo "::set-output name=flag::true"
      # Validate existence of Roast PR NUmber Field
    - name: Validate existence of roastPRNumber Field
      uses: actions/github-script@0.9.0
      id: roast-pr-number
      with:
        result-encoding: string
        script: |
          const regex = /roastprnumber.*/i;
          roastPRNumberFlag = regex.test(context.payload.pull_request.body.toLowerCase())
          return Boolean(roastPRNumberFlag)
      # Fetch PR Number for Roast mentioned in description
    - name: Fetch PR Number for Roast
      uses: actions/github-script@0.9.0
      if: ${{steps.roast-pr-number.outputs.result == 'true'}}
      id: roastPRNumber
      with:
        result-encoding: string
        script: |
          roastPRNumberStr = context.payload.pull_request.body.toLowerCase()
          var roastPRNumberValue = (roastPRNumberStr.substring(roastPRNumberStr.indexOf("roastprnumber"))).split("\n")
          var prNumber = roastPRNumberValue[0].substring(16)
          return prNumber
      # Fetch SkipRoastByDev mentioned in description
    - name: Fetch SkipRoastbyDev
      uses: actions/github-script@0.9.0
      id: skipRoastByDev
      with:
        result-encoding: string
        script: |
          skipRoastByDevStr = context.payload.pull_request.body.toLowerCase()
          var skipRoastByDevValueRow = (skipRoastByDevStr.substring(skipRoastByDevStr.indexOf("skiproastbydev"))).split("\n")
          var skipRoastByDevValue = skipRoastByDevValueRow[0].split("|")
          var skipRoastByDev = skipRoastByDevValue[1].split("-")
          var skipRoastByDevFlag = skipRoastByDev[0].trim()
          console.log(skipRoastByDevFlag)
          return skipRoastByDevFlag
    - name: Print PR Number
      run: echo ${{ steps.roastPRNumber.outputs.result }}
      # Get Roast PR State if its approved or not
    - name: Run Roast API PR flow if value is not null
      id: get_pr_state
      if: ${{steps.roastPRNumber.outputs.result != null }}
      uses: actions/github-script@v3.1.0
      with:
        result-encoding: string
        github-token: ${{ secrets.CI_BOT_TOKEN }}
        script: |
          pullnumber = parseInt(${{steps.roastPRNumber.outputs.result}})
          const result = await github.pulls.listReviews({
            owner: context.payload.repository.owner.login,
            repo: 'roast',
            pull_number: pullnumber,
            per_page: 100
          })
          const prState = result.data.filter(f => f.state.toLowerCase().includes("approved")).length > 0
          return Boolean(prState)
      # Get Target Branch for Roast Repo
    - name: Get Roast Branch for PR
      id: roast-branch
      if: |
        steps.roastPRNumber.outputs.result != null  && steps.get_pr_state.outputs.result == 'true'
      uses: actions/github-script@v2
      with:
        result-encoding: string
        github-token: ${{ secrets.CI_BOT_TOKEN }}
        script: |
          const response = await github.pulls.get({
            owner: context.payload.repository.owner.login,
            repo: 'roast',
            pull_number: ${{steps.roastPRNumber.outputs.result}},
          })
          const roastBranch = response.data.head.ref
          return String(roastBranch)
      # Rebase Master to a roast branch in Roast Repo
    - name: Rebase master to a branch
      id: rebase-branch
      if: |
        steps.roastPRNumber.outputs.result != null  && steps.get_pr_state.outputs.result == 'true'
      uses: linhbn123/rebase-pull-requests@v1.0.1
      with:
        repository: 'razorpay/roast'
        head: 'razorpay:${{ steps.roast-branch.outputs.result }}'
        base: 'master'
        token: ${{ secrets.CI_BOT_TOKEN }}
    - name: Comments
      if: ${{failure()}}
      uses: mshick/add-pr-comment@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        message: |
          **Conflict Error Please rebase manually**
          allow-repeats: true
      # Fetch the latest commit of the Roast Repo
    - name: Check For Only Ignore Files
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        echo "ONLY_IGNORE_FILES=$(sh ./.github/actions/checkIfPRHasOnlyIgnoreFiles.sh)" >> $GITHUB_ENV
    - name: Check Only Ignore Files
      run: echo $ONLY_IGNORE_FILES
    - name: Fetch latest Commit of the PR in Roast after rebase
      id: latest-commit
      if: |
        steps.roastPRNumber.outputs.result != null  && steps.get_pr_state.outputs.result == 'true'
      uses: actions/github-script@v3
      with:
        result-encoding: string
        github-token: ${{ secrets.CI_BOT_TOKEN }}
        script: |
          const response = await github.pulls.get({
            owner: context.payload.repository.owner.login,
            repo: 'roast',
            pull_number: ${{steps.roastPRNumber.outputs.result}},
            })
            const latestCommit = response.data.head.sha
            return String(latestCommit)
    - name: Get Build Image Workflow Status
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        WORKFLOW: build_images.yml
      run: |
        echo "WORKFLOW_STATUS=$(sh ./.github/actions/getWorkflowStatus.sh)" >> $GITHUB_ENV
    - name: Check Workflow Status
      run: echo $WORKFLOW_STATUS
    # Get the API Instance from Spinnaker
    - name: Get API Instance from Spinnaker
      env:
        GIT_TOKEN : ${{ secrets.CI_BOT_TOKEN }}
      id: script
      run: |
        echo "API_INSTANCE=$(sh ./.github/actions/getSpinnakerConfig.sh)" >> $GITHUB_ENV
    - name: Print Instance value
      run: echo $API_INSTANCE
    - name: Run bvt suite if PR approved && Build Image workflow succeeded
      if: startsWith(github.event.pull_request.head.ref,'beta_') != true
      env:
        SPINNAKER_PASSWORD: ${{ secrets.SPINNAKER_PASSWORD }}
        WEBHOOK_TRIGGER : api-spin-sleeve
        GITHUB_TOKEN: ${{ github.token }}
        HOTFIX: ${{ steps.hotfix.outputs.flag }}
        REVERT: ${{ steps.revert.outputs.flag }}
        ROAST_PR_COMMIT: ${{steps.latest-commit.outputs.result}}
        SKIP_ROAST_BY_DEV: ${{steps.skipRoastByDev.outputs.result}}
        ONLY_IGNORE_FILES: ${{ env.ONLY_IGNORE_FILES }}
        GIT_TOKEN :  ${{ secrets.CI_BOT_TOKEN }}
      run: |
        sh ./.github/actions/triggerBvtSuite.sh
    - name: Check Test file has changed or added
      if : ${{github.event_name == 'pull_request'}}
      uses: actions/github-script@0.9.0
      id: service-changed
      with:
        result-encoding: string
        script: |
          const result = await github.pulls.listFiles({
            owner: context.payload.repository.owner.login,
            repo: context.payload.repository.name,
            pull_number: context.payload.number,
            per_page: 100
          })
          const testsChanged = result.data.filter(f => f.filename.toLowerCase().includes("test")).length > 0
          const passStep = function(testsChanged){
            let returnValue = testsChanged
            if(!testsChanged){
              const regex = /skiputworkflow.*true/i;
              console.log(context.payload.pull_request.body.toLowerCase())
              returnValue = regex.test(context.payload.pull_request.body.toLowerCase())
            }
            return returnValue
          }
          return Boolean(passStep(testsChanged))
    - name : skip/fail step for PR
      if: ${{ github.event_name == 'pull_request' && steps.service-changed.outputs.result == 'false' }}
      run: |
        echo "Step failed as no test file added or change"
        echo "change skipUTworkflow variable to true in pr description to skip this step"
        exit 1
