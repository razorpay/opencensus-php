name: E2E Tests
on:
  push:
    branches:
      - master
  issue_comment:
    types:
      - created
  pull_request_review:
    types: [submitted]

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  APP_NAME: dashboard
  HOME: /actions-runner/_work
  GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
  NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
  DOCKER_USERNAME: ${{ secrets.HARBOR_DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
  DOCKER_REGISTRY: c.rzp.io
  ARGO_TOKEN: ${{ secrets.ARGO_TOKEN }}
  ImageOS: ubuntu20

jobs:
  build-and-run-e2e:
    name: Run E2E Tests on PR Comment or PR approval or on master merge
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/run-e2e')) ||
      (github.ref == 'refs/heads/master' && !github.event.comment.body) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    timeout-minutes: 60
    runs-on: [self-hosted]
    steps:
      - name: Fetch data of comment's associated PR
        uses: xt0rted/pull-request-comment-branch@v1
        id: comment-branch
        if: ${{ github.event_name == 'issue_comment' && contains(github.event.comment.body, '/run-e2e')}}
        with:
          repo_token: ${{ env.GITHUB_ACCESS_TOKEN }}

      - name: Set Commit ID if its a PR comment
        if: ${{ github.event_name == 'issue_comment' && contains(github.event.comment.body, '/run-e2e')}}
        run: |
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
        env:
          COMMIT_ID: ${{ steps.comment-branch.outputs.sha }}

      - name: Set Commit ID if its on master
        if: ${{ github.ref == 'refs/heads/master' && !github.event.comment.body }}
        run: |
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
        env:
          COMMIT_ID: ${{ github.sha }}

      - name: Set Commit ID if it's a PR approval
        if: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'approved' }}
        run: |
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
        env:
          COMMIT_ID: ${{ github.event.pull_request.head.sha }}

      - name: Echo COMMIT_ID
        run: |
          echo "COMMIT_ID: ${{ env.COMMIT_ID }}"

      - name: Checkout Codebase
        uses: actions/checkout@v2

      - name: Use Node v18.12.1
        uses: actions/setup-node@v1
        with:
          node-version: 18.12.1
      - name: Install libraries for webp conversion
        run: |
          apt-get update && apt-get install -y libjpeg-dev libpng-dev libtiff-dev libgif-dev

      - name: Setup yarn
        run: npm install -g yarn

      - name: Install dependencies with caching
        uses: ./.github/actions
        with:
          npm_razorpay_token: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          github_access_token: ${{ secrets.CI_BOT_TOKEN }}

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          tags: ${{env.DOCKER_REGISTRY}}/razorpay/${{env.APP_NAME}}_fe_e2e:${{ env.COMMIT_ID }}
          push: true
          file: ./Dockerfile.e2e
          secrets: |
            github_access_token=${{env.GITHUB_ACCESS_TOKEN}}
            npm_razorpay_token=${{env.NPM_RAZORPAY_TOKEN}}
          build-args: |
            APP_NAME=${{env.APP_NAME}}

      - name: Wait for tests to succeed
        uses: lewagon/wait-on-check-action@v1.2.0
        with:
          ref: ${{ env.COMMIT_ID }}
          check-name: "Build Dashboard"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Update devstack.json with prod commits
        run: yarn run add-prod-commits

      - name: E2E Test Webhook
        run: yarn test:e2e-infra
        env:
          COMMIT_ID: ${{ env.COMMIT_ID }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Required DEVSTACK_CONFIG_PATH, After upgarding universe test version which supports devstack config path
          # DEVSTACK_CONFIG_PATH: ./e2e/devstackConfig/devstack.json
          JOB_URL: "https://argo.dev.razorpay.in/api/v1/events/argo-workflows/dashboard-fe-e2e"
