name: E2E Tests
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  APP_NAME: dashboard
  HOME: /actions-runner/_work
  GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
  NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
  DOCKER_USERNAME: ${{ secrets.HARBOR_DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
  DOCKER_REGISTRY: c.rzp.io
  ARGO_TOKEN: ${{ secrets.ARGO_TOKEN }}
  ImageOS: ubuntu20

jobs:
  build-and-run-e2e:
    name: Run E2E Tests on PR Comment or on master merge
    if: |
      (!!(github.event.pull_request) && contains(github.event.pull_request.labels.*.name, 'pr-ready-for-e2e')) ||
      (github.ref == 'refs/heads/master')
    timeout-minutes: 60
    runs-on: [non-api-premium]
    steps:
      - name: Set Commit ID on PR
        if: ${{ !!(github.event.pull_request) && contains(github.event.pull_request.labels.*.name, 'pr-ready-for-e2e') }}
        run: |
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
        env:
          COMMIT_ID: ${{ github.event.pull_request.head.sha }}

      - name: Set Commit ID if its on master
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
        env:
          COMMIT_ID: ${{ github.sha }}

      - name: Echo COMMIT_ID for changes
        run: |
          echo "COMMIT_ID: ${{ env.COMMIT_ID }}"

      - name: Preparing Workflow Link
        id: e2e_github_workflow_action
        run: |
          echo "::set-output name=workflow_link::https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post workflow initiation notification
        uses: mshick/add-pr-comment@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          message: |
            `Frontend E2E Workflow docker build started` [Visit ongoing action](${{ steps.e2e_github_workflow_action.outputs.workflow_link }})
          allow-repeats: true

      - name: Checkout Codebase
        uses: actions/checkout@v3
        with:
          ref: ${{ env.COMMIT_ID }}

      - name: Use Node v18.12.1
        uses: actions/setup-node@v1
        with:
          node-version: 18.12.1

      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          tags: ${{env.DOCKER_REGISTRY}}/razorpay/${{env.APP_NAME}}_fe_e2e:${{ env.COMMIT_ID }}
          push: true
          file: ./Dockerfile.e2e
          secrets: |
            github_access_token=${{env.GITHUB_ACCESS_TOKEN}}
            npm_razorpay_token=${{env.NPM_RAZORPAY_TOKEN}}
          build-args: |
            APP_NAME=${{env.APP_NAME}}
            INCLUDE_GROUPS=@project=payments|@project=partner-dashboard
            EXCLUDE_GROUPS=

      - name: Wait for dashboard's docker image to be built
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ env.COMMIT_ID }}
          check-name: "Build Dashboard"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Update downstream dependencies' commits in devstack.json
        # If this steps fails, it's because one of the endpoints in addProdCommits.js threw an error.
        timeout-minutes: 2
        run: npm run add-prod-commits

      - name: Initiate E2E Tests via an argo webhook
        run: npm run test:e2e-infra
        env:
          COMMIT_ID: ${{ env.COMMIT_ID }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Required DEVSTACK_CONFIG_PATH, After upgarding universe test version which supports devstack config path
          # DEVSTACK_CONFIG_PATH: ./e2e/devstackConfig/devstack.json
          JOB_URL: "https://argo.dev.razorpay.in/api/v1/events/argo-workflows/dashboard-fe-e2e"
