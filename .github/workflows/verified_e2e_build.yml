name: Verified E2E Build Trigger

on: deployment

env:
  IMAGE_TAG: ${{ github.event.deployment.payload.image_tag }}

jobs:

  # Job to print the commit ID and Image Tag
  print-commit-id:
    name: Print Commit ID and Image Tag
    runs-on: [ self-hosted ]
    steps:
      - name: Triggered Commit ID and Image Tag
        run: |
          echo "Commit ID: ${{ github.sha }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"

  
  ######## Build Fetch Credstash Multi-Arch Docker Image Natively Without Using Emulation ########
  build-fetch-credstash-native:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
    name: Build Credstash Native
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - ${{ matrix.platform }}
    continue-on-error: false
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: build
        uses: docker/build-push-action@v6
        with:
          tags: c.rzp.io/razorpay/api:fetch-credstash-${{ env.IMAGE_TAG }}-${{ matrix.platform }}
          push: true
          file: ./Dockerfile.fetchCredstash
          build-args: |
            API_BASE_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:php-8.1-api-web-v2
            CURL_CLI_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:curl-7.82
          secrets: |
            git_token=${{ secrets.GIT_TOKEN }}

  build-fetch-credstash-multiarch:
    # This action combines the amd64 & arm64 docker images from the previous job (build-fetch-credstash-native) & form a multi-arch docker image
    needs:
      - build-fetch-credstash-native
    name: Build Fetch Credstash Harbor
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - linux-arm64
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v4
        id: metadata
        with:
          images: c.rzp.io/${{ github.repository }}
          flavor: suffix=fetch-credstash-${{ github.event.pull_request.head.sha || github.sha }}
      - uses: int128/docker-manifest-create-action@v1
        with:
          tags: c.rzp.io/razorpay/api:fetch-credstash-${{ env.IMAGE_TAG }}
          suffixes: |
            -linux-amd64
            -linux-arm64

  ######## Build Web Multi-Arch Docker Image Natively Without Using Emulation ########
  build-web-native:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
    name: Build Web Native
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - ${{ matrix.platform }}
    continue-on-error: false
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: build
        uses: docker/build-push-action@v6
        with:
          tags: c.rzp.io/razorpay/api:${{ env.IMAGE_TAG }}-${{ matrix.platform }}
          push: true
          file: ./Dockerfile.web
          build-args: |
            GIT_COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            CACHEBUST=${{ github.event.pull_request.head.sha || github.sha }}
            GIT_USERNAME=rzp
            API_BASE_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:php-8.1-api-web-v2
            CURL_CLI_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:curl-7.82
            OPENCENSUS_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:php-8.1-opencensus
          secrets: |
            git_token=${{ secrets.GIT_TOKEN }}

  build-web-multiarch:
    # This action combines the amd64 & arm64 docker images from the previous job (build-web-native) & form a multi-arch docker image
    needs:
      - build-web-native
    name: Build Web Harbor
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - linux-arm64
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v4
        id: metadata
        with:
          images: c.rzp.io/${{ github.repository }}
          flavor: suffix=-${{ github.event.pull_request.head.sha || github.sha }}
      - uses: int128/docker-manifest-create-action@v1
        with:
          tags: c.rzp.io/razorpay/api:${{ env.IMAGE_TAG }}
          suffixes: |
            -linux-amd64
            -linux-arm64

  ######## Build Worker Multi-Arch Docker Image Natively Without Using Emulation ########
  build-worker-native:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
    name: Build Worker Native
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - ${{ matrix.platform }}
    continue-on-error: false
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: build
        uses: docker/build-push-action@v6
        with:
          tags: c.rzp.io/razorpay/api:worker-${{ env.IMAGE_TAG }}-${{ matrix.platform }}
          push: true
          file: ./Dockerfile.worker
          build-args: |
            GIT_COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            GIT_USERNAME=rzp
            CACHEBUST=${{ github.event.pull_request.head.sha || github.sha }}
            API_BASE_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:php-8.1-api-worker-v2
          secrets: |
            git_token=${{ secrets.GIT_TOKEN }}

  build-worker-multiarch:
    # This action combines the amd64 & arm64 docker images from the previous job (build-worker-native) & form a multi-arch docker image
    needs:
      - build-worker-native
    name: Build Worker Harbor
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - linux-arm64
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v4
        id: metadata
        with:
          images: c.rzp.io/${{ github.repository }}
          flavor: suffix=worker-${{ github.event.pull_request.head.sha || github.sha }}
      - uses: int128/docker-manifest-create-action@v1
        with:
          tags: c.rzp.io/razorpay/api:worker-${{ env.IMAGE_TAG }}
          suffixes: |
            -linux-amd64
            -linux-arm64

  ######## Build CheckOut Multi-Arch Docker Image Natively Without Using Emulation ########
  build-checkout-native:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
    name: Build Checkout Native
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - ${{ matrix.platform }}
    continue-on-error: false
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
      - name: build
        uses: docker/build-push-action@v6
        with:
          tags: c.rzp.io/razorpay/api:checkout-${{ env.IMAGE_TAG }}-${{ matrix.platform }}
          push: true
          file: ./Dockerfile.checkout
          build-args: |
            GIT_COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            GIT_USERNAME=rzp
            NGINX_IMAGE=c.rzp.io/razorpay/onggi-multi-arch:nginx-alpine-3.12
          secrets: |
            git_token=${{ secrets.GIT_TOKEN }}

  build-checkout-multiarch:
    # This action combines the amd64 & arm64 docker images from the previous job (build-checkout-native) & form a multi-arch docker image
    needs:
      - build-checkout-native
    name: Build Checkout Harbor
    if: github.event.deployment.environment == 'e2e' # Run only if environment is e2e
    runs-on:
      - api-public
      - linux-arm64
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v4
        id: metadata
        with:
          images: c.rzp.io/${{ github.repository }}
          flavor: suffix=checkout-${{ github.event.pull_request.head.sha || github.sha }}
      - uses: int128/docker-manifest-create-action@v1
        with:
          tags: c.rzp.io/razorpay/api:checkout-${{ env.IMAGE_TAG }}
          suffixes: |
            -linux-amd64
            -linux-arm64
