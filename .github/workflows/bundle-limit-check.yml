name: Bundle Asset Checker

on:
  pull_request:
    types: [ edited, opened, synchronize, reopened ]
    branches:
      - master

env:
  GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
  DASHBOARD_SLACK_WEBHOOK_URL: ${{ secrets.DASHBOARD_SLACK_WEBHOOK_URL }}

jobs:
  asset-checker:
    name: Bundle Asset Checker
    runs-on: [self-hosted]
    continue-on-error: true
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Use Node v16
        uses: actions/setup-node@v1
        with:
          node-version: 16.13.1

      - name: Install libraries for webp conversion
        run: |
          apt-get update && apt-get install -y libjpeg-dev libpng-dev libtiff-dev libgif-dev

      - run: npm install -g yarn

      - name: Install Dependencies
        run: |
          npm config set unsafe-perm true
          HUSKY=0 npm ci
        env:
          NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}

      - name: Build All
        run: cd web && npm run test:build:merchant
        env:
          NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          VERSION: ${{ github.sha }}

      - name: Size Limit Action - DangerJS
        id: sizelimit_dangerjs
        uses: danger/danger-js@10.6.6
        with:
          args: "--id sizelimit_dangerjs --dangerfile dangerfile-bundlelimit.js"
        env:
          GITHUB_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          DANGER_DISABLE_TRANSPILATION: 'true'

      - name: Print PR Report
        run: echo "PR Report - ${{ steps.sizelimit_dangerjs.outputs.bundleSizeReport }}"