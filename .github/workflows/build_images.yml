on: [push]
jobs:
  cancel:
    runs-on: [self-hosted]
    name: Cancel Previous Runs
    if: always()
    steps:
    - uses: styfle/cancel-workflow-action@d57d93c3a8110b00c3a2c0b64b8516013c9fd4c9
      if: github.ref != 'refs/heads/master'
      name: cancel old workflows
      id: cancel
      with:
        workflow_id: "build_images.yml"
        access_token: ${{ github.token }}
    - if: github.ref == 'refs/heads/master'
      name: Don't cancel old workflows
      id: dont_cancel
      run: |
        echo "Don't cancel old workflow"
  validate_php_syntax:
    runs-on: [self-hosted]
    needs: [cancel]
    container:
      image: c.rzp.io/razorpay/onggi:php-7.2-api-web-v2
      options: "--entrypoint /bin/bash"
      credentials:
        username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
        password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
    continue-on-error: false
    name: Validate PHP Syntax
    steps:
    - name: checkout
      id: checkout
      uses: razorpay/checkout-action@08eef2bd6ada50786812e7351457a762856a532f
    - name: prepare_test
      run: ci-assets/prepare_test.sh
      env:
        GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    - name: validate_php_syntax
      run: ci-assets/validate_php_syntax.sh
  build-web:
    runs-on: [self-hosted]
    needs: [cancel]
    continue-on-error: false
    name: Build Web Harbor
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v1
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      - name: build
        uses: docker/build-push-action@v2
        with:
          tags: c.rzp.io/razorpay/api:${{ github.sha }}
          push: true
          file: ./Dockerfile.web
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_TOKEN=${{ secrets.GIT_TOKEN }}
            GIT_USERNAME=rzp
            ONGGI_IMAGE=c.rzp.io/razorpay/onggi:php-7.2-api-web-v2
            ARMORY_IMAGE=c.rzp.io/razorpay/armory:wkhtmltopdf-v182
            OPENCENSUS_IMAGE=c.rzp.io/razorpay/onggi:opencensus-php-v2020.10.28

  build-worker:
     runs-on: [self-hosted]
     needs: [ cancel ]
     continue-on-error: false
     name: Build Worker Harbor
     steps:
       - name: Login to Harbor
         uses: docker/login-action@v1
         with:
           registry: c.rzp.io
           username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
           password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
       - name: Set up Docker Buildx
         id: buildx
         uses: docker/setup-buildx-action@v1
       - name: build
         uses: docker/build-push-action@v2
         with:
           tags: c.rzp.io/razorpay/api:worker-${{ github.sha }}
           push: true
           file: ./Dockerfile.worker
           build-args: |
             GIT_COMMIT_HASH=${{ github.sha }}
             GIT_TOKEN=${{ secrets.GIT_TOKEN }}
             GIT_USERNAME=rzp
             ONGGI_IMAGE=c.rzp.io/razorpay/onggi:php-7.2-api-web-v2
             ARMORY_IMAGE=c.rzp.io/razorpay/armory:wkhtmltopdf-v182
             OPENRESTY_IMAGE=c.rzp.io/razorpay/onggi:openresty-1.17.8.2-0-alpine-fat-nosse42

  build-checkout:
     runs-on: [self-hosted]
     needs: [cancel]
     continue-on-error: false
     name: Build Checkout Harbor
     steps:
       - name: Login to Harbor
         uses: docker/login-action@v1
         with:
           registry: c.rzp.io
           username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
           password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
       - name: Set up Docker Buildx
         id: buildx
         uses: docker/setup-buildx-action@v1
       - name: build
         uses: docker/build-push-action@v2
         with:
           tags: c.rzp.io/razorpay/api:checkout-${{ github.sha }}
           push: true
           file: ./Dockerfile.checkout
           build-args: |
             GIT_COMMIT_HASH=${{ github.sha }}
             GIT_TOKEN=${{ secrets.GIT_TOKEN }}
             GIT_USERNAME=rzp
             NGINX_IMAGE=c.rzp.io/razorpay/onggi:nginx-alpine-3.12

  build-openresty:
     runs-on: [self-hosted]
     needs: [cancel]
     continue-on-error: false
     name: Build Openresty Harbor
     steps:
       - name: Login to Harbor
         uses: docker/login-action@v1
         with:
           registry: c.rzp.io
           username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
           password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
       - name: Set up Docker Buildx
         id: buildx
         uses: docker/setup-buildx-action@v1
       - name: build
         uses: docker/build-push-action@v2
         with:
           tags: c.rzp.io/razorpay/api:openresty-${{ github.sha }}
           push: true
           file: ./Dockerfile.openresty
           build-args: |
             GIT_COMMIT_HASH=${{ github.sha }}
             GIT_TOKEN=${{ secrets.GIT_TOKEN }}
             GIT_USERNAME=rzp
             ONGGI_IMAGE=c.rzp.io/razorpay/onggi:php-7.2-api-web-v2
             OPENRESTY_IMAGE=c.rzp.io/razorpay/onggi:openresty-1.17.8.2-0-alpine-fat-nosse42
  trigger_regression_suite:
   runs-on: [self-hosted]
   name: Regression Suite
   needs: [ validate_php_syntax, build-web, build-worker, build-checkout, build-openresty]
   if: github.ref == 'refs/heads/master'
   steps:
   - name: Webhook
     run: |
       curl -X POST -H "Content-Type: application/json" \
       -d '{ "branch" : "master" , "commit" : "${{ github.sha }}" , "repo" : "api" }' \
       https://${{ secrets.SPINNAKER_BASIC_AUTH }}@deploy-github-actions.razorpay.com/webhooks/webhook/x-regression
