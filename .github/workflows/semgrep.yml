name: Semgrep Scan
on:
  pull_request: {}
  push:
    branches: ["master"]
jobs:
  semgrep:
    name: Scan
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v2
      - uses: returntocorp/semgrep-action@v1
        with:
          auditOn: push
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: 339
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
