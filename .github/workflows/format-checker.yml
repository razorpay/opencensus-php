name: Format Checker Workflow
on: pull_request
jobs:
  validate:
    runs-on: [self-hosted]
    continue-on-error: false
    name: Format Checker
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Use Node v12
        uses: actions/setup-node@v1
        with:
          node-version: 12.13.0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v9.3
        with:
          files: |
            .(js|json|jsx|ts|tsx)$

      - name: ESLint PR Check
        run: |
          npm ci
          base=$base npm run validate-lint
          npx eslint \
          --ext .js,.jsx,.ts,.tsx \
          ${{ steps.changed-files.outputs.all_modified_files }}
        env:
          NPM_RAZORPAY_TOKEN: ${{ secrets.NPM_RAZORPAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          base: origin/${{ github.base_ref }}
