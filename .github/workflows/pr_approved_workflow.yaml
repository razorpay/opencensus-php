name: Trigger Roast On PR Approval

on:
  pull_request_review:
    types: [submitted]

jobs:
  pull_request_approved:
    if: github.event.review.state == 'approved'
    runs-on: [self-hosted]
    steps:
    - name: checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: rebase-branch
      id: rebase
      uses: cirrus-actions/rebase@1.4
      env:
        GITHUB_TOKEN:  ${{ secrets.GIT_ACTION_TOKEN }}
    # If Rebase failed, then comment in PR to resolve manually    
    - name: Comments
      if: ${{failure()}}
      uses: mshick/add-pr-comment@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GIT_ACTION_TOKEN }}
      with:
        message: |
          **Conflict Error Please resolve manually**
        allow-repeats: true
    - name: Validate skipRoast Flag for PR
      uses: actions/github-script@0.9.0
      id: skip-roast
      with:
        result-encoding: string
        script: |
          const regex = /skiproast.*true/i;
          skipFlag = regex.test(context.payload.pull_request.body.toLowerCase())
          return Boolean(skipFlag)
