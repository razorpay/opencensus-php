  payment_test_suite:
    runs-on: [self-hosted]
    needs: [cancel]
    container:
      image: c.rzp.io/razorpay/onggi:php-7.2-api-web
      options: "--entrypoint /bin/bash"
      credentials:
        username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
        password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
    continue-on-error: false
    name: Payment Test Suite
    steps:
    - name: checkout
      id: checkout
      uses: actions/checkout@v2
    - name: prepare_test
      run: ci-assets/prepare_test.sh
      env:
        GIT_TOKEN: ${{ secrets.GIT_ACTION_TOKEN }}
    - name: payment_test_suite
      run: ci-assets/payment_test_suite.sh
      env:
        DB_LIVE_HOST: mysql
        DB_TEST_HOST: mysql
        DB_AUTH_HOST: mysql
        DB_LIVE_DATABASE: api_live
        DB_TEST_DATABASE: api_test
        DB_AUTH_DATABASE: api_auth
        DB_UPI_PAYMENTS_MOCKED: "false"
        DB_UPI_PAYMENTS_LIVE_HOST: mysql
        DB_UPI_PAYMENTS_TEST_HOST: mysql
        REDIS_HOST: redis
        QUERY_CACHE_REDIS_HOST: redis
        QUERY_CACHE_REDIS_PORT: 6379
        MUTEX_REDIS_HOST: redis
        MUTEX_REDIS_PORT: 6379
        THROTTLE_REDIS_HOST: redis
        THROTTLE_REDIS_PORT: 6379
        ES_HOST: elasticsearch
        ES_AUDIT_HOST: elasticsearch
        LQEXT_TESTING_TXN_SKIP_COUNT: 5
    services:
      redis:
        image: redis
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: api
          MYSQL_ROOT_PASSWORD: root
      elasticsearch:
        image: elasticsearch:5.2-alpine
        env:
          ES_JAVA_OPTS: -Xms512m -Xmx512m
  workflow_status:
    runs-on: [self-hosted]
    continue-on-error: false
    name: Update Status Check
    needs: [
      validate_php_syntax,
      application_test_suite,
      features_test_suite,
      features_2_test_suite,
      features_3_test_suite,
      features_4_test_suite,
      features_6_test_suite,
      gateway_1_test_suite,
      gateway_2_test_suite,
      gateway_3_test_suite,
      payment_test_suite,
      build-web,
      build-worker,
      build-checkout,
      build-openresty,
      build-dockerhub-web,
      build-dockerhub-worker,
      build-dockerhub-checkout,
      build-dockerhub-openresty
      ]
    if: always()
    steps:
    - name: Failed
      id: failed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo 'Failing the workflow for github status check.'
        curl -X POST -H "Content-Type: application/json" -H "Authorization: token ${{ github.token }}" \
        -d '{ "state" : "failure" , "context" : "github/combined-status-check" , "description" : "github/combined-status-check", "target_url" : "https://github.com/razorpay/api" }' \
        https://api.github.com/repos/razorpay/api/statuses/${{ github.sha }}
        exit 1
    - name: Success
      if: steps.failed.conclusion == 'skipped'
      run: |
        echo 'Status check has passed!'
        curl -X POST -H "Content-Type: application/json" -H "Authorization: token ${{ github.token }}" \
        -d '{ "state" : "success" , "context" : "github/combined-status-check" , "description" : "github/combined-status-check", "target_url" : "https://github.com/razorpay/api" }' \
        https://api.github.com/repos/razorpay/api/statuses/${{ github.sha }}
        exit 0
  slack-notify:
    runs-on : [self-hosted]
    name: Notify build
    needs: [workflow_status]
    if: always()
    steps:
    - name: Sending build success notification to tech_builds (Slack)
      if: github.ref != 'refs/heads/master' && needs.workflow_status.result == 'success'
      env:
        SLACK_MESSAGE: 'Build Success.'
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_USERNAME: Github Actions # Optional. (defaults to webhook app)
        SLACK_CHANNEL: tech_builds # Optional. (defaults to webhook)
        SLACK_ICON: https://avatars3.githubusercontent.com/u/9919?s=40&v=4 # Optional. can be (repository, sender, an URL) (defaults to webhook app avatar)
      uses:  rtCamp/action-slack-notify@ca2febb
    - name: Sending build failed notification to tech_builds (Slack)
      if: github.ref != 'refs/heads/master' && needs.workflow_status.result != 'success'
      env:
        SLACK_MESSAGE: 'Build failed.'
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_COLOR: '#8B0000'
        SLACK_USERNAME: Github Actions # Optional. (defaults to webhook app)
        SLACK_CHANNEL: tech_builds # Optional. (defaults to webhook)
        SLACK_ICON: https://avatars3.githubusercontent.com/u/9919?s=40&v=4 # Optional. can be (repository, sender, an URL) (defaults to webhook app avatar)
      uses:  rtCamp/action-slack-notify@ca2febb
    - name: Sending build failed notification to tech_backend (Slack)
      if: github.ref == 'refs/heads/master' && needs.workflow_status.result != 'success'
      env:
        SLACK_MESSAGE: 'Master Build failed.'
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_COLOR: '#8B0000'
        SLACK_USERNAME: Github Actions # Optional. (defaults to webhook app)
        SLACK_CHANNEL: tech_builds # Optional. (defaults to webhook)
        SLACK_ICON: https://avatars3.githubusercontent.com/u/9919?s=40&v=4 # Optional. can be (repository, sender, an URL) (defaults to webhook app avatar)
      uses:  rtCamp/action-slack-notify@ca2febb
  trigger_regression_suite:
    runs-on: [self-hosted]
    name: Regression Suite
    needs: [workflow_status]
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Webhook
      run: |
        curl -X POST -H "Content-Type: application/json" \
        -d '{ "branch" : "master" , "commit" : "${{ github.sha }}" , "repo" : "api" }' \
        https://${{ secrets.SPINNAKER_BASIC_AUTH }}@deploy-github-actions.razorpay.com/webhooks/webhook/x-regression
