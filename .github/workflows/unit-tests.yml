          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          repository: razorpay/api
          tags: openresty-${{ github.sha }}
          dockerfile: Dockerfile.openresty
          build_args: GIT_COMMIT_HASH=${{ github.sha }},GIT_TOKEN=${{ secrets.GIT_ACTION_TOKEN }},GIT_USERNAME=rzp,ONGGI_IMAGE=c.rzp.io/razorpay/onggi:php-7.2-api
  build-dockerhub-web:
    runs-on: [ self-hosted ]
    needs: [ cancel ]
    continue-on-error: false
