name: Deploy - Dashboard

on: deployment

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.environment }}-${{ github.event.deployment.payload.deploymentModule }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.event.deployment.ref }}

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted]
    if: ${{ github.event.deployment.payload.deploymentModule == 'web' }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v2

      - name: Use Node v18.12.1
        uses: actions/setup-node@v1
        with:
          node-version: 18.12.1

      - name: Setup pnpm
        run: npm install -g pnpm@~9.0

      # Set AWS creds and download Artifacts
      - name: Configure AWS credentials - Actions Cache
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.ACTIONS_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACTIONS_CACHE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.ACTIONS_CACHE_AWS_REGION}}

      - name: Download artifacts
        run: |
          aws s3 cp s3://rzp-actions-cache/dashboard-${VERSION}.tar.gz public.tar.gz
          tar -xf public.tar.gz

      - name: Install Sentry CLI
        # skip sentry cli, if already exist
        continue-on-error: true
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IO_AUTH_TOKEN }}
          SENTRY_ORG: rzp
          SENTRY_PROJECT: dashboard
        run: |
          # Create a new release
          sentry-cli releases new ${VERSION}

          # Upload sourcemaps
          sentry-cli releases files ${VERSION} \
            upload-sourcemaps ./public/dist \
            --log-level=info \
            --url-prefix=~/dashboard/dist/ \
            --ignore js/pokedex js/razorx js/merchantTnc js/newAuth

          # Commit Integration
          sentry-cli releases set-commits ${VERSION} \
            --commit "razorpay/dashboard@${VERSION}"

          # Finalize the release
          sentry-cli releases finalize ${VERSION}

          # Associate deploy with release
          sentry-cli releases deploys ${VERSION} \
            new -e ${{ github.event.deployment.environment }}

      - name: Remove Sourcemap Files
        if: ${{ github.event.deployment.environment == 'prod' }}
        run: find public -name "*.map" -type f -delete

      # Prod
      - name: Deploy - Prod
        if: ${{ github.event.deployment.environment == 'prod' }}
        env:
          CDN_PATH: ${{ github.event.deployment.payload.CDN_PATH }}
          AWS_KEY: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.PROD_AWS_ACCESS_SECRET }}
          AWS_CDN_BUCKET: "rzp-1415-prod-checkout-live"
          AWS_REGION: "ap-south-1"
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          # Requirements for running s3sync.js
          npm install multi-glob aws-sdk
          # Show what all will get synced
          ls -laR public/dist/
          ./s3sync.js

      # Non Prod deployments
      - name: Deploy Stage
        if: ${{ github.event.deployment.environment != 'prod' }}
        env:
          AWS_KEY: ${{ secrets.STAGE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.STAGE_AWS_ACCESS_SECRET }}
          AWS_CDN_BUCKET: "rzp-1018-nonprod-betacdn"
          AWS_REGION: "ap-south-1"
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          # CDN_PATH for beta: dashboard, for zeta dashboard/zeta, for automation dashboard/qa
          # Expecting payload with CDN_PATH from spinakker
          CDN_PATH: ${{ github.event.deployment.payload.CDN_PATH }}
        run: |
          # Requirements for running s3sync.js
          npm install multi-glob aws-sdk
          # Show what all will get synced
          ls -laR public/dist/
          ./s3sync.js

      - name: Mark Deployment Success on GitHub
        if: ${{ success() }}
        run: |
          curl --location --request POST 'https://api.github.com/repos/razorpay/dashboard/deployments/${{ github.event.deployment.id }}/statuses' \
          --header 'Authorization: token ${{ github.token }}' \
          --header 'Accept: application/vnd.github.everest-preview+json' \
          --header 'Content-Type: application/json' \
          --data-raw '{
              "environment": "staging",
              "state": "success"
            }'
