name: UAT Workflow

on:
  schedule:
    - cron: '0 1 * * *'

jobs:
  pull_request:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        uses: razorpay/checkout-action@08eef2bd6ada50786812e7351457a762856a532f
      # Trigger back-merge master
      - name: backmerge-master
        id: backmerge
        uses: devmasx/merge-branch@a1752b9ba42bb417ec19be7dc974e2faf77d3ef2
        with:
          type: now
          from_branch: master
          target_branch: uat_master
          github_token: ${{ secrets.CI_BOT_TOKEN }}
      # Trigger report-status
      - name : report-status
        if : always()
        uses: ravsamhq/notify-slack-action@master
        with:
          status: ${{ job.status }}
          token: ${{ secrets.CI_BOT_TOKEN }}
          notification_title: '{workflow} has {status_message}'
          message_format: '{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>'
          notify_when: 'failure'
          mention_groups: 'S025UM0NJ8N'
          mention_groups_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
