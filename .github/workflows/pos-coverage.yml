name: Sonar Code Coverage for POS app

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - master
    paths:
      - apps/pos/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
  APP_NAME: dashboard
  HOME: /actions-runner/_work

jobs:
  coverage:
    name: Sonar Scanner - POS App
    runs-on: self-hosted
    if: ${{ github.ref == 'refs/heads/master'}}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}

      - name: Install dependencies with caching
        uses: ./.github/actions/package-installer
        with:
          github_access_token: ${{ secrets.CI_BOT_TOKEN }}

      - name: Test POS micro app
        working-directory: ./apps/pos
        run: |
          pnpm test:jest
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          DISABLE_REPORT_PORTAL_INTEGRATION: true

      - name: SonarQube Scan
        id: pr_sonarqube_analysis_pos_micro_app
        uses: sonarsource/sonarcloud-github-action@v1.6
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST }}
        with:
          projectBaseDir: ./apps/pos
          args: >
            -Dsonar.host.url=${{ secrets.SONARQUBE_HOST }}
            -Dsonar.login=${{ secrets.SONARQUBE_TOKEN }}
            -Dsonar.projectKey=DashboardPOSMicroApp
            -Dsonar.projectName=DashboardPOSMicroApp
            -Dsonar.projectVersion=${{ github.sha }}
