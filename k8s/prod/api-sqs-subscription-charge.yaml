apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    name: api-sqs-subscription-charge
  name: api-sqs-subscription-charge
  namespace: api
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: api-sqs-subscription-charge
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        iam.amazonaws.com/role: kube-prod-api
      creationTimestamp: null
      labels:
        name: api-sqs-subscription-charge
    spec:
      containers:
      - args:
        - sqs_multi_default
        - api-subscriptions-charge
        - "20"
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              key: APP_MODE
              name: api
        image: razorpay/api:051f76e0f053a31df0ac9724673706fb31afb37f
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /usr/bin/php
              - artisan
              - queue:restart
        name: api
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/storage/logs/
          name: trace
        - mountPath: /var/log/apache/
          name: apache
      dnsPolicy: Default
      imagePullSecrets:
      - name: registry
      nodeSelector:
        node-role.kubernetes.io/kluster-api-queue-worker-node: ""
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 300
      volumes:
      - hostPath:
          path: /var/log/fluentd/splunk/api/trace
          type: ""
        name: trace
      - hostPath:
          path: /var/log/fluentd/splunk/api/apache
          type: ""
        name: apache
