apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: echo
  namespace: echo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: echo
  template:
    metadata:
      annotations:
        iam.amazonaws.com/role: iam-echo-dashboard
      labels:
        name: echo
    spec:
      nodeSelector:
        node-role.kubernetes.io/node-services: ""
      imagePullSecrets:
      - name: registry
      containers:
      - env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: echo
              key: APP_MODE
        name: echo
        image: razorpay/gimli:cdbad7371804660c4e2a34e8332540d041e342b5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        volumeMounts:
          - name: trace
            mountPath: /app/storage/logs/
          - name: nginx
            mountPath: /var/log/nginx/
        readinessProbe:
          httpGet:
            path: /v1/status
            port: 80
            httpHeaders:
              - name: Host
                value: echo-dashboard.razorpay.in
          initialDelaySeconds: 60
          periodSeconds: 120
        livenessProbe:
          httpGet:
            path: /commit.txt
            port: 80
            httpHeaders:
              - name: Host
                value: echo-dashboard.razorpay.in
          initialDelaySeconds: 60
          periodSeconds: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/rm","-f","/app/public/commit.txt",";","sleep","5",";","/usr/sbin/nginx","-s","quit"]
      terminationGracePeriodSeconds: 60
      volumes:
      - name: trace
        hostPath:
          path: /var/log/fluentd/splunk/echo/trace
      - name: nginx
        hostPath:
          path: /var/log/fluentd/splunk/echo/nginx
      dnsPolicy: ClusterFirst
      restartPolicy: Always
