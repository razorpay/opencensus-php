apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: api-web
  namespace: perf
spec:
  replicas: 2
  selector:
    matchLabels:
      name: api-web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        iam.amazonaws.com/role: perf-api
      labels:
        name: api-web
    spec:
      containers:
      - args:
        - web
        command:
        - /entrypoint.sh
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              key: APP_MODE
              name: api
        image: razorpay/api:master-197b2ca15436e35387b76ece20af52bf3ae51818
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/rm
              - -f
              - /app/public/commit.txt
              - ;
              - sleep
              - "5"
              - ;
              - /usr/sbin/apachectl
              - -s
              - quit
        livenessProbe:
          httpGet:
            path: /commit.txt
            port: 80
            httpHeaders:
              - name: Host
                value: perf-api.razorpay.com
          initialDelaySeconds: 60
          periodSeconds: 2
        name: api
        ports:
        - containerPort: 80
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /commit.txt
            port: 80
            httpHeaders:
              - name: Host
                value: perf-api.razorpay.com
          initialDelaySeconds: 60
          periodSeconds: 120
        resources:
          limits:
            cpu: "1"
            memory: 2861Mi
          requests:
            cpu: "1"
            memory: 2861Mi
        volumeMounts:
        - mountPath: /app/storage/logs/
          name: trace
        - mountPath: /var/log/apache/
          name: apache
      dnsPolicy: Default
      imagePullSecrets:
      - name: registry
      nodeSelector:
        node-role.kubernetes.io/qa: ""
      restartPolicy: Always
      volumes:
      - name: trace
        hostPath:
          path: /var/log/fluentd/splunk/api/trace
      - name: apache
        hostPath:
          path: /var/log/fluentd/splunk/api/apache