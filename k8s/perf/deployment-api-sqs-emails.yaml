apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: api-sqs-emails
  namespace: perf
spec:
  replicas: 1
  selector:
    matchLabels:
      name: api-sqs-emails
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        iam.amazonaws.com/role: perf-api
      labels:
        name: api-sqs-emails
    spec:
      containers:
      - name: api
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: api
              key: APP_MODE
        image: razorpay/api:master-197b2ca15436e35387b76ece20af52bf3ae51818
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh"]
        args: ["sqs_multi_default", "emails", "10"]
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            memory: "244Mi"
            cpu: "50m" 
          requests:
            memory: "244Mi"
            cpu: "50m"
        lifecycle:
          preStop:
            exec:
              command: ["/usr/bin/php", "artisan", "down"]
        volumeMounts:
          - name: trace
            mountPath: /app/storage/logs/
          - name: apache
            mountPath: /var/log/apache/
      dnsPolicy: Default
      imagePullSecrets:
      - name: registry
      nodeSelector:
        node-role.kubernetes.io/qa: ""
      restartPolicy: Always
      volumes:
      - name: trace
        hostPath:
          path: /var/log/fluentd/splunk/api/trace
      - name: apache
        hostPath:
          path: /var/log/fluentd/splunk/api/apache