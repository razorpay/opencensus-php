apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: api
  namespace: perf
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: api
  template:
    metadata:
      annotations:
        iam.amazonaws.com/role: perf-api
      labels:
        name: api
    spec:
      nodeSelector:
        node-role.kubernetes.io/node-api: ""
      imagePullSecrets:
      - name: registry
      containers:
      - name: api-web
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: api
              key: APP_MODE
        image: razorpay/api:e7f30768b83b69e4e7c20b7cca6fd57a60832e00
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh"]
        args: ["web"]
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        volumeMounts:
          - name: trace
            mountPath: /app/storage/logs/
          - name: apache
            mountPath: /var/log/apache/
        readinessProbe:
          httpGet:
            path: /commit.txt
            port: 80
            httpHeaders:
              - name: Host
                value: perf-api.razorpay.in
          initialDelaySeconds: 60
          periodSeconds: 120
        livenessProbe:
          httpGet:
            path: /commit.txt
            port: 80
            httpHeaders:
              - name: Host
                value: perf-api.razorpay.in
          initialDelaySeconds: 60
          periodSeconds: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/rm","-f","/app/public/commit.txt",";","sleep","5",";","/usr/sbin/apachectl","-k","graceful-stop"]
      - name: api-sqs-main
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: api
              key: APP_MODE
        image: razorpay/api:e7f30768b83b69e4e7c20b7cca6fd57a60832e00
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh"]
        args: ["sqs", "10"]
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        lifecycle:
          preStop:
            exec:
              command: ["/usr/bin/php","artisan","down"]
      - name: api-sqs-gen-live
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: api
              key: APP_MODE
        image: razorpay/api:e7f30768b83b69e4e7c20b7cca6fd57a60832e00
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh"]
        args: ["sqs_multi_default", "api-gen-live", "10"]
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        lifecycle:
          preStop:
            exec:
              command: ["/usr/bin/php", "artisan", "down"]
      - name: api-sqs-gen-test
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: api
              key: APP_MODE
        image: razorpay/api:e7f30768b83b69e4e7c20b7cca6fd57a60832e00
        imagePullPolicy: IfNotPresent
        command: ["/entrypoint.sh"]
        args: ["sqs_multi_default", "api-gen-test", "20"]
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        lifecycle:
          preStop:
            exec:
              command: ["/usr/bin/php", "artisan", "down"]
      - name: api-sqs-webhooks-live
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: api
              key: APP_MODE
